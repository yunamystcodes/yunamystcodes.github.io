<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YunaMyst — Feedback</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:#fff;background:#05030b;display:flex;align-items:center;justify-content:center;padding:18px}.bg{position:fixed;inset:0;z-index:-1;background:linear-gradient(rgba(5,2,15,.58),rgba(5,2,15,.94)),url('https://tec8.com.br/wp-content/uploads/2019/06/Summoners-War.jpg') center/cover no-repeat}.card{width:min(620px,100%);background:linear-gradient(180deg,rgba(12,7,29,.98),rgba(5,4,17,.98));border:1px solid rgba(190,102,255,.5);border-radius:20px;padding:28px;box-shadow:0 25px 80px rgba(0,0,0,.65)}h1{margin:0 0 7px;color:#f0c45c;font:900 28px Georgia,serif}p{color:#c9c0d0;line-height:1.5;margin:0 0 20px}.stars{display:flex;justify-content:center;gap:8px;margin:8px 0 5px}.star{border:0;background:transparent;color:#6f647c;font-size:42px;cursor:pointer;line-height:1;padding:3px;transition:.15s}.star:hover,.star.selected{color:#f0c45c;transform:scale(1.1)}.hint{text-align:center;color:#bdb4ca;font-size:12px;margin-bottom:22px}.field{margin-bottom:16px}label{display:block;font-weight:800;font-size:13px;margin-bottom:7px}input,textarea{width:100%;border:1px solid rgba(190,102,255,.45);border-radius:11px;background:rgba(7,4,18,.9);color:#fff;padding:13px;font:14px Arial;outline:none}input:focus,textarea:focus{border-color:#b65cff;box-shadow:0 0 12px rgba(182,92,255,.15)}textarea{min-height:150px;resize:vertical}.submit{width:100%;border:1px solid #edbd4e;border-radius:11px;background:linear-gradient(#f6cd70,#bd7d1d);color:#251400;padding:14px;font-weight:900;cursor:pointer}.submit:disabled{opacity:.45;cursor:not-allowed}.result{text-align:center;color:#d99cff;font-weight:800;font-size:12px;min-height:18px;margin-top:12px}.feedback-list{margin-top:22px;padding-top:18px;border-top:1px solid rgba(255,255,255,.1)}.feedback-item{padding:12px;border:1px solid rgba(190,102,255,.25);border-radius:11px;background:rgba(10,5,24,.65);margin-top:8px}.feedback-head{display:flex;justify-content:space-between;gap:10px;font-weight:800;font-size:12px}.feedback-stars{color:#f0c45c}.feedback-text{color:#c9c0d0;font-size:12px;line-height:1.45;margin-top:7px;white-space:pre-wrap}.feedback-empty{text-align:center;color:#9f96ad;font-size:12px;padding:8px}@media(max-width:850px){body{padding:12px}.card{padding:20px 16px;border-radius:17px}h1{font-size:23px}.star{font-size:35px}.stars{gap:4px}}
</style>
</head>
<body><div class="bg"></div><main class="card"><h1>💬 DEIXE SEU FEEDBACK</h1><p>A tua opinião ajuda a melhorar a YunaMyst para todos os players.</p><div class="stars" id="stars" aria-label="Escolhe de 1 a 5 estrelas"><button class="star" data-rating="1" type="button">★</button><button class="star" data-rating="2" type="button">★</button><button class="star" data-rating="3" type="button">★</button><button class="star" data-rating="4" type="button">★</button><button class="star" data-rating="5" type="button">★</button></div><div class="hint" id="hint">Escolhe de 1 a 5 estrelas</div><form id="feedbackForm"><div class="field"><label for="nome">Seu nome (opcional)</label><input id="nome" name="nome" maxlength="80" placeholder="Como queres ser identificado?"></div><div class="field"><label for="mensagem">Seu feedback</label><textarea id="mensagem" name="mensagem" maxlength="300" required placeholder="Conta-nos o que achaste do site..."></textarea></div><button class="submit" id="submit" type="submit" disabled>ENVIAR FEEDBACK</button><div class="result" id="result"></div></form><div class="feedback-list"><strong>💜 TODOS OS FEEDBACKS</strong><div id="feedbackList"><div class="feedback-empty">A carregar...</div></div></div></main>
<script>
const API='https://uxwbbaeupemihonwyszu.supabase.co/functions/v1/feedbacks';let rating=0;const stars=[...document.querySelectorAll('.star')],hint=document.getElementById('hint'),submit=document.getElementById('submit'),result=document.getElementById('result'),list=document.getElementById('feedbackList');
function paint(n){stars.forEach((s,i)=>s.classList.toggle('selected',i<n));}
async function loadFeedbacks(){try{const r=await fetch(API+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error();const items=await r.json();list.innerHTML='';if(!Array.isArray(items)||!items.length){list.innerHTML='<div class="feedback-empty">Ainda não há feedbacks enviados.</div>';return;}items.forEach(x=>{const box=document.createElement('div');box.className='feedback-item';const head=document.createElement('div');head.className='feedback-head';const name=document.createElement('span');name.textContent=x.name||'Jogador';const starsBox=document.createElement('span');starsBox.className='feedback-stars';const n=Math.max(0,Math.min(5,Number(x.rating)||0));starsBox.textContent='★'.repeat(n)+'☆'.repeat(5-n);head.append(name,starsBox);const text=document.createElement('div');text.className='feedback-text';text.textContent=x.message||'';box.append(head,text);list.append(box);});}catch(e){list.innerHTML='<div class="feedback-empty">Não foi possível carregar os feedbacks. Tenta novamente.</div>';}}
stars.forEach(s=>s.addEventListener('click',()=>{rating=Number(s.dataset.rating);paint(rating);hint.textContent=rating+' de 5 estrelas';submit.disabled=false;}));
document.getElementById('feedbackForm').addEventListener('submit',async e=>{e.preventDefault();const message=document.getElementById('mensagem').value.trim();const name=document.getElementById('nome').value.trim()||'Jogador';if(!rating||!message)return;submit.disabled=true;submit.textContent='A ENVIAR...';try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({name,rating,message})});if(!r.ok)throw new Error();document.getElementById('mensagem').value='';paint(0);rating=0;hint.textContent='Feedback enviado com sucesso ✓';result.textContent='O feedback ficou guardado na base central e pode ser visto noutro PC ou telemóvel.';await loadFeedbacks();}catch(e){result.textContent='Não foi possível enviar o feedback. Tenta novamente.';}finally{submit.disabled=false;submit.textContent='ENVIAR FEEDBACK';}});
loadFeedbacks();
</script></body></html>
