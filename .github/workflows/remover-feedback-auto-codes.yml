name: Bloquear feedback definitivamente

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  remove:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Desativar criação do bloco de feedback
        shell: python
        run: |
          from pathlib import Path

          p = Path('auto-codes.js')
          s = p.read_text(encoding='utf-8')
          marker = '/* YUNAMYST FEEDBACK REMOVED 20260824 */'

          if marker not in s:
              s += r'''

/* YUNAMYST FEEDBACK REMOVED 20260824 */
(function(){
  function removeFeedback(){
    const selectors = [
      '#ym-feedback-redesign',
      '.feedback-section',
      '.feedback-open',
      '#ym-feedback-system',
      '.feedback-panel',
      '#feedbackModal',
      '#feedbackModalNew'
    ];
    document.querySelectorAll(selectors.join(',')).forEach(el => el.remove());
  }

  removeFeedback();
  if (document.documentElement) {
    new MutationObserver(removeFeedback).observe(document.documentElement, {
      childList: true,
      subtree: true
    });
  }
  document.addEventListener('DOMContentLoaded', removeFeedback);
  window.addEventListener('load', removeFeedback);
  setTimeout(removeFeedback, 100);
  setTimeout(removeFeedback, 1000);
  setTimeout(removeFeedback, 3000);
})();
'''
              p.write_text(s, encoding='utf-8')

      - name: Publicar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add auto-codes.js
          git diff --cached --quiet && exit 0
          git commit -m 'Bloquear feedback definitivamente [skip ci]'
          git push
