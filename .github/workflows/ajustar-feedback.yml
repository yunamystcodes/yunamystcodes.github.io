name: Ajustar feedback

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ajustar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ajustar feedback no index
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove o painel antigo que era criado automaticamente e causava duplicacao.
          s = re.sub(r'\s*<style id="yunamyst-feedback-styles">.*?</style>\s*</style>', '', s, flags=re.S)
          s = re.sub(r'\s*<script id="yunamyst-feedback-script">.*?</script>', '', s, flags=re.S)

          # Mantem somente o segundo botao, agora abrindo o modal na mesma pagina.
          s = re.sub(
              r'<a class="feedback-open" href="feedback\.html"[^>]*>\s*<span>⭐</span><strong> Dê o seu feedback</strong><b>⌄</b>\s*</a>',
              '<button class="feedback-open" type="button" onclick="toggleFeedback()" aria-label="Abrir formulario de feedback"><span>✉</span><strong>Dê o seu feedback</strong><b>⌄</b></button>',
              s,
              flags=re.S,
          )

          feedback_css = r'''
          <style id="yunamyst-feedback-modal-css">
          .feedback-open{width:100%;font-family:Arial,Helvetica,sans-serif;cursor:pointer}
          .feedback-modal{display:none;position:fixed;inset:0;z-index:10000;align-items:center;justify-content:center;padding:18px;background:rgba(2,1,8,.78);backdrop-filter:blur(6px)}
          .feedback-modal.open{display:flex}
          .feedback-card{position:relative;width:min(560px,calc(100% - 24px));max-height:min(88vh,720px);overflow:auto;padding:28px 26px 24px;border:1px solid #9c4cff;border-radius:18px;background:linear-gradient(180deg,rgba(22,10,40,.99),rgba(7,4,18,.99));box-shadow:0 25px 80px rgba(0,0,0,.75)}
          .feedback-card h3{color:#f0c45c;font-size:20px;margin-bottom:7px}.feedback-card>p{color:#c9c0d0;font-size:12px;line-height:1.5;margin-bottom:18px}
          .feedback-close{position:absolute;top:10px;right:12px;width:30px;height:30px;border:1px solid rgba(255,255,255,.2);border-radius:50%;background:#160b25;color:#fff;font-size:18px;cursor:pointer}
          .feedback-label{display:block;color:#fff;font-size:12px;font-weight:800;margin:12px 0 7px}.feedback-stars-form{display:flex;justify-content:center;gap:8px;margin:6px 0 2px}.feedback-star-form{border:0;background:transparent;color:#6f647c;font-size:36px;line-height:1;padding:2px;cursor:pointer}.feedback-star-form.selected{color:#f0c45c;transform:scale(1.08)}
          .feedback-help{text-align:center;color:#bdb5c8;font-size:11px;margin:7px 0 14px}.feedback-input,.feedback-textarea{width:100%;border:1px solid #6d4a91;border-radius:10px;background:#0b0716;color:#fff;padding:12px;font:13px Arial,Helvetica,sans-serif;outline:none}.feedback-textarea{min-height:125px;resize:vertical}.feedback-input:focus,.feedback-textarea:focus{border-color:#b65cff;box-shadow:0 0 12px rgba(182,92,255,.15)}
          .feedback-send{width:100%;height:46px;margin-top:14px;border:1px solid #edbd4e;border-radius:10px;background:linear-gradient(#f6cd70,#bd7d1d);color:#251400;font-weight:900;cursor:pointer}.feedback-note{text-align:center;color:#9f96ae;font-size:10px;line-height:1.4;margin-top:9px}
          @media(max-width:850px){.feedback-modal{padding:10px}.feedback-card{width:100%;padding:24px 16px 18px}.feedback-card h3{font-size:18px}.feedback-star-form{font-size:31px}.feedback-textarea{min-height:115px}}
          </style>
          '''
          s = s.replace('</head>', feedback_css + '\n</head>', 1)

          modal_html = r'''
          <div class="feedback-modal" id="feedbackModal" onclick="fecharFeedbackFora(event)">
            <div class="feedback-card" role="dialog" aria-modal="true" aria-labelledby="feedbackTitulo">
              <button class="feedback-close" type="button" onclick="fecharFeedback()" aria-label="Fechar">×</button>
              <h3 id="feedbackTitulo">✉ DEIXE SEU FEEDBACK</h3>
              <p>A tua opinião ajuda a melhorar a YunaMyst para todos os players.</p>
              <form id="feedbackForm" onsubmit="enviarFeedback(event)">
                <label class="feedback-label">⭐ Avalie o site</label>
                <div class="feedback-stars-form" role="radiogroup" aria-label="Escolha de 1 a 5 estrelas">
                  <button class="feedback-star-form" type="button" data-star="1" onclick="selecionarEstrela(1)" aria-label="1 estrela">★</button>
                  <button class="feedback-star-form" type="button" data-star="2" onclick="selecionarEstrela(2)" aria-label="2 estrelas">★</button>
                  <button class="feedback-star-form" type="button" data-star="3" onclick="selecionarEstrela(3)" aria-label="3 estrelas">★</button>
                  <button class="feedback-star-form" type="button" data-star="4" onclick="selecionarEstrela(4)" aria-label="4 estrelas">★</button>
                  <button class="feedback-star-form" type="button" data-star="5" onclick="selecionarEstrela(5)" aria-label="5 estrelas">★</button>
                </div>
                <div class="feedback-help" id="feedbackStarsHelp">Escolhe de 1 a 5 estrelas</div>
                <label class="feedback-label" for="feedbackNome">Seu nome (opcional)</label>
                <input class="feedback-input" id="feedbackNome" type="text" maxlength="80" placeholder="Como queres ser identificado?">
                <label class="feedback-label" for="feedbackMensagem">Seu feedback</label>
                <textarea class="feedback-textarea" id="feedbackMensagem" maxlength="2000" required placeholder="Conta-nos o que achaste do site..."></textarea>
                <button class="feedback-send" type="submit">✉ ENVIAR FEEDBACK</button>
                <div class="feedback-note">Ao enviar, será aberta a tua aplicação de email com a mensagem já preparada.</div>
              </form>
            </div>
          </div>
          '''
          s = s.replace('</main>', modal_html + '\n</main>', 1)

          feedback_js = r'''
          <script id="yunamyst-feedback-modal-js">
          let feedbackEstrelas=0;
          function toggleFeedback(){const m=document.getElementById('feedbackModal');if(m)m.classList.toggle('open')}
          function fecharFeedback(){const m=document.getElementById('feedbackModal');if(m)m.classList.remove('open')}
          function fecharFeedbackFora(e){if(e.target.id==='feedbackModal')fecharFeedback()}
          function selecionarEstrela(n){feedbackEstrelas=n;document.querySelectorAll('.feedback-star-form').forEach((b,i)=>b.classList.toggle('selected',i<n));const h=document.getElementById('feedbackStarsHelp');if(h)h.textContent=n+' de 5 estrelas'}
          document.addEventListener('keydown',e=>{if(e.key==='Escape')fecharFeedback()});
          function enviarFeedback(e){
            e.preventDefault();
            if(!feedbackEstrelas){alert('Escolhe de 1 a 5 estrelas antes de enviar.');return}
            const nome=(document.getElementById('feedbackNome').value||'Anónimo').trim();
            const mensagem=document.getElementById('feedbackMensagem').value.trim();
            const recipient=String.fromCharCode(115,111,108,97,110,103,101,46,104,97,110,110,97,104,57,48,64,103,109,97,105,108,46,99,111,109);
            const subject=encodeURIComponent('Feedback YunaMyst - '+feedbackEstrelas+'/5 estrelas');
            const body=encodeURIComponent('Avaliação: '+feedbackEstrelas+'/5 estrelas\nNome: '+nome+'\n\nFeedback:\n'+mensagem);
            window.location.href='mailto:'+recipient+'?subject='+subject+'&body='+body;
          }
          </script>
          '''
          s = s.replace('</body>', feedback_js + '\n</body>', 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit da alteração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Corrigir feedback para modal na mesma pagina"
          git push