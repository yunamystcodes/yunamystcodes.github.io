name: Adicionar caixa de feedback

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  add-feedback:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Atualizar feedback no index
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'id="ym-feedback"' not in s:
              raise SystemExit('Secção de feedback não encontrada no index.html')

          # Botão imediatamente abaixo de ENVIAR FEEDBACK.
          if 'id="ym-feedback-all"' not in s:
              button = '<button class="ym-feedback-all" id="ym-feedback-all" type="button">VER TODOS OS FEEDBACKS</button>'
              target = '<button class="ym-feedback-submit" id="ym-feedback-submit" type="button">ENVIAR FEEDBACK</button>'
              if target not in s:
                  raise SystemExit('Botão ENVIAR FEEDBACK não encontrado')
              s = s.replace(target, target + button, 1)

          # Janela dos feedbacks.
          if 'id="ym-feedback-modal"' not in s:
              modal = '''
          <div class="ym-feedback-modal" id="ym-feedback-modal" aria-hidden="true">
            <div class="ym-feedback-modal-card" role="dialog" aria-modal="true" aria-labelledby="ym-feedback-modal-title">
              <button class="ym-feedback-modal-close" id="ym-feedback-modal-close" type="button" aria-label="Fechar">×</button>
              <h3 id="ym-feedback-modal-title">💜 TODOS OS FEEDBACKS</h3>
              <div id="ym-feedback-list" class="ym-feedback-list"></div>
            </div>
          </div>'''
              s = s.replace('</body>', modal + '</body>', 1)

          if 'id="yunamyst-feedback-all-css"' not in s:
              css = '''
          <style id="yunamyst-feedback-all-css">
          .ym-feedback-all{width:100%;height:38px;margin-top:8px;border:1px solid #8d58c8;border-radius:9px;background:#140a24;color:#eadcff;font-weight:900;font-size:10px;cursor:pointer}
          .ym-feedback-modal{display:none;position:fixed;inset:0;z-index:10000;align-items:center;justify-content:center;padding:16px;background:#020108cc;backdrop-filter:blur(5px)}
          .ym-feedback-modal.open{display:flex}
          .ym-feedback-modal-card{position:relative;width:min(620px,calc(100% - 20px));max-height:min(78vh,720px);overflow:auto;padding:22px 18px 18px;border:1px solid #be66ff99;border-radius:16px;background:linear-gradient(180deg,#160a28,#070412);box-shadow:0 25px 80px #000c}
          .ym-feedback-modal-card h3{font-size:17px;margin-bottom:14px;color:#f0ce70;padding-right:30px}
          .ym-feedback-modal-close{position:absolute;right:10px;top:9px;width:30px;height:30px;border:1px solid #fff3;border-radius:50%;background:#160b25;color:#fff;font-size:19px;cursor:pointer}
          .ym-feedback-item{padding:13px 12px;margin-bottom:9px;border:1px solid #633487;border-radius:11px;background:#0c0618}
          .ym-feedback-item-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
          .ym-feedback-item-name{font-weight:900;color:#fff;font-size:12px}.ym-feedback-item-stars{color:#f3c65e;font-size:13px;letter-spacing:1px}.ym-feedback-item-text{color:#c9c0d0;font-size:11px;line-height:1.5;white-space:pre-wrap;word-break:break-word}.ym-feedback-empty{padding:22px;text-align:center;color:#9f96ae;font-size:11px}
          </style>'''
              s = s.replace('</body>', css + '</body>', 1)

          if 'id="yunamyst-feedback-all-js"' not in s:
              js = '''
          <script id="yunamyst-feedback-all-js">
          (function(){
            const KEY='yunamyst_feedbacks_v2';
            const root=document.getElementById('ym-feedback');
            const modal=document.getElementById('ym-feedback-modal');
            const list=document.getElementById('ym-feedback-list');
            const open=document.getElementById('ym-feedback-all');
            const close=document.getElementById('ym-feedback-modal-close');
            if(!root||!modal||!list||!open||!close)return;
            const read=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}};
            const render=()=>{
              const items=read().slice().reverse();
              list.innerHTML='';
              if(!items.length){list.innerHTML='<div class="ym-feedback-empty">Ainda não há feedbacks enviados neste navegador.</div>';return;}
              items.forEach(x=>{
                const box=document.createElement('div');box.className='ym-feedback-item';
                const head=document.createElement('div');head.className='ym-feedback-item-head';
                const name=document.createElement('div');name.className='ym-feedback-item-name';name.textContent=x.name||'Jogador';
                const stars=document.createElement('div');stars.className='ym-feedback-item-stars';const n=Math.max(0,Math.min(5,Number(x.rating)||0));stars.textContent='★'.repeat(n)+'☆'.repeat(5-n);
                const text=document.createElement('div');text.className='ym-feedback-item-text';text.textContent=x.message||'';
                head.append(name,stars);box.append(head,text);list.append(box);
              });
            };
            open.addEventListener('click',()=>{render();modal.classList.add('open');modal.setAttribute('aria-hidden','false')});
            close.addEventListener('click',()=>{modal.classList.remove('open');modal.setAttribute('aria-hidden','true')});
            modal.addEventListener('click',e=>{if(e.target===modal)close.click()});
            document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal.classList.contains('open'))close.click()});
            const submit=document.getElementById('ym-feedback-submit');
            if(submit)submit.addEventListener('click',()=>{
              setTimeout(()=>{
                const name=root.querySelector('.ym-feedback-name');
                const message=root.querySelector('.ym-feedback-text');
                const stars=root.querySelectorAll('.ym-star.active').length;
                const text=(message&&message.value||'').trim();
                if(!text||!stars)return;
                const items=read();items.push({name:(name&&name.value||'').trim()||'Jogador',rating:stars,message:text,createdAt:Date.now()});
                localStorage.setItem(KEY,JSON.stringify(items.slice(-50)));
              },100);
            });
          })();
          </script>'''
              s = s.replace('</body>', js + '</body>', 1)

          p.write_text(s, encoding='utf-8')

      - name: Publicar alteração no index
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Adicionar botão Ver todos os feedbacks [skip feedback]"
          git fetch origin main
          git rebase origin/main
          git push
