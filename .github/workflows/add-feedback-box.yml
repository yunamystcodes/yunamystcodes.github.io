name: Adicionar caixa de feedback

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  add-feedback:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ajustar feedback no index
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<!-- YUNAMYST-FEEDBACK-V1 -->'

          if marker not in s:
              print('Feedback ainda não existe; nada a ajustar.')
              raise SystemExit(0)

          # O nome do player é opcional: não bloquear o envio quando ficar vazio.
          replacements = {
              'Nome do player</label>': 'Nome do player <span>(opcional)</span></label>',
              'Nome do player</div>': 'Nome do player <span>(opcional)</span></div>',
              'placeholder="Seu nome no jogo"': 'placeholder="Seu nome no jogo (opcional)"',
              'placeholder="Nome do player"': 'placeholder="Nome do player (opcional)"',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)

          # Se o campo tiver required, remover apenas do campo do nome do player.
          import re
          s = re.sub(r'(<input[^>]*class="[^"]*ym-feedback-name[^"]*"[^>]*?)\s+required(?=[\s>])', r'\1', s, flags=re.I)
          s = re.sub(r'(<input[^>]*id="[^"]*player[^"]*"[^>]*?)\s+required(?=[\s>])', r'\1', s, flags=re.I)

          patch_marker = '/* YUNAMYST FEEDBACK NAME OPTIONAL V1 */'
          if patch_marker not in s:
              patch = '''\n<style id="yunamyst-feedback-name-optional">\n/* YUNAMYST FEEDBACK NAME OPTIONAL V1 */\n#ym-feedback .ym-feedback-label span{color:#9f96ae;font-weight:700;margin-left:3px}\n</style>\n'''
              s = s.replace('</body>', patch + '</body>', 1) if '</body>' in s else s + patch

          p.write_text(s, encoding='utf-8')

      - name: Publicar alteração no index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Tornar nome do player opcional"
          git push
