name: Fix partnership modal v2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'Remove partnership ratings and contact'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove partnership ratings and contact
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'<div class="feedback-summary"[^>]*>.*?</div>\s*', '', s, flags=re.S)
          s = re.sub(r'<div class="feedback-list"[^>]*>.*?</div>\s*', '', s, flags=re.S)
          s = re.sub(r'<div class="contact-mail">.*?</div>\s*</div>\s*</div>', '</div></div>', s, flags=re.S)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || (git commit -m 'Remove partnership ratings and contact' && git push)
