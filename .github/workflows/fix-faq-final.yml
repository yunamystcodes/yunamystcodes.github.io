name: Fix FAQ final
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip faq]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix FAQ in index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove the broken child-index visibility rules from the old inline FAQ block.
          s = s.replace('.faq .faq-item:nth-child(n+4){display:none!important}', '.faq .faq-item:nth-of-type(n+4){display:none!important}')

          css = '''
          <style id="yunamyst-faq-final-hard-fix-v2">
          /* FAQ FINAL V2: exactly 3 questions, correct order, PC + mobile. */
          .faq .faq-item:nth-of-type(n+4){display:none!important;}
          .faq .faq-item:nth-of-type(-n+3){display:block!important;width:100%!important;float:none!important;margin:0!important;padding:0!important;}
          .faq .faq-q{display:flex!important;align-items:center!important;justify-content:space-between!important;width:100%!important;min-height:52px!important;height:52px!important;box-sizing:border-box!important;}
          html[lang="en"] .faq .faq-q{font-size:0!important;}
          html[lang="en"] .faq .faq-item:nth-of-type(1) .faq-q::before{content:'Where do I enter the codes?'!important;font-size:13px!important;}
          html[lang="en"] .faq .faq-item:nth-of-type(2) .faq-q::before{content:'Do the codes expire?'!important;font-size:13px!important;}
          html[lang="en"] .faq .faq-item:nth-of-type(3) .faq-q::before{content:'Can I use it on iPhone?'!important;font-size:13px!important;}
          html[lang="en"] .faq .faq-q span{font-size:13px!important;}
          @media(max-width:850px){
            .faq .faq-item:nth-of-type(n+4){display:none!important;}
            .faq .faq-item:nth-of-type(-n+3){display:block!important;width:100%!important;}
            .faq .faq-q{width:100%!important;height:52px!important;min-height:52px!important;padding:15px 14px!important;box-sizing:border-box!important;}
          }
          </style>
          '''
          # Replace a previous V2 block if it exists, then place the final block before </head>.
          s = re.sub(r'\s*<style id="yunamyst-faq-final-hard-fix-v2">.*?</style>\s*', '\n', s, flags=re.S)
          s = s.replace('</head>', css + '</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit FAQ fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix FAQ three questions on PC and mobile [skip faq]"
          git push
