name: Instalar sistema de feedback

on:
  push:
    paths:
      - 'scripts/install-feedback-system.py'
      - '.github/workflows/instalar-feedback.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  instalar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar sistema de feedback no index
        run: python3 scripts/install-feedback-system.py
      - name: Publicar alteração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git add index.html
          git commit -m "Adicionar avaliações e feedback dos jogadores"
          git push
