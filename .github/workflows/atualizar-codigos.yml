name: Atualizar códigos automaticamente

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    paths:
      - 'scripts/update_codes.py'
      - 'codes-history.json'
      - '.github/workflows/atualizar-codigos.yml'

permissions:
  contents: write

concurrency:
  group: atualizar-codigos
  cancel-in-progress: true

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o site
        uses: actions/checkout@v4

      - name: Atualizar códigos ativos e expirados
        run: python3 scripts/update_codes.py

      - name: Corrigir texto da parceria no index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('parceria com o YunaMyst', 'parceria com a YunaMyst')
          s = s.replace('Parceria com o YunaMyst', 'Parceria com a YunaMyst')
          s = s.replace('PARCERIA COM O YUNAMYST', 'PARCERIA COM A YUNAMYST')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Publicar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Nenhuma alteração nos códigos ou no texto da parceria."
            exit 0
          fi
          git add index.html codes-history.json .github/workflows/atualizar-codigos.yml
          git commit -m "Corrigir parceria com a YunaMyst no index"
          git push
