name: Atualizar códigos ativos no index

on:
  push:
    branches: [main]
  schedule:
    - cron: '20 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Atualizar códigos ativos sem mexer nas abas
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          codes = [
              '912XUXIECHUANQI',
              'SWC2026JUELEBA',
              'H4MBURGISWAITING',
              'HURRASWC2026',
              '4MINGYIDAOXIAN',
              'YYDSSWC26ZAN',
              'AUGSW2026V7N',
              'SWXFRIEREN2026',
          ]

          def card(code):
              return f'''<article class="code"><div class="gift">🎁</div><div class="cinfo"><strong>{code}</strong><small>🔄 Código ativo</small></div><div class="reward"><span class="scroll"></span><b>3</b><small>MS</small></div><div class="reward"><span class="energy">⚡</span><b>100</b><small>Energia</small></div><div class="reward"><span class="mana"></span><b>—</b><small>Mana</small></div><button class="copy" onclick="copiar('{code}',this)">▣ COPIAR</button><a class="link" href="https://withhive.me/313/000000000" target="_blank" rel="noopener">🔗 LINK</a></article>'''

          new_cards = '\n'.join(card(c) for c in codes)

          # Substitui somente a lista de ATIVOS. A aba e a lista de EXPIRADOS ficam intactas.
          pattern = r'(<div id="ativos" class="code-list">).*?(?=\s*<div class="tabs">|\s*<div id="expirados" class="code-list">)'
          match = re.search(pattern, html, flags=re.S)
          if not match:
              raise SystemExit('Não foi possível localizar a lista de códigos ativos.')

          prefix = match.group(1)
          html = html[:match.start()] + prefix + '\n' + new_cards + '\n</div>\n' + html[match.end():]

          # Remove qualquer contador antigo das abas.
          html = re.sub(r'\s*<span class="tab-count" id="countAtivos">\d+</span>', '', html)
          html = re.sub(r'\s*<span class="tab-count" id="countExpirados">\d+</span>', '', html)

          # Garante que as abas ficam depois da lista de ativos.
          ativos_pos = html.find('<div id="ativos" class="code-list">')
          tabs_pos = html.find('<div class="tabs">')
          expirados_pos = html.find('<div id="expirados" class="code-list">')
          if not (ativos_pos >= 0 and tabs_pos > ativos_pos and expirados_pos > tabs_pos):
              raise SystemExit('As abas não estão na posição esperada: devem ficar depois dos ativos e antes dos expirados.')

          path.write_text(html, encoding='utf-8')
          print('OK: ativos atualizados; abas preservadas abaixo dos ativos; expirados preservados.')
          PY

      - name: Validar estrutura final
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          checks = ['id="ativos"', 'id="expirados"', 'id="tabAtivos"', 'id="tabExpirados"']
          missing = [x for x in checks if x not in html]
          if missing:
              raise SystemExit('Estrutura incompleta: ' + ', '.join(missing))
          if 'id="countAtivos"' in html or 'id="countExpirados"' in html:
              raise SystemExit('Ainda existe contador nas abas.')
          ativos = html.find('<div id="ativos" class="code-list">')
          tabs = html.find('<div class="tabs">')
          expirados = html.find('<div id="expirados" class="code-list">')
          if not (ativos < tabs < expirados):
              raise SystemExit('Ordem inválida: esperado ATIVOS -> ABAS -> EXPIRADOS.')
          print('HTML OK: ATIVOS -> ABAS -> EXPIRADOS, sem contadores.')
          PY

      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
          else
            git commit -m "Atualizar ativos sem quebrar abas"
            git push
          fi
