name: Atualizar códigos ativos no index

on:
  push:
    branches: [main]
  schedule:
    - cron: '20 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Atualizar códigos ativos e posição das abas
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          codes = [
              '912XUXIECHUANQI',
              'SWC2026JUELEBA',
              'H4MBURGISWAITING',
              'HURRASWC2026',
              '4MINGYIDAOXIAN',
              'YYDSSWC26ZAN',
              'AUGSW2026V7N',
              'SWXFRIEREN2026',
          ]

          def card(code):
              return f'''<article class="code"><div class="gift">🎁</div><div class="cinfo"><strong>{code}</strong><small>🔄 Código ativo</small></div><div class="reward"><span class="scroll"></span><b>3</b><small>MS</small></div><div class="reward"><span class="energy">⚡</span><b>100</b><small>Energia</small></div><div class="reward"><span class="mana"></span><b>—</b><small>Mana</small></div><button class="copy" onclick="copiar('{code}',this)">▣ COPIAR</button><a class="link" href="https://withhive.me/313/000000000" target="_blank" rel="noopener">🔗 LINK</a></article>'''

          new_cards = '\n'.join(card(c) for c in codes)

          # Atualiza somente o conteúdo da lista ATIVOS.
          pattern = r'(<div id="ativos" class="code-list">).*?(</div>\s*<div id="expirados" class="code-list")'
          replacement = r'\1\n' + new_cards + r'\n\2'
          html, n = re.subn(pattern, replacement, html, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Não foi possível localizar a lista de códigos ativos.')

          # Remove os números das abas: "8" e "6".
          html = re.sub(r'\s*<span class="tab-count" id="countAtivos">\d+</span>', '', html)
          html = re.sub(r'\s*<span class="tab-count" id="countExpirados">\d+</span>', '', html)

          # Move as duas abas para DEPOIS do último código ativo e antes dos expirados.
          tabs_pattern = r'(<div class="tabs">.*?</div>)\s*(<div id="ativos" class="code-list">.*?)(\s*<div id="expirados" class="code-list">)'
          match = re.search(tabs_pattern, html, flags=re.S)
          if not match:
              raise SystemExit('Não foi possível localizar as abas e as listas de códigos.')

          tabs = match.group(1)
          ativos = match.group(2)
          expirados = match.group(3)
          html = html[:match.start()] + ativos + '\n' + tabs + '\n' + expirados + html[match.end():]

          html = html.replace('2026-08-20-tabs-ativos-expirados', '2026-08-20-tabs-ativos-expirados-auto')
          path.write_text(html, encoding='utf-8')
          print('Códigos ativos atualizados e abas reposicionadas abaixo do último código ativo.')
          PY

      - name: Validar HTML antes de publicar
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          checks = ['id="ativos"', 'id="expirados"', 'id="tabAtivos"', 'id="tabExpirados"']
          missing = [x for x in checks if x not in html]
          if missing:
              raise SystemExit('Estrutura das abas incompleta: ' + ', '.join(missing))
          if 'id="countAtivos"' in html:
              raise SystemExit('O contador de códigos ativos ainda está presente.')
          if 'id="countExpirados"' in html:
              raise SystemExit('O contador de códigos expirados ainda está presente.')
          print('HTML validado: abas abaixo dos ativos e sem contadores.')
          PY

      - name: Publicar index atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "O index já está atualizado."
          else
            git commit -m "Colocar abas abaixo dos códigos ativos"
            git push
          fi
