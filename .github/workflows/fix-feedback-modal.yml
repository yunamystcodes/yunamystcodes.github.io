name: Fix feedback modal
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'fix feedback modal') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update feedback UI
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='''<a class="feedback-open" href="feedback.html" target="_blank" rel="noopener noreferrer"><span>⭐</span><strong> Dê o seu feedback</strong><b>⌄</b></a>'''
          s=s.replace(old,'')
          injection=r'''<script id="yunamyst-feedback-modal-fix">
(function(){
  function init(){
    var panel=document.querySelector('.feedback-panel');
    if(!panel || document.getElementById('feedbackModal')) return;
    var button=panel.querySelector('.feedback-button');
    if(!button) return;
    var fresh=button.cloneNode(true); button.replaceWith(fresh);
    var modal=document.createElement('div'); modal.id='feedbackModal'; modal.className='feedback-modal';
    modal.innerHTML=`<div class="feedback-modal-card" role="dialog" aria-modal="true" aria-labelledby="feedbackModalTitle"><button class="feedback-modal-close" type="button" aria-label="Fechar">×</button><h3 id="feedbackModalTitle">💬 DEIXE SEU FEEDBACK</h3><p>A tua opinião ajuda a melhorar a YunaMyst para todos os players.</p><div class="feedback-modal-stars" role="radiogroup" aria-label="Escolhe de 1 a 5 estrelas"><button type="button" data-rating="1">★</button><button type="button" data-rating="2">★</button><button type="button" data-rating="3">★</button><button type="button" data-rating="4">★</button><button type="button" data-rating="5">★</button></div><div class="feedback-modal-hint" id="feedbackModalHint">Escolhe de 1 a 5 estrelas</div><form id="feedbackModalForm"><label for="feedbackNome">Seu nome (opcional)</label><input id="feedbackNome" maxlength="80" placeholder="Como queres ser identificado?"><label for="feedbackMensagem">Seu feedback</label><textarea id="feedbackMensagem" maxlength="2000" required placeholder="Conta-nos o que achaste do site..."></textarea><button class="feedback-modal-submit" type="submit" disabled>ENVIAR FEEDBACK</button><div class="feedback-modal-result" id="feedbackModalResult"></div></form></div>`;
    document.body.appendChild(modal);
    var stars=[...modal.querySelectorAll('.feedback-modal-stars button')],rating=0;
    function close(){modal.classList.remove('open');document.body.classList.remove('feedback-modal-lock')}
    function open(){modal.classList.add('open');document.body.classList.add('feedback-modal-lock')}
    fresh.addEventListener('click',open);modal.querySelector('.feedback-modal-close').addEventListener('click',close);modal.addEventListener('click',function(e){if(e.target===modal)close()});document.addEventListener('keydown',function(e){if(e.key==='Escape')close()});
    stars.forEach(function(star){star.addEventListener('click',function(){rating=Number(star.dataset.rating);stars.forEach(function(x){x.classList.toggle('selected',Number(x.dataset.rating)<=rating)});modal.querySelector('#feedbackModalHint').textContent=rating+' de 5 estrelas';modal.querySelector('.feedback-modal-submit').disabled=false})});
    modal.querySelector('#feedbackModalForm').addEventListener('submit',function(e){e.preventDefault();if(!rating)return;var nome=modal.querySelector('#feedbackNome').value.trim()||'Anónimo';var msg=modal.querySelector('#feedbackMensagem').value.trim();var subject=encodeURIComponent('Feedback YunaMyst — '+rating+'/5 estrelas');var body=encodeURIComponent('Avaliação: '+rating+'/5 estrelas\nNome: '+nome+'\n\nFeedback:\n'+msg);modal.querySelector('#feedbackModalResult').textContent='A preparar o envio do feedback…';window.location.href='mailto:solange.hannah90@gmail.com?subject='+subject+'&body='+body});
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init); else init();
})();
</script>
'''
          css=r'''<style id="yunamyst-feedback-modal-fix-css">.feedback-panel .feedback-content{display:none!important}.feedback-modal{display:none;position:fixed;inset:0;z-index:10000;align-items:center;justify-content:center;padding:18px;background:rgba(2,1,8,.78);backdrop-filter:blur(6px)}.feedback-modal.open{display:flex}.feedback-modal-lock{overflow:hidden}.feedback-modal-card{position:relative;width:min(620px,calc(100% - 18px));max-height:calc(100vh - 28px);overflow:auto;padding:28px 26px 24px;border:1px solid rgba(190,102,255,.55);border-radius:18px;background:linear-gradient(180deg,rgba(12,7,29,.99),rgba(5,4,17,.99));box-shadow:0 25px 80px rgba(0,0,0,.72)}.feedback-modal-card h3{margin:0 35px 7px 0;color:#f0c45c;font:900 25px Georgia,serif}.feedback-modal-card p{color:#c9c0d0;line-height:1.5;margin:0 0 18px;font-size:13px}.feedback-modal-close{position:absolute;top:10px;right:12px;width:30px;height:30px;border:1px solid rgba(255,255,255,.2);border-radius:50%;background:#160b25;color:#fff;font-size:18px;cursor:pointer}.feedback-modal-stars{display:flex;justify-content:center;gap:8px;margin:8px 0 5px}.feedback-modal-stars button{border:0;background:transparent;color:#6f647c;font-size:42px;cursor:pointer;line-height:1;padding:3px;transition:.15s}.feedback-modal-stars button:hover,.feedback-modal-stars button.selected{color:#f0c45c;transform:scale(1.1)}.feedback-modal-hint{text-align:center;color:#bdb4ca;font-size:12px;margin-bottom:20px}.feedback-modal-card label{display:block;font-weight:800;font-size:13px;margin:0 0 7px}.feedback-modal-card input,.feedback-modal-card textarea{width:100%;border:1px solid rgba(190,102,255,.45);border-radius:11px;background:rgba(7,4,18,.9);color:#fff;padding:13px;font:14px Arial;outline:none;margin:0 0 16px}.feedback-modal-card textarea{min-height:140px;resize:vertical}.feedback-modal-card input:focus,.feedback-modal-card textarea:focus{border-color:#b65cff;box-shadow:0 0 12px rgba(182,92,255,.15)}.feedback-modal-submit{width:100%;border:1px solid #edbd4e;border-radius:11px;background:linear-gradient(#f6cd70,#bd7d1d);color:#251400;padding:14px;font-weight:900;cursor:pointer}.feedback-modal-submit:disabled{opacity:.45;cursor:not-allowed}.feedback-modal-result{text-align:center;color:#d99cff;font-weight:800;font-size:12px;min-height:18px;margin-top:10px}@media(max-width:850px){.feedback-modal{padding:10px}.feedback-modal-card{padding:22px 15px 18px;border-radius:16px}.feedback-modal-card h3{font-size:21px}.feedback-modal-stars{gap:4px}.feedback-modal-stars button{font-size:35px}.feedback-modal-card textarea{min-height:125px}}</style>'''
          if 'yunamyst-feedback-modal-fix' not in s:
              s=s.replace('</head>',css+'</head>')
              s=s.replace('</body>',injection+'</body>')
          p.write_text(s,encoding='utf-8')
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix feedback modal"
          git push
      - name: Remove temporary workflow
        if: ${{ success() }}
        run: |
          git rm .github/workflows/fix-feedback-modal.yml
          git commit -m "remove temporary feedback workflow"
          git push
# trigger
