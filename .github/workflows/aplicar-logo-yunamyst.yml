name: Aplicar nova logo YunaMyst
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Atualizar index
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* YUNAMYST LOGO IMAGE 20260821 */'
          if marker not in s:
              css = '''<style id="yunamyst-logo-image">\n/* YUNAMYST LOGO IMAGE 20260821 */\n.avatar{background:url('/assets/yunamyst-logo.svg') center/cover no-repeat!important;font-size:0!important;border:2px solid #b65cff!important;box-shadow:0 0 18px rgba(182,92,255,.35)!important}\n</style>\n'''
              s = s.replace('</head>', css + '</head>', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commitar alteração
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Aplicar nova logo YunaMyst no index"
          git push
      - name: Remover workflow temporario
        if: success()
        shell: bash
        run: |
          rm -f .github/workflows/aplicar-logo-yunamyst.yml
          git add .github/workflows/aplicar-logo-yunamyst.yml
          git commit -m "Remover workflow temporario da logo" || true
          git push || true
