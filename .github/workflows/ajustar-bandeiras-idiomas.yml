name: Ajustar bandeiras dos idiomas

on:
  push:
    paths:
      - '.github/workflows/ajustar-bandeiras-idiomas.yml'

permissions:
  contents: write

jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Corrigir bandeiras
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('🇺🇸 ENG', '🇬🇧 ENG')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit alteração
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Corrigir bandeira do idioma inglês'
          git push
