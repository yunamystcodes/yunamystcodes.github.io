name: Corrigir bandeiras PT e ENG

on:
  push:
    paths:
      - '.github/workflows/ajustar-bandeiras-idiomas.yml'

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Corrigir bandeira inglesa
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('🇺🇸 ENG', '🇬🇧 ENG')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Remover workflow temporário e publicar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/ajustar-bandeiras-idiomas.yml
          git commit -m 'Corrigir bandeiras dos idiomas no index'
          git push
