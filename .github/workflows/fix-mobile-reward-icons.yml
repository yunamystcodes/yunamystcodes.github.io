name: Corrigir ícones das recompensas no telemóvel

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-mobile-rewards:
    if: ${{ !contains(github.event.head_commit.message, '[skip mobile rewards]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar correção sem alterar o layout
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='id="yunamyst-mobile-reward-horizontal-fix"'
          if marker not in s:
              css='''
          <style id="yunamyst-mobile-reward-horizontal-fix">
          /* Telemóvel: 3 recompensas lado a lado. PC não é alterado. */
          @media (max-width:850px){
            .codes > .code{
              display:grid!important;
              grid-template-columns:44px repeat(3,minmax(0,1fr))!important;
              grid-template-rows:58px 66px 44px!important;
              grid-template-areas:"gift info info info" "gift r1 r2 r3" "copy copy link link"!important;
              align-items:center!important;
            }
            .codes > .code > .reward:nth-child(3){grid-area:r1!important;}
            .codes > .code > .reward:nth-child(4){grid-area:r2!important;}
            .codes > .code > .reward:nth-child(5){grid-area:r3!important;}
          }
          </style>'''
              s=s.replace('</head>',css+'\n</head>',1)
              p.write_text(s,encoding='utf-8')
      - name: Publicar
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-mobile-reward-icons.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix mobile rewards horizontal layout [skip mobile rewards]"
          git push
