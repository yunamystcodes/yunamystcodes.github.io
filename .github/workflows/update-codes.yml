name: Atualizar códigos automaticamente

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: yunamyst-codes-update
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Buscar 20 fontes e atualizar códigos
        run: python3 scripts/update_codes.py

      - name: Sincronizar index com os códigos e recompensas atuais
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          # O index não deve guardar uma segunda lista de códigos: a lista oficial
          # vem de codes.json e auto-codes.js. Isto evita expirados e duplicados.
          m = re.search(r'<div\b(?=[^>]*\bid=["\']ativos["\'])[^>]*>', s, re.I)
          if m:
              tags = re.compile(r'<div\b[^>]*>|</div\s*>', re.I)
              depth = 0
              end = None
              for tag in tags.finditer(s, m.start()):
                  depth += 1 if tag.group(0).lower().startswith('<div') else -1
                  if depth == 0:
                      end = tag.end(); break
              if end:
                  s = s[:m.start()] + '<div id="ativos" class="code-list"></div>' + s[end:]
          # Garantir que o JavaScript que desenha os códigos está no index.
          if 'src="./auto-codes.js"' not in s and "src='./auto-codes.js'" not in s:
              s = s.replace('</body>', '<script src="./auto-codes.js?v=20260828"></script>\n</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Corrigir YunaMyst no index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'YunaM(?:<span class="myst-y">[Yy]</span>)?[Yy]st', 'YunaM<span class="myst-y">Y</span>st', s, count=1)
          css = '''\n<style id="yunamyst-y-fix">\n.logo .myst-y{font-size:.60em!important;display:inline-block!important;line-height:.78!important;vertical-align:baseline!important;transform:translateY(-.08em)!important}\n@media(max-width:850px){.logo .myst-y{font-size:.56em!important;line-height:.76!important;transform:translateY(-.07em)!important}}\n</style>\n'''
          if 'id="yunamyst-y-fix"' in s:
              s = re.sub(r'<style id="yunamyst-y-fix">.*?</style>', css.strip(), s, count=1, flags=re.S)
          else:
              s = s.replace('</head>', css + '</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verificar index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          if 'id="ativos"' not in s or 'auto-codes.js' not in s:
              raise SystemExit('ERRO: index não está ligado ao sistema automático de códigos')
          if 'YunaM<span class="myst-y">Y</span>st' not in s:
              raise SystemExit('ERRO: YunaMyst não foi corrigido no index.html')
          print('OK: index usa uma única lista automática, sem lista duplicada de códigos.')
          PY

      - name: Guardar alterações
        run: |
          git config user.name 'YunaMyst Codes Bot'
          git config user.email 'actions@github.com'
          git add codes.json codes-history.json index.html .github/workflows/update-codes.yml scripts/update_codes.py assets/header-final.css assets/i18n.js auto-codes.js
          if ! git diff --cached --quiet; then
            git commit -m 'Atualizar index com recompensas e botoes Copiar e Link iOS'
            git push
          else
            echo 'Nenhuma alteração necessária.'
          fi
