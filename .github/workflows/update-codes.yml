name: Atualizar códigos automaticamente

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: yunamyst-codes-update
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    # Evita um ciclo infinito quando o próprio bot publica a atualização.
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Atualizar códigos ativos automaticamente')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar códigos e atualizar lista
        run: python3 scripts/update_codes_safe.py
      - name: Garantir feedbacks centralizados entre todos os aparelhos
        run: python3 scripts/ensure_feedback_central.py
      - name: Garantir carregador de códigos, recompensas e feedbacks no site
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          # O index usa auto-codes.js para renderizar os códigos de codes.json,
          # incluindo as imagens das recompensas e a leitura dos feedbacks globais.
          if not re.search(r'<script[^>]+src=["\'](?:\./)?auto-codes\.js', s, re.I):
              s=s.replace('</body>', '<script src="./auto-codes.js?v=20260901"></script>\n</body>', 1)
          p.write_text(s,encoding='utf-8')
          print('OK: auto-codes.js está ligado ao index.')
          PY
      - name: Verificar dados publicados
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('codes.json',encoding='utf-8'))
          codes=[str(c).upper() for c in d.get('codes',[])]
          if len(codes)!=len(set(codes)): raise SystemExit('ERRO: existem códigos duplicados')
          if not codes: raise SystemExit('ERRO: lista vazia')
          print(f'OK: {len(codes)} códigos ativos, sem duplicados.')
          PY
      - name: Atualizar cache-busting da página
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'codes\.json(?:\?v=[^"\']+)?', 'codes.json?v=__CODES_VERSION__', s)
          import time
          s=s.replace('__CODES_VERSION__', str(int(time.time())))
          p.write_text(s,encoding='utf-8')
          PY
      - name: Guardar atualização
        run: |
          git config user.name 'YunaMyst Codes Bot'
          git config user.email 'actions@github.com'
          git add codes.json codes-history.json index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Atualizar códigos ativos automaticamente'
            git push
          else
            echo 'Nenhuma alteração necessária.'
          fi
