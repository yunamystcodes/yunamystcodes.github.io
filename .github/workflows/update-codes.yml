name: Atualizar códigos automaticamente
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Buscar códigos e atualizar site
        run: node scripts/update-codes.mjs
      - name: Corrigir texto da parceria no index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'Queres fazer uma parceria com o YunaMyst Codes?': 'Queres fazer uma parceria com a YunaMyst Codes?',
              'Queres fazer uma parceria com o YunaMyst?': 'Queres fazer uma parceria com a YunaMyst?',
              'parceria com o YunaMyst Codes': 'parceria com a YunaMyst Codes',
              'parceria com o YunaMyst': 'parceria com a YunaMyst',
              'Parceria com o YunaMyst Codes': 'Parceria com a YunaMyst Codes',
              'Parceria com o YunaMyst': 'Parceria com a YunaMyst',
              'PARCERIA COM O YUNAMYST CODES': 'PARCERIA COM A YUNAMYST CODES',
              'PARCERIA COM O YUNAMYST': 'PARCERIA COM A YUNAMYST',
          }
          old = s
          for src, dst in replacements.items():
              s = s.replace(src, dst)
          if s == old:
              print('O texto já está correto ou não foi encontrado.')
          else:
              p.write_text(s, encoding='utf-8')
              print('CORRIGIDO: parceria com a YunaMyst Codes')
          if 'Queres fazer uma parceria com o YunaMyst' in s or 'parceria com o YunaMyst' in s:
              raise SystemExit('ERRO: ainda existe "parceria com o YunaMyst" no index.html')
          PY
      - name: Garantir botão WhatsApp
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          url = 'https://chat.whatsapp.com/KWg53GNpXDA3G5lDT8VwOg?s=cl&p=a&ilr=0'
          button = f'<a class="community-tab whatsapp" href="{url}" target="_blank" rel="noopener" aria-label="WhatsApp"><strong>💬 WHATSAPP</strong></a>'
          if 'class="community-tab whatsapp"' not in s:
              s, n = re.subn(r'(<div class="community-links">)', r'\1' + button, s, count=1)
              if n != 1:
                  raise SystemExit('Não foi encontrada a área community-links no index.html')
              p.write_text(s, encoding='utf-8')
              print('Botão WhatsApp inserido no index.html')
          else:
              print('Botão WhatsApp já existe no index.html')
          PY
      - name: Guardar alterações
        run: |
          git config user.name 'YunaMyst Codes Bot'
          git config user.email 'actions@github.com'
          git add codes.json index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Corrigir parceria para com a YunaMyst'
            git push
          fi
