name: Atualizar códigos automaticamente

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Buscar 20 fontes e atualizar códigos
        run: python3 scripts/update_codes.py

      - name: Corrigir textos fixos
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'Queres fazer uma parceria com o YunaMyst Codes?': 'Queres fazer uma parceria com a YunaMyst Codes?',
              'Queres fazer uma parceria com o YunaMyst?': 'Queres fazer uma parceria com a YunaMyst?',
              'parceria com o YunaMyst Codes': 'parceria com a YunaMyst Codes',
              'parceria com o YunaMyst': 'parceria com a YunaMyst',
              'Parceria com o YunaMyst Codes': 'Parceria com a YunaMyst Codes',
              'Parceria com o YunaMyst': 'Parceria com a YunaMyst',
              'PARCERIA COM O YUNAMYST CODES': 'PARCERIA COM A YUNAMYST CODES',
              'PARCERIA COM O YUNAMYST': 'PARCERIA COM A YUNAMYST',
          }
          for src, dst in replacements.items():
              s = s.replace(src, dst)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Aplicar cabeçalho, idioma PT/BR e ENG
        env:
          HEADER_CSS_B64:  nYXA6NXB4IWltcG9ydGFudDttYXJnaW4tbGVmdDo0cHghaW1wb3J0YW50fS5sYW5nLXN3aXRjaCAubGFuZy1tZW51e2dhcDo1cHghaW1wb3J0YW50fS5sYW5nLXN3aXRjaCAubGFuZy1vcHRpb257cGFkZGluZzo4cHggOHB4IWltcG9ydGFudDtmb250LXNpemU6MTBweCFpbXBvcnRhbnR9fQo8L3N0eWxlPg==
          I18N_JS_B64: 
          run: |
            python3 - <<'PY'
          import base64, os, re
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = base64.b64decode(os.environ['HEADER_CSS_B64']).decode('utf-8')
          js = base64.b64decode(os.environ['I18N_JS_B64']).decode('utf-8')
          if 'id="yunamyst-header-final"' not in s:
              s = s.replace('</head>', css + '\n</head>', 1)
          if 'id="yunamyst-i18n-final"' not in s:
              s = s.replace('</body>', js + '\n</body>', 1)
          s = re.sub(r'<meta name="build-version" content="[^"]*">', '<meta name="build-version" content="header-nav-language-final-20260826">', s, count=1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verificar publicação
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          required = ['🇧🇷 PT/BR','🇬🇧 ENG','yunamyst-header-final','yunamyst-i18n-final','header-nav-language-final-20260826']
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit('ERRO no index.html: ' + ', '.join(missing))
          print('index.html OK: PT/BR + ENG, navegação centralizada, logo reduzido e tradução.')
          PY

      - name: Guardar alterações
        run: |
          git config user.name 'YunaMyst Codes Bot'
          git config user.email 'actions@github.com'
          git add codes.json codes-history.json index.html .github/workflows/update-codes.yml
          if ! git diff --cached --quiet; then
            git commit -m 'Atualizar cabeçalho navegação e idioma'
            git push
          else
            echo 'Nenhuma alteração necessária.'
          fi
