name: Atualizar códigos automaticamente

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Buscar 20 fontes e atualizar códigos
        run: python3 scripts/update_codes.py

      - name: Garantir texto da parceria
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'Queres fazer uma parceria com o YunaMyst Codes?': 'Queres fazer uma parceria com a YunaMyst Codes?',
              'Queres fazer uma parceria com o YunaMyst?': 'Queres fazer uma parceria com a YunaMyst?',
              'parceria com o YunaMyst Codes': 'parceria com a YunaMyst Codes',
              'parceria com o YunaMyst': 'parceria com a YunaMyst',
              'Parceria com o YunaMyst Codes': 'Parceria com a YunaMyst Codes',
              'Parceria com o YunaMyst': 'Parceria com a YunaMyst',
              'PARCERIA COM O YUNAMYST CODES': 'PARCERIA COM A YUNAMYST CODES',
              'PARCERIA COM O YUNAMYST': 'PARCERIA COM A YUNAMYST',
          }
          for src, dst in replacements.items():
              s = s.replace(src, dst)
          if 'parceria com o YunaMyst' in s or 'PARCERIA COM O YUNAMYST' in s:
              raise SystemExit('ERRO: ainda existe "com o YunaMyst" no index.html')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Garantir botão WhatsApp
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          url = 'https://chat.whatsapp.com/KWg53GNpXDA3G5lDT8VwOg?s=cl&p=a&ilr=0'
          button = f'<a class="community-tab whatsapp" href="{url}" target="_blank" rel="noopener" aria-label="WhatsApp"><strong>💬 WHATSAPP</strong></a>'
          if 'class="community-tab whatsapp"' not in s:
              s, n = re.subn(r'(<div class="community-links">)', r'\1' + button, s, count=1)
              if n != 1:
                  raise SystemExit('Não foi encontrada a área community-links no index.html')
              p.write_text(s, encoding='utf-8')
          PY

      - name: Mostrar PT/BR e ENG no PC e telemóvel
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* YUNAMYST LANGUAGE SWITCH VISIBLE */'
          css = '''<style id="yunamyst-language-visible">
          /* YUNAMYST LANGUAGE SWITCH VISIBLE */
          .yunamyst-lang-visible{display:flex!important;align-items:center;gap:6px;margin-left:6px}
          .yunamyst-lang-visible .lang-option{display:inline-flex!important;align-items:center;justify-content:center;width:auto!important;border:1px solid #633487!important;border-radius:10px;background:#10091c!important;color:#fff!important;padding:9px 10px!important;text-align:center!important;font-size:11px!important;font-weight:800!important;text-decoration:none!important;cursor:pointer!important;touch-action:manipulation!important}
          .yunamyst-lang-visible .lang-option.selected{background:#2b1242!important;border-color:#9a5ad0!important}
          @media(max-width:850px){.yunamyst-lang-visible{gap:5px;margin-left:4px}.yunamyst-lang-visible .lang-option{padding:8px 8px!important;font-size:10px!important}}
          </style>'''
          if marker not in s:
              s = s.replace('</head>', css + '\n</head>', 1)
          if '🇬🇧 ENG' not in s or '🇧🇷 PT/BR' not in s:
              switch = '<div class="yunamyst-lang-visible" aria-label="Idioma"><button type="button" class="lang-option selected" data-lang="pt-BR">🇧🇷 PT/BR</button><button type="button" class="lang-option" data-lang="en">🇬🇧 ENG</button></div>'
              anchor = '</div></header>'
              if anchor in s:
                  s = s.replace(anchor, switch + anchor, 1)
              else:
                  s = s.replace('</header>', switch + '\n</header>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Reduzir logo do cabeçalho no PC e telemóvel
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('.logo{font:900 38px Georgia,serif;', '.logo{font:900 34px Georgia,serif;', 1)
          s = s.replace('.logo{font-size:29px}', '.logo{font-size:25px}', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Forcar publicacao da correção no index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'<meta name="build-version" content="[^"]*">', '<meta name="build-version" content="lang-ptbr-eng-logo-20260826-1600">', s, count=1)
          if '🇬🇧 ENG' not in s:
              raise SystemExit('ERRO: opção ENG não está no index.html')
          if '🇧🇷 PT/BR' not in s:
              raise SystemExit('ERRO: opção PT/BR não está no index.html')
          if '.logo{font:900 34px Georgia,serif;' not in s:
              raise SystemExit('ERRO: tamanho do logo no PC não foi aplicado')
          if '.logo{font-size:25px}' not in s:
              raise SystemExit('ERRO: tamanho do logo no telemóvel não foi aplicado')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Guardar alterações
        run: |
          git config user.name 'YunaMyst Codes Bot'
          git config user.email 'actions@github.com'
          git add codes.json codes-history.json index.html .github/workflows/update-codes.yml
          if ! git diff --cached --quiet; then
            git commit -m 'Adicionar ENG visível no site'
            git push
          else
            echo 'Nenhuma alteração necessária.'
          fi
