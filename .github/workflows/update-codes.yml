name: Atualizar códigos automaticamente

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Buscar 20 fontes e atualizar códigos
        run: python3 scripts/update_codes.py

      - name: Aplicar correções do cabeçalho
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'Queres fazer uma parceria com o YunaMyst Codes?': 'Queres fazer uma parceria com a YunaMyst Codes?',
              'Queres fazer uma parceria com o YunaMyst?': 'Queres fazer uma parceria com a YunaMyst?',
              'parceria com o YunaMyst Codes': 'parceria com a YunaMyst Codes',
              'parceria com o YunaMyst': 'parceria com a YunaMyst',
          }
          for src, dst in replacements.items():
              s = s.replace(src, dst)
          if './assets/header-final.css' not in s:
              s = s.replace('</head>', '<link rel="stylesheet" href="./assets/header-final.css?v=20260826"><meta name="build-version" content="header-nav-language-final-20260826"></head>', 1)
          else:
              s = re.sub(r'<meta name="build-version" content="[^"]*">', '<meta name="build-version" content="header-nav-language-final-20260826">', s, count=1)
          if './assets/i18n.js' not in s:
              s = s.replace('</body>', '<script src="./assets/i18n.js?v=20260826"></script>\n</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verificar publicação
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          required = ['🇧🇷 PT/BR', '🇬🇧 ENG', './assets/header-final.css', './assets/i18n.js', 'header-nav-language-final-20260826']
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit('ERRO: ' + ', '.join(missing))
          print('OK: cabeçalho, navegação central, PT/BR + ENG e tradução presentes.')
          PY

      - name: Guardar alterações
        run: |
          git config user.name 'YunaMyst Codes Bot'
          git config user.email 'actions@github.com'
          git add codes.json codes-history.json index.html .github/workflows/update-codes.yml assets/header-final.css assets/i18n.js
          if ! git diff --cached --quiet; then
            git commit -m 'Atualizar cabeçalho navegação e idioma'
            git push
          else
            echo 'Nenhuma alteração necessária.'
          fi
