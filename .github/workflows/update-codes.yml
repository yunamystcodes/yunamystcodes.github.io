name: Atualizar códigos automaticamente

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Buscar 20 fontes e atualizar códigos
        run: python3 scripts/update_codes.py

      - name: Corrigir YunaMyst no index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          # Mantém exatamente YunaMyst; somente o Y de Myst recebe a classe menor.
          s = re.sub(r'YunaM(?:<span class="myst-y">Y</span>)?yst', 'YunaM<span class="myst-y">Y</span>st', s, count=1)
          css = '''\n<style id="yunamyst-y-fix">\n.logo .myst-y{font-size:.82em!important;display:inline-block!important;line-height:1!important;transform:translateY(.02em)}\n@media(max-width:850px){.logo .myst-y{font-size:.82em!important}}\n</style>\n'''
          if 'id="yunamyst-y-fix"' not in s:
              s = s.replace('</head>', css + '</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verificar YunaMyst
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          if 'YunaM<span class="myst-y">Y</span>st' not in s:
              raise SystemExit('ERRO: YunaMyst não foi corrigido no index.html')
          if 'id="yunamyst-y-fix"' not in s:
              raise SystemExit('ERRO: CSS do Y não foi aplicado')
          print('OK: YunaMyst correto, com apenas o Y de Myst reduzido em PC e telemóvel.')
          PY

      - name: Guardar alterações
        run: |
          git config user.name 'YunaMyst Codes Bot'
          git config user.email 'actions@github.com'
          git add codes.json codes-history.json index.html .github/workflows/update-codes.yml assets/header-final.css assets/i18n.js
          if ! git diff --cached --quiet; then
            git commit -m 'Corrigir YunaMyst no index para PC e telemóvel'
            git push
          else
            echo 'Nenhuma alteração necessária.'
          fi
