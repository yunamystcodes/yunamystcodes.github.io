name: Atualizar códigos automaticamente

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: yunamyst-codes-update
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    # O próprio commit criado pelo bot não deve iniciar outro ciclo.
    if: github.event_name != 'push' || github.event.head_commit.author.username != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar códigos e atualizar lista
        run: python3 scripts/update_codes_safe.py
      - name: Verificar dados publicados
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('codes.json',encoding='utf-8'))
          codes=[str(c).upper() for c in d.get('codes',[])]
          if len(codes)!=len(set(codes)): raise SystemExit('ERRO: existem códigos duplicados')
          if not codes: raise SystemExit('ERRO: lista vazia')
          print(f'OK: {len(codes)} códigos ativos, sem duplicados.')
          PY
      - name: Atualizar cache-busting da página
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'codes\.json(?:\?v=[^"\']+)?', 'codes.json?v=__CODES_VERSION__', s)
          import time
          s=s.replace('__CODES_VERSION__', str(int(time.time())))
          p.write_text(s,encoding='utf-8')
          PY
      - name: Guardar atualização
        run: |
          git config user.name 'YunaMyst Codes Bot'
          git config user.email 'actions@github.com'
          git add codes.json codes-history.json index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Atualizar códigos ativos automaticamente'
            git push
          else
            echo 'Nenhuma alteração necessária.'
          fi
