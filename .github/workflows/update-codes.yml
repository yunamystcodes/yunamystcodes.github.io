name: Atualizar códigos automaticamente

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_codes.py'
      - '.github/workflows/update-codes.yml'

permissions:
  contents: write

concurrency:
  group: update-codes
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar site
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Atualizar códigos e remover expirados
        run: python3 scripts/update_codes.py

      - name: Publicar alterações
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html codes.json codes-history.json
          git diff --cached --quiet && exit 0
          git commit -m 'Atualizar códigos e remover expirados automaticamente'
          # Other site workflows may publish at the same time. Rebase on the
          # latest main before pushing, retrying if another commit wins the race.
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          echo "Não foi possível publicar após três tentativas." >&2
          exit 1
