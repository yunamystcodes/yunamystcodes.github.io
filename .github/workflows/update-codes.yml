name: Atualizar códigos automaticamente

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-codes
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar site
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Atualizar códigos e remover expirados
        run: python3 scripts/update_codes.py

      - name: Publicar alterações
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html codes.json codes-history.json
          git diff --cached --quiet && exit 0
          git commit -m 'Atualizar códigos e remover expirados automaticamente'
          git push
