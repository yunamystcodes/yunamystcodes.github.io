name: Atualizar códigos automaticamente
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Buscar códigos e atualizar site
        run: node scripts/update-codes.mjs
      - name: Guardar alterações
        run: |
          git config user.name 'YunaMyst Codes Bot'
          git config user.email 'actions@github.com'
          git add codes.json index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Atualizar códigos automaticamente'
            git push
          fi
