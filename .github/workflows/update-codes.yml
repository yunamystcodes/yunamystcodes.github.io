name: Atualizar códigos automaticamente

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: yunamyst-codes-update
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar códigos e atualizar lista
        run: python3 scripts/update_codes_safe.py
      - name: Verificar dados publicados
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('codes.json',encoding='utf-8'))
          codes=d.get('codes',[])
          if len(codes)!=len(set(codes)): raise SystemExit('ERRO: existem códigos duplicados')
          blocked={'GLHF2026AMERICAS','SWC26X10LEGACYBND'}
          if blocked.intersection(codes): raise SystemExit('ERRO: código rejeitado voltou à lista')
          if not codes: raise SystemExit('ERRO: lista vazia')
          print(f'OK: {len(codes)} códigos ativos, sem duplicados e sem códigos bloqueados.')
          PY
      - name: Guardar atualização
        run: |
          git config user.name 'YunaMyst Codes Bot'
          git config user.email 'actions@github.com'
          git add codes.json codes-history.json
          if ! git diff --cached --quiet; then
            git commit -m 'Atualizar códigos ativos automaticamente'
            git push
          else
            echo 'Nenhuma alteração necessária.'
          fi
