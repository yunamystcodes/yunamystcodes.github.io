name: Corrigir WhatsApp no index

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  corrigir:
    if: "!contains(github.event.head_commit.message, '[whatsapp-fix]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Corrigir ícone do WhatsApp preservando o SVG ao trocar idioma
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "wa:['💬 WHATSAPP','Entrar diretamente no grupo']"
          new = "wa:['WHATSAPP','Entrar diretamente no grupo']"
          s = s.replace(old, new, 1)
          old2 = "wa.querySelector('strong').textContent=d.wa[0];wa.querySelector('span').textContent=d.wa[1];"
          new2 = "wa.querySelector('#whatsappLabel').textContent=d.wa[0];wa.querySelector('.community-tab > span')?.replaceChildren(document.createTextNode(d.wa[1]));"
          if old2 in s:
              s = s.replace(old2, new2, 1)
          else:
              old3 = "wa.querySelector('strong').textContent=d.wa[0];wa.querySelector('span').textContent=d.wa[1]"
              s = s.replace(old3, new2, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commitar index atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Corrigir WhatsApp no index [whatsapp-fix]"
          git push

      - name: Remover workflow temporário
        run: |
          git rm .github/workflows/corrigir-whatsapp-index.yml
          git commit -m "Remover workflow temporário do WhatsApp [whatsapp-fix]"
          git push