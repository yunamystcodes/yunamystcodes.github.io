name: Install final bilingual FAQ

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install-faq:
    if: ${{ !contains(github.event.head_commit.message, '[skip faq]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add final FAQ script to index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./assets/faq-final.js?v=20260903"></script>'
          if tag not in s:
              marker='</body>'
              if marker in s:
                  s=s.replace(marker, tag+'\n'+marker, 1)
              else:
                  s += '\n'+tag+'\n'
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit index update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Install final bilingual FAQ [skip faq]"
          git push
