name: Move feedback below FAQ
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  move-feedback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move feedback section below FAQ
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          def find_close_div(text, start):
              tag_re = re.compile(r'<\s*(/?)\s*div\b[^>]*>', re.I)
              depth = 0
              for m in tag_re.finditer(text, start):
                  if m.group(1):
                      depth -= 1
                      if depth == 0:
                          return m.end()
                  else:
                      depth += 1
              return None

          # Remove every old feedback-section block, wherever it currently is.
          while True:
              m = re.search(r'<div\b[^>]*class=["\'][^"\']*\bfeedback-section\b[^"\']*["\'][^>]*>', s, re.I)
              if not m:
                  break
              end = find_close_div(s, m.start())
              if end is None:
                  break
              s = s[:m.start()] + s[end:]

          # Find the FAQ block and insert exactly after it.
          faq = re.search(r'<div\b[^>]*class=["\'][^"\']*\bfaq\b[^"\']*["\'][^>]*>', s, re.I)
          if not faq:
              raise SystemExit('FAQ block not found')
          faq_end = find_close_div(s, faq.start())
          if faq_end is None:
              raise SystemExit('FAQ closing tag not found')

          feedback = '''
          <div class="feedback-section" id="feedback">
            <div class="feedback-head">
              <h2>⭐ AVALIAÇÕES DOS PLAYERS</h2>
              <div class="feedback-summary" id="feedbackSummary">0.0 / 5 • 0 avaliações</div>
            </div>
            <button class="feedback-action" type="button" onclick="toggleFeedback()">✉ DÊ O SEU FEEDBACK</button>
            <div class="feedback-list" id="feedbackList"><div class="feedback-empty">Ainda não há avaliações de players.</div></div>
          </div>
          '''

          s = s[:faq_end] + feedback + s[faq_end:]
          s = s.replace('auto-codes-20260824-0829', 'auto-codes-20260824-0950-feedback-faq', 1)

          css = '''
          <style id="yunamyst-feedback-faq-final">
          /* FEEDBACK DIRECTLY BELOW FAQ - 20260824 */
          .feedback-section{margin-top:12px;background:linear-gradient(180deg,rgba(12,7,29,.97),rgba(5,4,17,.97));border:1px solid rgba(190,102,255,.4);border-radius:18px;box-shadow:0 18px 45px rgba(0,0,0,.4);overflow:hidden}
          .feedback-head{padding:16px 18px 10px;border-bottom:1px solid rgba(255,255,255,.08)}
          .feedback-head h2{padding:0!important;border:0!important;font-size:16px!important;color:#fff}
          .feedback-summary{margin-top:5px;color:#a99db7;font-size:10px}
          .feedback-action{display:block;width:calc(100% - 24px);height:44px;margin:12px;border:1px solid #edbd4e;border-radius:10px;background:linear-gradient(#f6cd70,#bd7d1d);color:#251400;font-weight:900;font-size:11px;cursor:pointer}
          .feedback-list{padding:0 12px 12px}.feedback-item{padding:12px 4px;border-top:1px solid rgba(255,255,255,.08)}
          .feedback-meta{display:flex;align-items:center;justify-content:space-between;gap:8px}.feedback-meta strong{color:#f0ce70;font-size:13px}.feedback-stars{color:#f0c45c;font-size:13px;letter-spacing:1px;white-space:nowrap}.feedback-message{margin-top:7px;color:#c9c0d0;font-size:11px;line-height:1.5;white-space:pre-wrap;word-break:break-word}.feedback-empty{padding:4px 2px 10px;color:#9f96ae;font-size:11px;text-align:center}
          @media(max-width:850px){.feedback-section{margin-top:12px}.feedback-head{padding:14px}.feedback-action{width:calc(100% - 20px);margin:10px;height:43px}.feedback-list{padding:0 10px 10px}.feedback-meta strong{font-size:12px}.feedback-stars{font-size:12px}}
          </style>
          '''
          if 'id="yunamyst-feedback-faq-final"' not in s:
              s = s.replace('</head>', css + '\n</head>', 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "YunaMyst Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/move-feedback-below-faq.yml
          git diff --cached --quiet && exit 0
          git commit -m "Place feedback directly below FAQ"
          git push
