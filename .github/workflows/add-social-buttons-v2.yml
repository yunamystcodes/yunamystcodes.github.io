name: Add social buttons v2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Atualizar index
        env:
          SOCIAL_BLOCK: |
            <div class="social-links" aria-label="Redes sociais">
              <a class="social-btn" href="https://www.twitch.tv/YunaMyst" target="_blank" rel="noopener noreferrer" aria-label="Twitch"><img src="https://cdn.simpleicons.org/twitch/9146FF" alt="Twitch"><span>Twitch</span></a>
              <a class="social-btn" href="https://www.tiktok.com/@yunamyst_" target="_blank" rel="noopener noreferrer" aria-label="TikTok"><img src="https://cdn.simpleicons.org/tiktok/FFFFFF" alt="TikTok"><span>TikTok</span></a>
              <a class="social-btn" href="https://www.youtube.com/@YunaMyst" target="_blank" rel="noopener noreferrer" aria-label="YouTube"><img src="https://cdn.simpleicons.org/youtube/FF0000" alt="YouTube"><span>YouTube</span></a>
            </div>
          MOBILE_BLOCK: |
            <div class="mobile-social social-links" aria-label="Redes sociais">
              <a class="social-btn" href="https://www.twitch.tv/YunaMyst" target="_blank" rel="noopener noreferrer" aria-label="Twitch"><img src="https://cdn.simpleicons.org/twitch/9146FF" alt="Twitch"></a>
              <a class="social-btn" href="https://www.tiktok.com/@yunamyst_" target="_blank" rel="noopener noreferrer" aria-label="TikTok"><img src="https://cdn.simpleicons.org/tiktok/FFFFFF" alt="TikTok"></a>
              <a class="social-btn" href="https://www.youtube.com/@YunaMyst" target="_blank" rel="noopener noreferrer" aria-label="YouTube"><img src="https://cdn.simpleicons.org/youtube/FF0000" alt="YouTube"></a>
            </div>
          SOCIAL_CSS: |
            <style id="yunamyst-social-final">
            .social-links{display:flex;justify-content:center;gap:8px;margin:12px auto 0}
            .social-btn{width:54px;height:54px;border:1px solid rgba(190,102,255,.45);border-radius:12px;background:rgba(10,5,24,.92);display:flex;align-items:center;justify-content:center;text-decoration:none;transition:.2s;box-shadow:0 7px 16px rgba(0,0,0,.25)}
            .social-btn img{width:30px;height:30px;object-fit:contain}
            .social-btn:hover{transform:translateY(-2px);border-color:#b65cff;box-shadow:0 0 14px rgba(156,76,255,.25)}
            .social-btn span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
            .mobile-social{display:none!important}
            @media(max-width:850px){.mobile-social{display:flex!important;margin:10px auto 14px}.social-btn{width:48px;height:48px}.social-btn img{width:27px;height:27px}}
            </style>
        run: |
          python3 - <<'PY'
          import os,re
          p='index.html'
          s=open(p,encoding='utf-8').read()
          changed=False
          if 'id="yunamyst-social-final"' not in s:
              s=s.replace('</head>',os.environ['SOCIAL_CSS'].strip()+'\n</head>',1); changed=True
          if 'class="social-links"' not in s:
              m=re.search(r'<div class="panel profile">.*?</p>',s,re.S)
              if not m: raise SystemExit('profile block not found')
              s=s[:m.end()]+os.environ['SOCIAL_BLOCK'].strip()+s[m.end():]
              s=s.replace('<div class="layout">',os.environ['MOBILE_BLOCK'].strip()+'\n<div class="layout">',1)
              changed=True
          s=s.replace('href="https://cdn.simpleicons.org/youtube/FF0000" target="_blank" rel="noopener noreferrer" aria-label="YouTube"','href="https://www.youtube.com/@YunaMyst" target="_blank" rel="noopener noreferrer" aria-label="YouTube"')
          if changed:
              open(p,'w',encoding='utf-8').write(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/add-social-buttons-v2.yml
          git commit -m "Adicionar botões Twitch TikTok e YouTube"
          git push