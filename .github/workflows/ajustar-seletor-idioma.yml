name: Ajustar seletor de idioma
on:
  push:
    paths:
      - '.github/workflows/ajustar-seletor-idioma.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar seletor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old_css='.lang-switch{display:flex;gap:0}.lang-btn{border:1px solid #553078;border-radius:10px;padding:9px 11px;background:#10091c;color:#fff;font-weight:800;font-size:12px;cursor:pointer}.lang-btn.active{border-color:#9c4cff;box-shadow:0 0 12px rgba(156,76,255,.18)}'
          new_css='.lang-switch{position:relative;display:flex;gap:0}.lang-btn{border:1px solid #553078;border-radius:10px;padding:9px 12px;background:#10091c;color:#fff;font-weight:800;font-size:12px;cursor:pointer}.lang-btn:after{content:"⌄";margin-left:8px;color:#c9b6ff;font-size:13px}.lang-btn.active{border-color:#9c4cff;box-shadow:0 0 12px rgba(156,76,255,.18)}.lang-menu{display:none;position:absolute;right:0;top:calc(100% + 6px);z-index:1000;min-width:118px;padding:5px;background:#10091c;border:1px solid #633487;border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.55)}.lang-switch.open .lang-menu{display:block}.lang-option{width:100%;border:0;background:transparent;color:#fff;padding:9px 10px;border-radius:7px;text-align:left;font-size:11px;font-weight:800;cursor:pointer}.lang-option:hover,.lang-option.selected{background:#2b1242}'
          if old_css not in s: raise SystemExit('CSS não encontrado')
          s=s.replace(old_css,new_css,1)
          old_html='<div class="lang-switch"><button class="lang-btn active" id="langToggle" onclick="toggleLanguage()">🇧🇷 PT/BR</button></div>'
          new_html='<div class="lang-switch" id="langSwitch"><button class="lang-btn active" id="langToggle" type="button" onclick="toggleLangMenu()">🇧🇷 PT/BR</button><div class="lang-menu" id="langMenu"><button class="lang-option selected" id="langPTOption" type="button" onclick="chooseLanguage(\'pt\')">🇧🇷 PT/BR</button><button class="lang-option" id="langENOption" type="button" onclick="chooseLanguage(\'en\')">🇺🇸 ENG</button></div></div>'
          if old_html not in s: raise SystemExit('HTML do idioma não encontrado')
          s=s.replace(old_html,new_html,1)
          old_fn="function toggleLanguage(){const current=localStorage.getItem('yunamyst-lang')||'pt';setLanguage(current==='pt'?'en':'pt')}"
          new_fn="function toggleLangMenu(){document.getElementById('langSwitch').classList.toggle('open')}\nfunction chooseLanguage(lang){setLanguage(lang);document.getElementById('langSwitch').classList.remove('open')}\ndocument.addEventListener('click',e=>{const box=document.getElementById('langSwitch');if(box&&!box.contains(e.target))box.classList.remove('open')})"
          if old_fn not in s: raise SystemExit('Função de idioma não encontrada')
          s=s.replace(old_fn,new_fn,1)
          old_end="const btn=document.getElementById('langToggle');if(btn)btn.textContent=lang==='en'?'🇺🇸 ENG':'🇧🇷 PT/BR';localStorage.setItem('yunamyst-lang',lang)}"
          new_end="const btn=document.getElementById('langToggle');if(btn)btn.innerHTML=lang==='en'?'🇺🇸 ENG':'🇧🇷 PT/BR';document.getElementById('langPTOption')?.classList.toggle('selected',lang==='pt');document.getElementById('langENOption')?.classList.toggle('selected',lang==='en');localStorage.setItem('yunamyst-lang',lang)}"
          if old_end not in s: raise SystemExit('Final da função de idioma não encontrado')
          s=s.replace(old_end,new_end,1)
          s=s.replace('2026-08-20-language-toggle','2026-08-20-language-dropdown',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit e remover este workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/ajustar-seletor-idioma.yml
          git add index.html
          git commit -m 'Adicionar seta e menu de escolha de idioma'
          git push