name: Atualizar códigos ativos - YunaCodes v2

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yunamyst-codes-v2
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Buscar apenas códigos atualmente ativos
        run: python3 scripts/update_codes_v2.py
      - name: Garantir carregador de códigos no site
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'auto-codes.js' not in s:
              s=s.replace('</body>','<script src="./auto-codes.js?v=20260901"></script>\n</body>',1)
          # Nunca permitir que o carregador volte a mostrar o fallback antigo.
          # Se codes.json falhar, a lista fica vazia em vez de exibir códigos expirados.
          a=Path('auto-codes.js')
          if a.exists():
              x=a.read_text(encoding='utf-8')
              x=x.replace("if(!codes.length)throw 0;render(codes,root)}catch(e){render(Object.keys(REWARDS),root)}", "if(!codes.length)throw 0;render(codes,root)}catch(e){root.innerHTML='';}")
              x=x.replace("'APAC26LEGASEA','LAST4PUNCHIN'", "'APAC26LEGASEA'")
              a.write_text(x,encoding='utf-8')
          # Defesa adicional: remove do DOM qualquer cartão que não esteja em codes.json.
          guard="""<script id=\"yunamyst-active-codes-guard\">\n(async()=>{try{const r=await fetch('./codes.json?guard='+Date.now(),{cache:'no-store'});if(!r.ok)return;const d=await r.json();const allowed=new Set((Array.isArray(d.codes)?d.codes:[]).map(x=>String(x).toUpperCase().replace(/[^A-Z0-9]/g,'')));const root=document.getElementById('ativos');if(!root)return;const clean=()=>root.querySelectorAll('.auto-code').forEach(el=>{const code=(el.querySelector('.cinfo strong')?.textContent||'').toUpperCase().replace(/[^A-Z0-9]/g,'');if(!allowed.has(code))el.remove()});clean();new MutationObserver(clean).observe(root,{childList:true})}catch(e){}})();\n</script>\n"""
          if 'yunamyst-active-codes-guard' not in s:
              s=s.replace('</body>',guard+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Publicar alterações
        run: |
          git config user.name 'YunaMyst Codes Bot'
          git config user.email 'actions@github.com'
          git add codes.json codes-history.json index.html auto-codes.js
          if ! git diff --cached --quiet; then
            git commit -m 'Atualizar códigos ativos automaticamente'
            git push
          else
            echo 'Nenhuma alteração necessária.'
          fi
