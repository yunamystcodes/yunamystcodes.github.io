name: Apply YunaMyst Header

on:
  push:
    branches: [main]
    paths-ignore:
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-header:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply final YunaMyst-only header
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          header = r'''<header class="top" id="site-header">
            <div class="header-wrap">
              <a class="header-brand" href="#inicio" aria-label="YunaMyst">
                <span class="crown">♛</span><span class="yuna">Yuna</span><span class="myst">Myst</span>
              </a>
              <nav class="header-nav" aria-label="Navegação principal">
                <a href="#inicio"><span>⌂</span> INÍCIO</a>
                <a href="#codigos"><span>🎁</span> CÓDIGOS</a>
                <a href="#como"><span>?</span> COMO USAR</a>
                <a href="#faq"><span>?</span> FAQ</a>
              </nav>
            </div>
          </header>'''

          s = re.sub(r'<header\b[^>]*>.*?</header>', header, s, count=1, flags=re.S | re.I)

          override = r'''<style id="yunamyst-header-final">
          /* FINAL HEADER — YunaMyst only: no fox, no old artwork. */
          #site-header.top{height:100px!important;min-height:100px!important;max-height:100px!important;background:#030206!important;border-top:3px solid #5f4c68!important;border-bottom:1px solid rgba(160,75,255,.35)!important;overflow:hidden!important;position:relative!important;z-index:99999!important}
          #site-header .header-wrap{height:97px!important;width:100%!important;background:#030206!important;overflow:hidden!important;position:relative!important;display:block!important}
          #site-header .header-brand{position:absolute!important;left:30px!important;top:0!important;height:97px!important;width:auto!important;display:flex!important;align-items:center!important;text-decoration:none!important;font-family:Georgia,'Times New Roman',serif!important;font-size:58px!important;font-style:italic!important;font-weight:900!important;letter-spacing:-4px!important;line-height:1!important;white-space:nowrap!important;background:none!important;text-shadow:0 0 7px rgba(177,77,255,.85),0 0 20px rgba(105,34,190,.55)!important;z-index:100001!important}
          #site-header .header-brand .yuna{color:#f8f4ff!important}
          #site-header .header-brand .myst{margin-left:2px!important;background:linear-gradient(180deg,#fff2b0 0%,#f4d15f 42%,#b76a12 100%)!important;-webkit-background-clip:text!important;background-clip:text!important;color:transparent!important}
          #site-header .header-brand .crown{position:absolute!important;left:51%!important;top:7px!important;transform:translateX(-50%)!important;font-family:Georgia,serif!important;font-size:20px!important;font-style:normal!important;letter-spacing:0!important;color:#f0c75a!important;text-shadow:0 0 8px rgba(195,93,255,.9),0 0 13px rgba(255,201,70,.55)!important}
          #site-header .header-nav{position:absolute!important;inset:0!important;height:97px!important;display:flex!important;align-items:center!important;justify-content:flex-end!important;padding:0 34px!important;gap:28px!important;background:transparent!important;z-index:100002!important}
          #site-header .header-nav a{color:#fff!important;text-decoration:none!important;font-weight:900!important;font-size:15px!important;line-height:1!important;white-space:nowrap!important;text-shadow:0 1px 6px #000!important}
          #site-header .header-nav a:hover{color:#e4baff!important}
          #site-header img.header-art,#site-header picture,#site-header svg:not(.icon){display:none!important;width:0!important;height:0!important}
          @media(max-width:850px){#site-header.top{height:82px!important;min-height:82px!important;max-height:82px!important}#site-header .header-wrap{height:79px!important}#site-header .header-brand{left:16px!important;height:79px!important;font-size:36px!important;letter-spacing:-2.5px!important}#site-header .header-brand .crown{top:5px!important;font-size:13px!important}#site-header .header-nav{height:79px!important;padding:0 10px!important;gap:12px!important}#site-header .header-nav a{font-size:10px!important}}
          </style>'''

          s = re.sub(r'\s*<style id="yunamyst-header-final">.*?</style>', '', s, flags=re.S)
          s = s.replace('</head>', override + '\n</head>', 1)
          s = re.sub(r'<img[^>]*class=["\']header-art["\'][^>]*>', '', s, flags=re.I)
          s = re.sub(r'<img[^>]*class=["\'][^>]*header-art[^>]*["\'][^>]*>', '', s, flags=re.I)
          s = s.replace('2026-08-19-header-logo-only', '2026-08-19-YUNAMYST-HEADER-FINAL')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit final header once
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: finalize YunaMyst-only header"
          git push