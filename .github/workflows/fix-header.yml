name: Apply YunaMyst Header

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-header:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace header styling only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          override = r'''<style id="yunamyst-header-final">
          /* FINAL YUNAMYST HEADER: logo only, no fox/image */
          .top{height:72px!important;border-top:3px solid #5f4c68!important;border-bottom:1px solid rgba(160,75,255,.35)!important;background:#030206!important;overflow:hidden!important}
          .header-wrap{height:69px!important;background:#030206!important;overflow:hidden!important}
          .header-art{display:none!important;visibility:hidden!important;width:0!important;height:0!important}
          .header-brand{left:28px!important;top:0!important;height:69px!important;font-family:Georgia,'Times New Roman',serif!important;font-size:45px!important;font-style:italic!important;font-weight:900!important;letter-spacing:-3px!important;white-space:nowrap!important;display:flex!important;align-items:center!important;text-shadow:0 0 7px rgba(177,77,255,.85),0 0 18px rgba(105,34,190,.5)!important}
          .header-brand .yuna{color:#f8f4ff!important}
          .header-brand .myst{margin-left:2px!important;background:linear-gradient(180deg,#fff2b0 0%,#f4d15f 42%,#b76a12 100%)!important;-webkit-background-clip:text!important;background-clip:text!important;color:transparent!important}
          .header-brand .crown{position:absolute!important;left:51%!important;top:4px!important;transform:translateX(-50%)!important;font-family:Georgia,serif!important;font-size:17px!important;font-style:normal!important;letter-spacing:0!important;color:#f0c75a!important;text-shadow:0 0 8px rgba(195,93,255,.9),0 0 13px rgba(255,201,70,.55)!important}
          .header-nav{position:absolute!important;inset:0!important;display:flex!important;align-items:center!important;justify-content:flex-end!important;padding:0 34px!important;gap:26px!important;background:transparent!important;z-index:10002!important}
          .header-nav a{font-size:14px!important;color:#fff!important}
          @media(max-width:850px){.top{height:64px!important}.header-wrap{height:61px!important}.header-brand{left:16px!important;height:61px!important;font-size:32px!important;letter-spacing:-2px!important}.header-brand .crown{top:3px!important;font-size:12px!important}.header-nav{padding:0 10px!important;gap:12px!important}.header-nav a{font-size:10px!important}}
          </style>'''

          s = re.sub(r'\s*<style id="yunamyst-header-final">.*?</style>', '', s, flags=re.S)
          s = s.replace('</head>', override + '\n</head>', 1)

          # Ensure the header contains no image element at all.
          s = re.sub(r'<img[^>]*class=["\']header-art["\'][^>]*>', '', s, flags=re.I)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit index update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: make header YunaMyst-only"
          git push