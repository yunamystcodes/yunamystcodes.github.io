name: Ajustar botões WhatsApp e Parceria

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-layout:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Ajustar botões compactos e responsivos
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          css = '''<style id="yuna-top-community-style">
          .community-links{width:min(1260px,calc(100% - 28px));margin:10px auto 0;display:flex;flex-direction:column;gap:7px}
          .community-tab{width:100%;min-height:46px;padding:10px 16px;border-radius:12px;display:flex;align-items:center;justify-content:space-between;gap:12px;text-decoration:none;cursor:pointer;font-family:Arial,Helvetica,sans-serif;background:rgba(11,5,25,.92);box-shadow:0 7px 18px rgba(0,0,0,.25)}
          .community-tab strong{font-size:14px;font-weight:900;letter-spacing:.2px}
          .community-tab span{font-size:11px;font-weight:700;color:#bcb2c9;text-align:right}
          .community-tab.whatsapp{border:1px solid #24c86b;color:#fff}
          .community-tab.whatsapp strong{color:#35dc7b}
          .community-tab.partnership{border:1px solid #c89628;color:#fff}
          .community-tab.partnership strong{color:#f0c45c}
          .partnership-panel{display:none;margin-top:0;padding:12px 15px;border:1px solid rgba(200,150,40,.7);border-radius:12px;background:rgba(12,7,28,.96);color:#c9c0d0;font-size:11px;line-height:1.5}
          .partnership-panel.open{display:block}
          @media(max-width:850px){
            .community-links{width:calc(100% - 18px);margin:8px auto 0;gap:6px}
            .community-tab{min-height:42px;padding:8px 11px;border-radius:9px;gap:8px}
            .community-tab strong{font-size:11px}
            .community-tab span{font-size:8px}
            .partnership-panel{padding:10px 11px;font-size:9px;border-radius:9px}
          }
          </style>'''

          s = re.sub(r'<style id="yuna-top-community-style">.*?</style>', css, s, flags=re.S)

          block = '''<!-- YUNA-TOP-COMUNIDADE-V2 -->
          <div class="community-links" id="comunidade">
            <a class="community-tab whatsapp" href="https://chat.whatsapp.com/KWg53GNpXDA3G5lDT8VwOg" target="_blank" rel="noopener noreferrer">
              <strong>💬 WHATSAPP</strong><span>Entrar no grupo</span>
            </a>
            <button class="community-tab partnership" type="button" onclick="toggleParceria()">
              <strong>🤝 PARCERIA</strong><span>Fazer parceria</span>
            </button>
            <div class="partnership-panel" id="parceriaPanel">
              <strong style="color:#e5b45c">🤝 PARCERIA YUNAMYST</strong><br>
              Queres fazer parceria com o YunaMyst? Este espaço fica reservado para futuras divulgações e colaborações.
            </div>
          </div>
          '''

          s = re.sub(r'<!-- YUNA-TOP-COMUNIDADE-V\d+ -->.*?(?=<section class="hero)', block, s, flags=re.S)

          # Garante que a função de parceria abre/fecha o painel.
          if 'function toggleParceria()' in s:
            s = re.sub(r'function toggleParceria\(\)\s*\{.*?\}', "function toggleParceria(){document.getElementById('parceriaPanel').classList.toggle('open')}", s, flags=re.S)
          else:
            s = s.replace('</body>', "<script>function toggleParceria(){document.getElementById('parceriaPanel').classList.toggle('open')}</script></body>")

          s = s.replace('2026-08-20-whatsapp-parceria', '2026-08-20-community-compact')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
          else
            git commit -m "Ajustar botões WhatsApp e Parceria [skip ci]"
            git push
          fi
