name: Fix community buttons

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip community fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix WhatsApp and Partnership labels
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old1 = "const wa=document.querySelector('.community-tab.whatsapp');if(wa)textNode(wa,T.whats);"
          new1 = "const wa=document.querySelector('.community-tab.whatsapp');const ws=wa?.querySelector('strong');if(ws)ws.textContent=T.whats;"
          old2 = "const pa=document.querySelector('.community-tab.partnership');if(pa)textNode(pa,T.partner);"
          new2 = "const pa=document.querySelector('.community-tab.partnership');const ps=pa?.querySelector('strong');if(ps)ps.textContent=T.partner;"
          s2 = s.replace(old1, new1).replace(old2, new2)
          if s2 == s:
              raise SystemExit('Language fixer lines not found; no safe change made.')
          p.write_text(s2, encoding='utf-8')
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix duplicate WhatsApp and partnership labels [skip community fix]"
          git pull --rebase origin main
          git push
      - name: Remove one-time workflow
        shell: bash
        run: |
          git rm .github/workflows/fix-community-buttons.yml
          git commit -m "Remove one-time community fix workflow [skip community fix]"
          git pull --rebase origin main
          git push
