name: Atualizar códigos automaticamente

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-codes:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar site
        uses: actions/checkout@v4

      - name: Atualizar códigos oficiais
        run: python3 scripts/update_codes.py

      - name: Publicar alterações
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add codes.json
          git diff --cached --quiet && exit 0
          git commit -m 'Atualizar códigos do Summoners War automaticamente'
          git push
