name: Corrigir abas dos códigos

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  layout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aplicar layout vertical das abas
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<!-- YUNA-LAYOUT-TABS-V3 -->'
          if marker in s:
              print('Layout V3 já aplicado; nada para alterar.')
              raise SystemExit(0)
          snippet = r'''<!-- YUNA-LAYOUT-TABS-V3 -->
          <style>
          .tabs.yuna-tabs-v3{display:flex!important;flex-direction:column!important;gap:8px!important;width:100%!important;padding:12px!important;margin:0!important;border-top:1px solid rgba(255,255,255,.08)!important;border-bottom:0!important}
          .tabs.yuna-tabs-v3 .tab{width:100%!important;flex:none!important;min-height:45px!important}
          </style>
          <script>
          (function(){
            function fixLayout(){
              const active=document.getElementById('ativos');
              const expired=document.getElementById('expirados');
              const tabs=document.querySelector('.tabs');
              const ta=document.getElementById('tabAtivos');
              const te=document.getElementById('tabExpirados');
              if(!active || !tabs) return;
              tabs.classList.add('yuna-tabs-v3');
              document.querySelectorAll('#countAtivos,#countExpirados,.tab-count').forEach(function(el){el.remove();});
              active.parentNode.insertBefore(tabs,active.nextSibling);
              if(expired) tabs.parentNode.insertBefore(expired,tabs.nextSibling);
              active.style.display='flex';
              if(expired && !expired.dataset.yunaShown) expired.style.display='none';
              window.mostrar=function(tipo){
                active.style.display='flex';
                if(expired){
                  expired.style.display=(tipo==='expirados')?'flex':'none';
                  expired.dataset.yunaShown='1';
                }
                if(ta) ta.classList.toggle('active',tipo==='ativos');
                if(te) te.classList.toggle('active',tipo==='expirados');
              };
            }
            if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',fixLayout,{once:true});
            else fixLayout();
            setTimeout(fixLayout,100);
            setTimeout(fixLayout,500);
          })();
          </script>
          '''
          if '</body>' not in s.lower(): raise SystemExit('index.html não contém </body>.')
          pos=s.lower().rfind('</body>')
          s=s[:pos]+snippet+'\n'+s[pos:]
          p.write_text(s,encoding='utf-8')
          print('Layout V3 aplicado: abas verticais abaixo dos códigos ativos.')
          PY

      - name: Publicar alteração
        run: |
          git config user.name 'YunaMyst Codes Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração necessária.'
            exit 0
          fi
          git commit -m 'Colocar abas verticalmente abaixo dos códigos ativos'
          git push
