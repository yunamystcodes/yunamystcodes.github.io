name: Atualizar layout dos códigos

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  layout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aplicar layout estável
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<!-- YUNA-LAYOUT-TABS-V2 -->'

          if marker in s:
              print('Layout já aplicado; nada para alterar.')
              raise SystemExit(0)

          snippet = r'''<!-- YUNA-LAYOUT-TABS-V2 -->
          <style>
          .tabs.yuna-fixed-tabs{margin-top:12px;border-top:1px solid rgba(255,255,255,.08);border-bottom:0}
          .tabs.yuna-fixed-tabs .tab{min-width:0}
          </style>
          <script>
          (function(){
            function fixLayout(){
              const active=document.getElementById('ativos');
              const expired=document.getElementById('expirados');
              const tabs=document.querySelector('.tabs');
              if(!active || !tabs) return;

              tabs.classList.add('yuna-fixed-tabs');

              document.querySelectorAll('#countAtivos,#countExpirados,.tab-count').forEach(function(el){el.remove();});

              // Coloca as abas imediatamente depois de TODOS os códigos ativos.
              active.parentNode.insertBefore(tabs, active.nextSibling);

              // Os expirados ficam depois das abas.
              if(expired) tabs.parentNode.insertBefore(expired, tabs.nextSibling);
            }

            if(document.readyState==='loading'){
              document.addEventListener('DOMContentLoaded',fixLayout,{once:true});
            }else{
              fixLayout();
            }
            setTimeout(fixLayout,100);
            setTimeout(fixLayout,500);
          })();
          </script>
          '''

          if '</body>' not in s.lower():
              raise SystemExit('index.html não contém </body>.')

          pos=s.lower().rfind('</body>')
          s=s[:pos]+snippet+'\n'+s[pos:]
          p.write_text(s,encoding='utf-8')
          print('Layout aplicado: abas abaixo dos códigos ativos e sem contadores.')
          PY

      - name: Publicar alteração
        run: |
          git config user.name 'YunaMyst Codes Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração necessária.'
            exit 0
          fi
          git commit -m 'Fixar abas abaixo dos códigos ativos'
          git push
