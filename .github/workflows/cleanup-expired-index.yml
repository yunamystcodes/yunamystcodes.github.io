name: Corrigir códigos expirados no index

on:
  push:
    paths:
      - '.github/workflows/cleanup-expired-index.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Atualizar index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<!-- YUNA-EXPIRED-FIX -->'
          if marker not in s:
              snippet = r'''<!-- YUNA-EXPIRED-FIX -->
          <style>
          .yuna-expired-panel{margin-top:18px;padding:18px;border:1px solid rgba(190,102,255,.4);border-radius:18px;background:linear-gradient(180deg,rgba(12,7,29,.96),rgba(5,4,17,.96));color:#fff}
          .yuna-expired-panel h3{margin:0 0 12px;color:#d99cff;font-size:20px}
          .yuna-expired-list{display:flex;flex-direction:column;gap:8px}
          .yuna-expired-item{padding:10px 12px;border:1px solid rgba(180,80,255,.25);border-radius:10px;color:#aaa;background:rgba(20,10,30,.65);font-weight:700}
          </style>
          <script>
          (function(){
            const BLOCKED=new Set(['MYSTICAL','QUANTITY','CRYSTAL','PURCHASES','SUMMONING','LENGEDARY']);
            function clean(){
              const lists=[...document.querySelectorAll('.codes')];
              if(!lists.length)return;
              const active=lists[0];
              let panel=document.querySelector('.yuna-expired-panel');
              if(!panel){
                panel=document.createElement('section');panel.className='yuna-expired-panel';
                panel.innerHTML='<h3>⛔ Códigos Expirados</h3><div class="yuna-expired-list"></div>';
                active.parentElement.appendChild(panel);
              }
              const out=panel.querySelector('.yuna-expired-list');
              const already=new Set([...out.children].map(x=>x.dataset.code));
              [...active.querySelectorAll('.code')].forEach(card=>{
                const raw=card.dataset.code || card.querySelector('.cinfo strong')?.textContent || '';
                const code=raw.trim().toUpperCase();
                if(BLOCKED.has(code)){
                  if(!already.has(code)){
                    const item=document.createElement('div');item.className='yuna-expired-item';item.dataset.code=code;item.textContent=code+' — expirado';out.appendChild(item);
                  }
                  card.remove();
                }
              });
              if(!out.children.length)panel.style.display='none';
            }
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',clean,{once:true});else clean();
            setTimeout(clean,500);setTimeout(clean,1500);
          })();
          </script>
          '''
              s=s.replace('</body>', snippet+'\n</body>',1)
              p.write_text(s,encoding='utf-8')
          PY

      - name: Commitar alteração do index
        run: |
          git config user.name 'YunaMyst Codes Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Remover códigos inativos dos ativos e mostrar em expirados'
          git push