name: Corrigir abas dos códigos

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  layout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Corrigir clique da aba de expirados
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<!-- YUNA-TABS-TOGGLE-V4 -->'
          if marker in s:
              print('Toggle V4 já aplicado.')
              raise SystemExit(0)
          snippet = r'''<!-- YUNA-TABS-TOGGLE-V4 -->
          <script>
          (function(){
            function instalarToggle(){
              const active=document.getElementById('ativos');
              const expired=document.getElementById('expirados');
              const ta=document.getElementById('tabAtivos');
              const te=document.getElementById('tabExpirados');
              if(!active || !expired || !ta || !te) return;
              window.mostrar=function(tipo){
                if(tipo==='expirados'){
                  const aberto=expired.style.display==='flex' || getComputedStyle(expired).display==='flex';
                  if(aberto){
                    expired.style.display='none';
                    te.classList.remove('active');
                    ta.classList.add('active');
                    if(location.hash==='#expirados') history.replaceState(null,'','#codigos');
                    return;
                  }
                  active.style.display='flex';
                  expired.style.display='flex';
                  ta.classList.remove('active');
                  te.classList.add('active');
                  history.replaceState(null,'','#expirados');
                  return;
                }
                active.style.display='flex';
                expired.style.display='none';
                ta.classList.add('active');
                te.classList.remove('active');
                history.replaceState(null,'','#codigos');
              };
            }
            instalarToggle();
            setTimeout(instalarToggle,100);
            setTimeout(instalarToggle,500);
          })();
          </script>
          '''
          pos=s.lower().rfind('</body>')
          if pos < 0: raise SystemExit('index.html não contém </body>.')
          s=s[:pos]+snippet+'\n'+s[pos:]
          p.write_text(s,encoding='utf-8')
          PY

      - name: Publicar alteração
        run: |
          git config user.name 'YunaMyst Codes Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração necessária.'
            exit 0
          fi
          git commit -m 'Permitir abrir e fechar aba de códigos expirados'
          git push
