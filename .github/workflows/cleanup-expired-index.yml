name: Corrigir códigos expirados no index

on:
  push:
    paths:
      - '.github/workflows/cleanup-expired-index.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Atualizar index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'YUNA-EXPIRED-REAL-TOGGLE-2026-08-17'
          if marker not in s:
              snippet = r'''<!-- YUNA-EXPIRED-REAL-TOGGLE-2026-08-17 -->
          <style>
          .yuna-expired-hidden{display:none!important}
          </style>
          <script>
          (function(){
            function txt(el){return (el&&el.textContent||'').replace(/\s+/g,' ').trim();}
            function isHeader(el){
              var t=txt(el);
              return t.length<=100 && /CÓDIGOS EXPIRADOS(?:\s*\(\d+\))?/i.test(t);
            }
            function findList(header){
              if(!header) return null;
              var parent=header.parentElement;
              if(!parent) return null;
              var kids=[].slice.call(parent.children);
              var idx=kids.indexOf(header);
              for(var i=idx+1;i<kids.length;i++){
                var x=kids[i], t=txt(x);
                if(x.querySelector && (x.querySelector('.code,[class*="expired"]') || /CÓDIGO EXPIRADO/i.test(t))) return x;
              }
              var direct=parent.querySelector('.yuna-expired-list');
              if(direct) return direct;
              var codes=[].slice.call(parent.querySelectorAll('.code'));
              if(codes.length){
                var holder=codes[0].parentElement;
                if(holder && holder!==header) return holder;
              }
              return null;
            }
            function setup(){
              document.querySelectorAll('h1,h2,h3,h4,h5,h6,button,summary,div,span,a').forEach(function(el){
                if(el.dataset.yunaRealToggle==='1') return;
                if(!isHeader(el)) return;
                var list=findList(el);
                if(!list) return;
                el.dataset.yunaRealToggle='1';
                el.style.cursor='pointer';
                el.setAttribute('role','button');
                el.setAttribute('aria-expanded','true');
                el.addEventListener('click',function(e){
                  e.preventDefault();
                  e.stopImmediatePropagation();
                  var current=findList(el)||list;
                  var hidden=current.classList.toggle('yuna-expired-hidden');
                  current.style.setProperty('display',hidden?'none':'','important');
                  el.setAttribute('aria-expanded',hidden?'false':'true');
                },true);
              });
            }
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',setup);else setup();
            new MutationObserver(setup).observe(document.documentElement,{childList:true,subtree:true});
          })();
          </script>
          '''
              s=s.replace('</body>', snippet+'\n</body>',1)
              p.write_text(s,encoding='utf-8')
          PY

      - name: Commitar alteração do index
        run: |
          git config user.name 'YunaMyst Codes Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Corrigir botão de códigos expirados no PC e telemóvel'
          git push
