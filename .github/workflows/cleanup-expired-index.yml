name: Personalizar site YunaMyst

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  personalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Atualizar layout e comunidade
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Cabeçalho: deixar somente SUMMONERS WAR.
          s = s.replace('YunaMyst — Códigos Summoners War', 'YunaMyst — Summoners War')
          s = s.replace('Códigos ativos e expirados de Summoners War — YunaMyst.', 'Summoners War — YunaMyst.')
          s = s.replace('CÓDIGOS DE SUMMONERS WAR 2026', 'SUMMONERS WAR')
          s = s.replace('🎁 CÓDIGOS <span>⟳ Sempre atualizados!</span>', '⚔ SUMMONERS WAR <span>⟳ Sempre atualizados!</span>')
          s = s.replace('🎁 CÓDIGOS</a>', '⚔ SUMMONERS WAR</a>')

          # Se o link do WhatsApp tiver sido colado como texto, removê-lo.
          s = re.sub(r'https://chat\.whatsapp\.com/KWg53GNpXDA3G5lDT8VwOg[^\s<\"]*', '', s)

          marker = '<!-- YUNA-COMUNIDADE-V1 -->'
          if marker not in s:
              style = r'''
          <style id="yuna-comunidade-style">
          .community-links{padding:12px;display:flex;flex-direction:column;gap:10px;border-top:1px solid rgba(255,255,255,.08)}
          .community-tab{width:100%;min-height:58px;border-radius:12px;border:1px solid #633487;background:linear-gradient(100deg,rgba(25,9,42,.98),rgba(10,5,20,.98));color:#fff;text-decoration:none;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;font-weight:900;cursor:pointer;font-size:14px}
          .community-tab span{font-size:11px;color:#bfaecb;font-weight:600;margin-left:12px;text-align:right}
          .community-tab.whatsapp{border-color:#5aaf73}
          .community-tab.whatsapp:hover{border-color:#7ee29a;box-shadow:0 0 16px rgba(72,190,105,.18)}
          .community-tab.partnership{border-color:#b07a38}
          .community-tab.partnership:hover{border-color:#e5b45c;box-shadow:0 0 16px rgba(229,180,92,.18)}
          .partnership-panel{display:none;padding:14px 16px;margin-top:-3px;border:1px solid rgba(229,180,92,.35);border-radius:12px;background:rgba(30,15,28,.9);color:#cfc3d5;font-size:13px;line-height:1.5}
          .partnership-panel.open{display:block}
          @media(max-width:850px){.community-tab{font-size:12px;min-height:54px}.community-tab span{font-size:9px}}
          </style>
          '''
              pos_style = s.lower().rfind('</style>')
              if pos_style < 0:
                  raise SystemExit('Não encontrei </style> no index.html')
              s = s[:pos_style+8] + style + s[pos_style+8:]

              block = r'''
          <!-- YUNA-COMUNIDADE-V1 -->
          <div class="community-links" id="comunidade">
            <a class="community-tab whatsapp" href="https://chat.whatsapp.com/KWg53GNpXDA3G5lDT8VwOg?s=cl&amp;p=a&amp;ilr=0" target="_blank" rel="noopener noreferrer">
              <strong>💬 WHATSAPP</strong><span>Entrar diretamente no grupo</span>
            </a>
            <button class="community-tab partnership" type="button" onclick="toggleParceria()">
              <strong>🤝 PARCERIA</strong><span>Ver informações de parceria</span>
            </button>
            <div class="partnership-panel" id="parceriaPanel">
              <strong style="color:#e5b45c">🤝 PARCERIA YUNAMYST</strong><br>
              Queres fazer parceria com o YunaMyst? Este espaço fica reservado para futuras divulgações e colaborações.
            </div>
          </div>
          <script>
          function toggleParceria(){
            const p=document.getElementById('parceriaPanel');
            if(p) p.classList.toggle('open');
          }
          </script>
          '''
              # Coloca WhatsApp e Parceria dentro do painel central, abaixo do último código.
              start = s.find('<section class="panel" id="codigos">')
              if start < 0:
                  raise SystemExit('Não encontrei o painel de Summoners War')
              end = s.find('</section>', start)
              if end < 0:
                  raise SystemExit('Não encontrei o fim do painel de Summoners War')
              s = s[:end] + block + s[end:]

          # Atualiza a versão para facilitar o cache-busting.
          s = re.sub(r'<meta name="build-version" content="[^"]*">', '<meta name="build-version" content="2026-08-20-whatsapp-parceria">', s, count=1)
          p.write_text(s, encoding='utf-8')
          print('Personalização concluída.')
          PY

      - name: Publicar
        run: |
          git config user.name 'YunaMyst Codes Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html .github/workflows/cleanup-expired-index.yml
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração necessária.'
            exit 0
          fi
          git commit -m 'Adicionar WhatsApp e parceria ao site'
          git push
