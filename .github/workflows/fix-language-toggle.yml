name: Fix language toggle
on:
  push:
    paths:
      - '.github/workflows/fix-language-toggle.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix language selector
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('.lang-switch{display:flex;gap:6px}', '.lang-switch{display:flex;gap:0}')
          s = s.replace('.lang-btn.active{border-color:#9c4cff;box-shadow:0 0 12px rgba(156,76,255,.18)}', '.lang-btn.active{border-color:#9c4cff;box-shadow:0 0 12px rgba(156,76,255,.18)}')
          old = '<div class="lang-switch"><button class="lang-btn active" id="langPT" onclick="setLanguage(\'pt\')">🇧🇷 PT/BR</button><button class="lang-btn" id="langEN" onclick="setLanguage(\'en\')">🇺🇸 ENG</button></div>'
          new = '<div class="lang-switch"><button class="lang-btn active" id="langToggle" onclick="toggleLanguage()">🇧🇷 PT/BR</button></div>'
          if old not in s:
              raise SystemExit('language buttons not found')
          s = s.replace(old, new, 1)
          s = s.replace('.lang-switch{gap:4px}.lang-btn{padding:8px 8px;font-size:10px}.nav{gap:8px}', '.lang-switch{gap:0}.lang-btn{padding:8px 11px;font-size:10px}.nav{gap:8px}')
          old_end = "document.getElementById('langPT').classList.toggle('active',lang==='pt');document.getElementById('langEN').classList.toggle('active',lang==='en');localStorage.setItem('yunamyst-lang',lang)}"
          new_end = "const btn=document.getElementById('langToggle');if(btn)btn.textContent=lang==='en'?'🇺🇸 ENG':'🇧🇷 PT/BR';localStorage.setItem('yunamyst-lang',lang)}\nfunction toggleLanguage(){const current=localStorage.getItem('yunamyst-lang')||'pt';setLanguage(current==='pt'?'en':'pt')}"
          if old_end not in s:
              raise SystemExit('language function ending not found')
          s = s.replace(old_end, new_end, 1)
          s = s.replace('2026-08-20-idiomas', '2026-08-20-language-toggle')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Corrigir seletor de idioma para alternar ao clicar'
          git push
