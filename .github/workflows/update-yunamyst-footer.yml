name: Atualizar rodape YunaMyst
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  footer:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip footer]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar rodape compacto YunaMyst
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Remover qualquer rodape antigo/duplicado, incluindo a versao #rodape
          # e qualquer rodape YunaMyst ja existente. Depois inserir exatamente um.
          s=re.sub(r'<footer\b[^>]*\bid=["\']rodape["\'][^>]*>.*?</footer>\s*','',s,flags=re.S|re.I)
          s=re.sub(r'<footer\b[^>]*\bclass=["\'][^"\']*ym-brand-footer[^"\']*["\'][^>]*>.*?</footer>\s*','',s,flags=re.S|re.I)
          s=re.sub(r'<style\s+id=["\']yunamyst-brand-footer-css["\'][^>]*>.*?</style>\s*','',s,flags=re.S|re.I)
          s=re.sub(r'<script\s+id=["\']yunamyst-footer-final-js["\'][^>]*>.*?</script>\s*','',s,flags=re.S|re.I)
          s=re.sub(r'<!--\s*YUNAMYST BRAND FOOTER START\s*-->.*?<!--\s*YUNAMYST BRAND FOOTER END\s*-->\s*','',s,flags=re.S|re.I)

          footer='''<!-- YUNAMYST BRAND FOOTER START -->
          <style id="yunamyst-brand-footer-css">
          .ym-brand-footer{position:relative;margin-top:34px;padding:26px 18px 22px;background:linear-gradient(180deg,rgba(9,5,22,.88),rgba(4,3,13,.98));border-top:1px solid rgba(171,91,255,.45);text-align:center;overflow:hidden}.ym-brand-footer:before{content:"";position:absolute;top:0;left:50%;width:280px;height:1px;transform:translateX(-50%);background:#d7a4ff;box-shadow:0 0 18px rgba(190,102,255,.9)}.ym-footer-inner{position:relative;max-width:900px;margin:auto}.ym-footer-name{display:flex;align-items:center;justify-content:center;gap:12px;color:#d9a8ff;font-family:Georgia,serif;font-style:italic;font-size:26px;line-height:1;text-shadow:0 0 16px rgba(185,93,255,.45);letter-spacing:.4px}.ym-footer-name:before,.ym-footer-name:after{content:"✦";font-family:Arial,sans-serif;font-style:normal;font-size:15px;color:#f1d3ff}.ym-footer-credit{margin:12px 0 16px;color:#b9afc8;font-size:14px;font-weight:700;letter-spacing:.35px}.ym-footer-credit .note{color:#9d70cf}.ym-footer-music{color:#9e78c8;font-size:15px;margin:0 6px}.ym-footer-bottom{margin-top:16px;padding-top:14px;border-top:1px solid rgba(182,92,255,.18);color:#8e879d;font-size:12px}.ym-footer-spark{color:#c894ff;margin:0 8px}@media(max-width:600px){.ym-brand-footer{margin-top:22px;padding:22px 12px 18px}.ym-footer-name{font-size:22px;gap:9px}.ym-footer-credit{font-size:12px;line-height:1.55;margin:10px 0 12px}.ym-footer-music{font-size:13px}.ym-footer-bottom{font-size:11px;margin-top:13px;padding-top:12px}}
          </style>
          <footer class="ym-brand-footer" id="yunamyst-brand-footer"><div class="ym-footer-inner"><div class="ym-footer-name">YunaMyst</div><div class="ym-footer-credit"><span class="ym-footer-music">♫</span> Site e letra de música <span class="note">criados por YunaMyst</span> <span class="ym-footer-music">♫</span></div><div class="ym-footer-bottom"><span class="ym-footer-spark">✦</span>© 2026 YunaMyst. Todos os direitos reservados.<span class="ym-footer-spark">✦</span></div></div></footer>
          <!-- YUNAMYST BRAND FOOTER END -->'''
          s=s.replace('</body>',footer+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Publicar index atualizado
        run: |
          git config user.name 'YunaMyst Site Bot'
          git config user.email 'actions@github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Remover rodape duplicado do index [skip footer]'
            git push
          fi
