name: MANTER FEEDBACK GLOBAL

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  feedback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Garantir carregamento do feedback global
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./feedback-global.js?v=20260902"></script>'
          if tag not in s:
              marker='</body>'
              if marker not in s:
                  raise SystemExit('index.html sem </body>')
              s=s.replace(marker,tag+'\n'+marker,1)
              p.write_text(s,encoding='utf-8')
      - name: Publicar somente se necessário
        shell: bash
        run: |
          git config user.name 'YunaMyst Feedback Bot'
          git config user.email 'actions@github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Garantir feedback global sem alterar códigos'
          git push origin HEAD:main
