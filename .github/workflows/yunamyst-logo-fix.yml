name: YunaMyst logo fix

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  fix-logo:
    if: github.event.issue.title == 'YunaMyst logo fix'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix logo in index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('YunaM<span class="myst-y">Y</span>st', 'YunaMyst')
          s = s.replace('Códigos ativos de Summoners War — YunaM<span class="myst-y">Y</span>st.', 'Códigos ativos de Summoners War — YunaMyst.')
          css = '''<style id="yunamyst-logo-fix">
          .logo{white-space:nowrap}
          .logo{font-size:34px}
          @media(max-width:850px){.logo{font-size:25px}}
          </style>
          '''
          if 'id="yunamyst-logo-fix"' not in s:
              s = s.replace('</head>', css + '</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix YunaMyst logo on PC and mobile"
          git push

      - name: Close trigger issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --comment "Logo atualizado no index.html para YunaMyst, com ajuste para PC e telemóvel."