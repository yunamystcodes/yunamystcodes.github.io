name: Corrigir feedback agora

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Desativar criação do feedback
        shell: python
        run: |
          from pathlib import Path
          p = Path('auto-codes.js')
          s = p.read_text(encoding='utf-8')
          old = '  initFeedback();\n})();'
          new = '  // Feedback removido definitivamente.\n})();'
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

      - name: Remover este workflow e publicar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add auto-codes.js
          git rm .github/workflows/fix-feedback-now.yml
          git commit -m 'Remover feedback definitivamente [skip ci]'
          git push
