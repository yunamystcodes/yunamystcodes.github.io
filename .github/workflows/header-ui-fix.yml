name: Update YunaMyst header on PC and mobile
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix-header:
    if: ${{ !contains(github.event.head_commit.message, 'Update YunaMyst header on PC and mobile') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove stray header text and fix YunaMyst
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove the stray fragment that appeared in the upper-left corner.
          s = re.sub(r'yst\.?["\']?>', '', s)

          # Remove any accidental standalone loose fragment at the beginning of body.
          s = re.sub(r'(<body[^>]*>\s*)yst\.?["\']?>\s*', r'\1', s, flags=re.I)

          # Ensure the brand is exactly YunaMyst when the split logo markup exists.
          s = s.replace('YunaMYst', 'YunaMyst')
          s = s.replace('YunaMYST', 'YunaMyst')

          marker = '/* YUNAMYST HEADER CLEAN WORKFLOW 20260826 */'
          css = f'''\n<style id="yunamyst-header-clean-workflow">\n{marker}\n/* Only the lowercase y in Myst is reduced so the logo never overlaps the w. */\n.logo .myst-y {{ font-size: .76em !important; display: inline-block !important; line-height: 1 !important; transform: translateY(.02em) !important; }}\n@media (max-width: 850px) {{\n  .logo .myst-y {{ font-size: .76em !important; }}\n}}\n</style>\n'''

          if marker not in s:
              s = s.replace('</head>', css + '</head>', 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify requested changes
        run: |
          ! grep -nE 'yst\.?["'"']?>' index.html
          grep -n 'YunaMyst' index.html || true

      - name: Commit changes back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Update YunaMyst header on PC and mobile"
          git push
