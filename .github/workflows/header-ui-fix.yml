name: Fix YunaMyst header on PC and mobile

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-header:
    if: ${{ !contains(github.event.head_commit.message, '[skip header]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove stray text and fix YunaMyst
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          # Remove the exact stray fragment reported in the upper-left corner.
          for bad in ('yst.\">', 'yst.">', 'yst.\">', 'yst.\'>'):
              s = s.replace(bad, '')

          # Remove malformed standalone text if it occurs immediately after <body>.
          s = re.sub(r'(<body[^>]*>\s*)yst\.?["\'>]+\s*', r'\1', s, flags=re.I)

          # Correct the brand wherever the wrong capitalization was introduced.
          s = s.replace('YunaMYst', 'YunaMyst')
          s = s.replace('YunaMYST', 'YunaMyst')
          s = s.replace('YunaMyst.</span>', 'YunaMyst</span>')

          # Keep only the lowercase y in Myst smaller, on desktop and mobile.
          marker = 'YUNAMYST HEADER CLEAN WORKFLOW 20260828 V3'
          css = f'''\n<style id="yunamyst-header-clean-workflow">\n/* {marker} */\n.logo .myst-y {{\n  font-size: .76em !important;\n  display: inline-block !important;\n  line-height: 1 !important;\n  transform: translateY(.02em) !important;\n}}\n@media (max-width: 850px) {{\n  .logo .myst-y {{ font-size: .76em !important; }}\n}}\n</style>\n'''

          if marker not in s:
              s = s.replace('</head>', css + '</head>', 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify header cleanup
        shell: bash
        run: |
          if grep -nF 'yst.">' index.html; then
            echo 'Stray yst. fragment still exists.'
            exit 1
          fi
          echo 'Header cleanup verified.'

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Fix YunaMyst header [skip header]"
          git push
