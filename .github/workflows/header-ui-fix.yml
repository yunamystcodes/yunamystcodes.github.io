name: Fix YunaMyst header on PC and mobile

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-header:
    if: ${{ !contains(github.event.head_commit.message, '[skip header]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply final YunaMyst layout to index.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Keep the logo text exactly YunaMyst.
          s = re.sub(
              r'<div class="logo">.*?<small>SUMMONERS WAR</small></div>',
              '<div class="logo">YunaMyst<small>SUMMONERS WAR</small></div>',
              s, count=1, flags=re.S
          )

          # Keep the existing logo spacing fix.
          marker_logo = '<style id="yunamyst-final-subtitle-spacing">'
          if marker_logo not in s:
              css_logo = '''<style id="yunamyst-final-subtitle-spacing">
.logo small{margin-top:10px!important}
@media(max-width:850px){.logo small{margin-top:10px!important}}
</style>'''
              s = s.replace('</head>', css_logo + '\n</head>', 1)

          # Final layout fixes are placed directly in index.html so they win over
          # older external/header styles on both PC and mobile.
          marker = '<style id="yunamyst-index-final-layout-v4">'
          css = '''<style id="yunamyst-index-final-layout-v4">
/* SUMMONERS WAR title: centered inside the codes panel on every screen. */
#codigos .section-head{position:relative!important;text-align:center!important;display:flex!important;align-items:center!important;justify-content:center!important;min-height:62px!important;padding:16px 170px 16px 16px!important;}
#codigos .section-head span{position:absolute!important;right:18px!important;top:50%!important;transform:translateY(-50%)!important;float:none!important;margin:0!important;white-space:nowrap!important;}

/* HOW TO USE: force the four numbered circles to display 1, 2, 3, 4. */
#como .step .num{font-size:0!important;color:#fff!important;text-align:center!important;line-height:28px!important;}
#como .step:nth-child(2) .num::before{content:'1'!important;font-size:13px!important;color:#fff!important;}
#como .step:nth-child(3) .num::before{content:'2'!important;font-size:13px!important;color:#fff!important;}
#como .step:nth-child(4) .num::before{content:'3'!important;font-size:13px!important;color:#fff!important;}
#como .step:nth-child(5) .num::before{content:'4'!important;font-size:13px!important;color:#fff!important;}

@media(max-width:850px){
  #codigos .section-head{min-height:55px!important;padding:14px 112px 14px 12px!important;font-size:19px!important;}
  #codigos .section-head span{right:12px!important;font-size:9px!important;}
}
</style>'''

          if marker in s:
              s = re.sub(re.escape(marker) + r'.*?</style>', css.rstrip('</style>') + '</style>', s, count=1, flags=re.S)
          else:
              s = s.replace('</head>', css + '\n</head>', 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit index.html only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo 'No index change needed.'
            exit 0
          fi
          git commit -m 'Fix index title and how-to numbers [skip header]'
          git fetch origin main
          git rebase origin/main
          git push
