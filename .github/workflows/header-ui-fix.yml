name: Fix YunaMyst header on PC and mobile

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-header:
    if: ${{ !contains(github.event.head_commit.message, '[skip header]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix Myst y overlap in index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          pattern = r'<div class="logo">.*?<small>SUMMONERS WAR</small></div>'
          replacement = '<div class="logo">YunaM<span class="myst-y">y</span>st<small>SUMMONERS WAR</small></div>'
          s, count = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Logo not found')
          s = re.sub(r'<style id="yunamyst-myst-y-final">.*?</style>\s*', '', s, flags=re.S)
          css = '''<style id="yunamyst-myst-y-final">
          .logo .myst-y{display:inline-block;font-size:.78em;line-height:1;vertical-align:baseline;position:relative;top:-.04em;margin-right:.02em}
          @media(max-width:850px){.logo .myst-y{font-size:.78em;top:-.04em}}
          </style>'''
          s = s.replace('</head>', css + '\n</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify
        shell: bash
        run: |
          grep -qF 'YunaM<span class="myst-y">y</span>st<small>SUMMONERS WAR</small></div>' index.html
          grep -qF '.logo .myst-y' index.html
          echo 'Header verified.'

      - name: Commit index.html
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix Myst y overlap [skip header]'
          git push
