name: Fix YunaMyst header on PC and mobile

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-header:
    if: ${{ !contains(github.event.head_commit.message, '[skip header]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply final YunaMyst spacing to index.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Keep the logo text exactly YunaMyst.
          s = re.sub(
              r'<div class="logo">.*?<small>SUMMONERS WAR</small></div>',
              '<div class="logo">YunaMyst<small>SUMMONERS WAR</small></div>',
              s, count=1, flags=re.S
          )

          # Move the subtitle down so the y descender never touches the W.
          marker = '<style id="yunamyst-final-subtitle-spacing">'
          if marker not in s:
              css = '''<style id="yunamyst-final-subtitle-spacing">
.logo small{margin-top:10px!important}
@media(max-width:850px){.logo small{margin-top:10px!important}}
</style>'''
              s = s.replace('</head>', css + '\n</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit index.html only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo 'No index change needed.'
            exit 0
          fi
          git commit -m 'Fix YunaMyst y overlap [skip header]'
          git fetch origin main
          git rebase origin/main
          git push
