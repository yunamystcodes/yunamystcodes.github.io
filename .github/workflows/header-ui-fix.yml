name: Fix YunaMyst header on PC and mobile

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-header:
    if: ${{ !contains(github.event.head_commit.message, '[skip header]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize YunaMyst branding on PC and mobile
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          # Remove the exact stray fragment reported in the upper-left corner.
          for bad in ('yst.\">', 'yst.\">', 'yst.\">', 'yst.\'>'):
              s = s.replace(bad, '')

          # Remove malformed standalone text if it occurs immediately after <body>.
          s = re.sub(r'(<body[^>]*>\s*)yst\.?["\'>]+\s*', r'\1', s, flags=re.I)

          # Normalize every common wrong capitalization to exactly YunaMyst.
          for bad in ('YunaMYst', 'YunaMYST', 'YunaMyST', 'YunaMySt', 'YunaMysT', 'YunaMYST'):
              s = s.replace(bad, 'YunaMyst')

          # Force the header logo itself to the exact spelling requested.
          s = re.sub(
              r'(<div class="logo">).*?(<small>SUMMONERS WAR</small></div>)',
              r'\1YunaM<span class="myst-y">y</span>st\2',
              s,
              count=1,
              flags=re.S,
          )

          # Fix any remaining uppercase y inside the Myst span.
          s = s.replace('<span class="myst-y">Y</span>', '<span class="myst-y">y</span>')
          s = s.replace('YunaM<span class="myst-y">Y</span>st', 'YunaM<span class="myst-y">y</span>st')

          # Remove any visible stray text node containing the reported fragment.
          marker_js = 'YUNAMYST REMOVE STRAY CORNER TEXT 20260828 V1'
          js = f'''\n<script id="yunamyst-remove-stray-corner-text">\n/* {marker_js} */\n(function(){{\n  function clean(){{\n    var root=document.body;\n    if(!root) return;\n    var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);\n    var nodes=[];\n    while(w.nextNode()) nodes.push(w.currentNode);\n    nodes.forEach(function(n){{\n      if(n.parentElement && /^(SCRIPT|STYLE)$/.test(n.parentElement.tagName)) return;\n      n.nodeValue=n.nodeValue.replace(/yst\\.\\\">/g,'').replace(/yst\\.\">/g,'');\n    }});\n  }}\n  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',clean); else clean();\n}})();\n</script>\n'''
          if marker_js not in s:
              s = s.replace('</body>', js + '</body>', 1)

          # Keep only the lowercase y in Myst smaller so it never overlaps the following letters.
          marker = 'YUNAMYST HEADER CLEAN WORKFLOW 20260828 V5'
          css = f'''\n<style id="yunamyst-header-clean-workflow">\n/* {marker} */\n.logo .myst-y {{\n  font-size: .76em !important;\n  display: inline-block !important;\n  line-height: 1 !important;\n  transform: translateY(.02em) !important;\n}}\n@media (max-width: 850px) {{\n  .logo .myst-y {{ font-size: .76em !important; }}\n}}\n</style>\n'''

          if marker not in s:
              s = s.replace('</head>', css + '</head>', 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify YunaMyst branding
        shell: bash
        run: |
          grep -nF 'YunaM<span class="myst-y">y</span>st' index.html
          if grep -nE 'YunaMYst|YunaMYST|YunaMyST|YunaMySt|YunaMysT|YunaMYST|<span class="myst-y">Y</span>' index.html; then
            echo 'Wrong YunaMyst capitalization still exists.'
            exit 1
          fi
          echo 'YunaMyst branding verified.'

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Normalize YunaMyst branding [skip header]"
          git push
