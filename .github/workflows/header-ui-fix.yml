name: Fix YunaMyst header on PC and mobile

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-header:
    if: ${{ !contains(github.event.head_commit.message, '[skip header]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set exact YunaMyst logo
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # The logo must be exactly YunaMyst on both desktop and mobile.
          s = re.sub(
              r'<div class="logo">.*?<small>SUMMONERS WAR</small></div>',
              '<div class="logo">YunaMyst<small>SUMMONERS WAR</small></div>',
              s, count=1, flags=re.S
          )

          # Remove all previous injected logo variants.
          s = s.replace('YunaM<span class="myst-y">y</span>st', 'YunaMyst')
          s = s.replace('YunaM<span class="myst-y">Y</span>st', 'YunaMyst')
          s = re.sub(r'YunaM\s*<span[^>]*>\s*[yY]\s*</span>\s*st', 'YunaMyst', s, flags=re.I)
          for bad in ('YunaMYst', 'YunaMYST', 'YunaMyST', 'YunaMySt', 'YunaMysT'):
              s = s.replace(bad, 'YunaMyst')

          # Remove old CSS that reduced/repositioned the lowercase y.
          s = re.sub(r'<style id="yunamyst-y-fix">.*?</style>', '', s, flags=re.S)
          s = re.sub(r'<style id="yunamyst-logo-fix-v3">.*?</style>', '', s, flags=re.S)
          s = re.sub(r'\.logo \.myst-y\{[^}]*\}', '', s)
          s = re.sub(r'@media\(max-width:850px\)\{\.logo \.myst-y\{[^}]*\}\}', '', s)

          # Metadata must also use the exact name.
          s = re.sub(r'(<meta name="description" content=")[^"]*(")', r'\1Códigos ativos de Summoners War — YunaMyst.\2', s, count=1)
          s = re.sub(r'<title>.*?</title>', '<title>YunaMyst — Summoners War</title>', s, count=1, flags=re.S)

          # Remove old CSS that reduced the y in Myst.
          s = re.sub(r'<style id="yunamyst-header-clean-workflow">.*?</style>', '', s, flags=re.S)
          s = re.sub(r'<style id="yunamyst-logo-normal-size">.*?</style>', '', s, flags=re.S)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify exact branding
        shell: bash
        run: |
          grep -qF '<div class="logo">YunaMyst<small>SUMMONERS WAR</small></div>' index.html
          if grep -nE 'YunaMYst|YunaMYST|YunaMyST|YunaMySt|YunaMysT|myst-y' index.html; then
            echo 'Incorrect/old YunaMyst logo markup remains.'
            exit 1
          fi
          echo 'Exact YunaMyst logo verified.'

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo 'No index changes needed.'
            exit 0
          fi
          git commit -m 'Fix exact YunaMyst logo on PC and mobile [skip header]'
          git push
