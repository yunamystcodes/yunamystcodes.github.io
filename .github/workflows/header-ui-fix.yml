name: Fix YunaMyst header on PC and mobile

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-header:
    if: ${{ !contains(github.event.head_commit.message, '[skip header]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix YunaMyst logo on PC and mobile
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          pattern = r'<div class="logo">.*?<small>SUMMONERS WAR</small></div>'
          replacement = '<div class="logo">YunaMyst<small>SUMMONERS WAR</small></div>'
          s, count = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Logo not found')
          s = re.sub(r'<style id="yunamyst-logo-fix-v3">.*?</style>\s*', '', s, flags=re.S)
          s = re.sub(r'<style id="yunamyst-myst-y-final">.*?</style>\s*', '', s, flags=re.S)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify
        shell: bash
        run: |
          grep -qF 'YunaMyst<small>SUMMONERS WAR</small></div>' index.html
          ! grep -qF 'class="myst-y"' index.html
          echo 'YunaMyst logo verified.'

      - name: Commit index.html
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix YunaMyst logo on PC and mobile [skip header]'
          git fetch origin main
          git rebase origin/main
          git push
