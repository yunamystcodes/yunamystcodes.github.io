name: Fix YunaMyst header on PC and mobile

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-header:
    if: ${{ !contains(github.event.head_commit.message, '[skip header]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix Myst y overlap in index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Normalize any previous logo markup first.
          s = re.sub(r'<div class="logo">.*?<small>SUMMONERS WAR</small></div>',
                     '<div class="logo">YunaMyst<small>SUMMONERS WAR</small></div>',
                     s, count=1, flags=re.S)

          # Remove old versions of this fix.
          s = re.sub(r'<style id="yunamyst-myst-y-final">.*?</style>\s*', '', s, flags=re.S)
          s = re.sub(r'<style id="yunamyst-y-fix">.*?</style>\s*', '', s, flags=re.S)
          s = re.sub(r'<style id="yunamyst-logo-fix-v3">.*?</style>\s*', '', s, flags=re.S)
          s = re.sub(r'<style id="yunamyst-header-clean-workflow">.*?</style>\s*', '', s, flags=re.S)
          s = re.sub(r'<style id="yunamyst-logo-normal-size">.*?</style>\s*', '', s, flags=re.S)

          # Make only the lowercase y in Myst smaller and slightly raised.
          s = s.replace('YunaMyst<small>SUMMONERS WAR</small></div>',
                        'YunaM<span class="myst-y">y</span>st<small>SUMMONERS WAR</small></div>', 1)

          logo_css = '''<style id="yunamyst-myst-y-final">
          .logo .myst-y{display:inline-block;font-size:.78em;line-height:1;vertical-align:baseline;position:relative;top:-.04em}
          @media(max-width:850px){.logo .myst-y{font-size:.78em;top:-.04em}}
          </style>'''
          s = s.replace('</head>', logo_css + '\n</head>', 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify index
        shell: bash
        run: |
          grep -qF 'YunaM<span class="myst-y">y</span>st<small>SUMMONERS WAR</small></div>' index.html
          grep -qF '.logo .myst-y' index.html
          echo 'Header fix verified for PC and mobile.'

      - name: Commit index fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo 'No index changes needed.'
            exit 0
          fi
          git commit -m 'Fix Myst y overlap on PC and mobile [skip header]'
          git push
