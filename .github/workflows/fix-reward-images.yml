name: Corrigir imagens e detalhes do index

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir apenas o logo YunaMyst no index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Corrige o texto do logo para YunaMyst (M + y minúsculo + st)
          s=s.replace('YunaM<span class="myst-y">y</span>st', 'YunaM<span class="myst-y">y</span>st')

          # Garante que o y fique menor e ligeiramente abaixo, sem subir sobre o M/W visualmente.
          css='''<style id="yunamyst-logo-fix-v3">\n.logo .myst-y{font-size:.58em!important;display:inline-block!important;line-height:1!important;vertical-align:baseline!important;position:relative!important;top:.08em!important;margin:0 -.015em!important}\n@media(max-width:850px){.logo .myst-y{font-size:.58em!important;top:.08em!important}}\n</style>'''
          s=re.sub(r'<style id="yunamyst-logo-fix-v3">.*?</style>','',s,flags=re.S)
          s=s.replace('</head>',css+'\n</head>',1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Publicar alteração no index
        run: |
          git config user.name 'YunaMyst Codes Bot'
          git config user.email 'actions@github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Corrigir logo YunaMyst no PC e telemóvel'
            git push
          else
            echo 'Index já está corrigido.'
          fi
