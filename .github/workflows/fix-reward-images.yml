name: Corrigir imagens e detalhes do index

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir logo, botoes, feedback e restaurar estrutura do index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          modal='''<div class="ym-feedback-modal" id="ym-feedback-modal" aria-hidden="true"><div class="ym-feedback-modal-card" role="dialog" aria-modal="true" aria-labelledby="ym-feedback-modal-title"><button class="ym-feedback-modal-close" id="ym-feedback-modal-close" type="button">×</button><h3 id="ym-feedback-modal-title">💜 TODOS OS FEEDBACKS</h3><div id="ym-feedback-list" class="ym-feedback-list"></div></div></div>'''
          # Remove qualquer modal antigo inteiro, incluindo os dois DIVs finais.
          s=re.sub(r'<div class="ym-feedback-modal" id="ym-feedback-modal"[^>]*>.*?</div>\s*</div>\s*','',s,flags=re.S)

          # Remove CSS antigo do modal e instala uma única versão segura no HEAD.
          s=re.sub(r'<style id="yunamyst-feedback-modal-fix-v2">.*?</style>\s*','',s,flags=re.S)
          s=re.sub(r'<style id="yunamyst-feedback-modal-final">.*?</style>\s*','',s,flags=re.S)
          modal_css='''<style id="yunamyst-feedback-modal-final">
          .ym-feedback-modal{display:none!important;position:fixed!important;inset:0!important;z-index:99999!important;align-items:center!important;justify-content:center!important;padding:18px!important;background:rgba(2,1,8,.84)!important;backdrop-filter:blur(7px)!important}
          .ym-feedback-modal.open{display:flex!important}
          .ym-feedback-modal-card{position:relative!important;width:min(620px,calc(100% - 20px))!important;max-height:min(78vh,620px)!important;overflow:auto!important;padding:24px 20px 18px!important;border:1px solid #be66ff!important;border-radius:18px!important;background:linear-gradient(180deg,#160a28f7,#070412f7)!important;box-shadow:0 25px 90px #000c!important;color:#fff!important}
          .ym-feedback-modal-card h3{margin:0 38px 15px 0!important;color:#f0c45c!important;font-size:17px!important;font-weight:900!important}
          .ym-feedback-modal-close{position:absolute!important;top:10px!important;right:10px!important;width:32px!important;height:32px!important;border:1px solid #fff4!important;border-radius:50%!important;background:#12091f!important;color:#fff!important;font-size:20px!important;cursor:pointer!important;display:grid!important;place-items:center!important}
          .ym-feedback-list{display:flex!important;flex-direction:column!important;gap:9px!important}
          .ym-feedback-empty{text-align:center!important;color:#aaa1b3!important;font-size:12px!important;padding:18px 8px!important}
          .ym-feedback-item{padding:12px!important;border:1px solid #be66ff40!important;border-radius:11px!important;background:#0a0518cc!important}
          .ym-feedback-item-head{display:flex!important;justify-content:space-between!important;gap:10px!important;font-size:12px!important;font-weight:800!important}
          .ym-feedback-item-name{color:#fff!important}.ym-feedback-item-stars{color:#f0c45c!important;white-space:nowrap!important}.ym-feedback-item-text{margin-top:7px!important;color:#c9c0d0!important;font-size:12px!important;line-height:1.5!important;white-space:pre-wrap!important;overflow-wrap:anywhere!important}
          @media(max-width:850px){.ym-feedback-modal{padding:10px!important}.ym-feedback-modal-card{width:calc(100% - 4px)!important;max-height:82vh!important;padding:20px 14px 15px!important}.ym-feedback-modal-card h3{font-size:15px!important}.ym-feedback-item-head,.ym-feedback-item-text{font-size:11px!important}}
          </style>'''
          s=s.replace('</head>',modal_css+'\n</head>',1)

          # Coloca o modal somente antes do fechamento do BODY.
          s=s.replace('</body>',modal+'\n</body>',1)

          # Remove correções duplicadas dos botões e instala a versão final.
          for ident in ['yunamyst-copy-buttons-final','yunamyst-copy-buttons-real-final','yunamyst-copy-buttons-fix','yunamyst-button-fix-final','yunamyst-button-layout-real-fix']:
              s=re.sub(r'<style id="'+re.escape(ident)+r'">.*?</style>\s*','',s,flags=re.S)
          button_css='''<style id="yunamyst-copy-buttons-real-final">
          @media(min-width:851px){.code{display:grid!important;grid-template-columns:52px minmax(120px,1fr) minmax(170px,1fr) 220px!important;gap:8px!important;align-items:center!important;min-width:0!important;overflow:hidden!important;box-sizing:border-box!important}.code-top{display:contents!important}.code-top>.gift{grid-column:1!important;min-width:0!important}.code-top>.cinfo{grid-column:2!important;min-width:0!important}.code>.rewards{grid-column:3!important;display:flex!important;align-items:center!important;justify-content:center!important;gap:8px!important;width:100%!important;min-width:0!important;overflow:hidden!important;padding:0!important}.code>.actions{grid-column:4!important;display:flex!important;gap:8px!important;width:100%!important;min-width:0!important}.code>.actions>.copy,.code>.actions>.link{position:static!important;transform:none!important;flex:1 1 0!important;width:50%!important;min-width:0!important;max-width:none!important;height:44px!important;padding:0 6px!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important;box-sizing:border-box!important}}
          @media(max-width:1050px) and (min-width:851px){.code{grid-template-columns:48px minmax(95px,1fr) minmax(125px,1fr) 190px!important;gap:6px!important}.code>.actions{gap:6px!important}}
          @media(max-width:850px){.code{display:flex!important;flex-direction:column!important;align-items:stretch!important;gap:9px!important;padding:12px 9px!important;width:100%!important;min-width:0!important;overflow:visible!important;box-sizing:border-box!important}.code-top{display:flex!important;align-items:center!important;gap:10px!important;width:100%!important;min-width:0!important}.code-top>.gift{width:44px!important;height:44px!important;flex:none!important}.code-top>.cinfo{flex:1!important;min-width:0!important}.code>.rewards{display:flex!important;flex-wrap:wrap!important;align-items:flex-start!important;justify-content:center!important;gap:7px!important;width:100%!important;min-width:0!important;overflow:visible!important;padding:3px 0!important}.code>.actions{display:flex!important;gap:8px!important;width:100%!important;min-width:0!important}.code>.actions>.copy,.code>.actions>.link{position:static!important;transform:none!important;flex:1 1 0!important;width:50%!important;min-width:0!important;max-width:none!important;height:46px!important;padding:0 6px!important;font-size:11px!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important;box-sizing:border-box!important}}
          </style>'''
          s=s.replace('</body>',button_css+'</body>',1)

          head_end=s.find('</head>'); body_start=s.find('<body',head_end); body_end=s.rfind('</body>')
          if head_end<0 or body_start<0 or body_end<body_start: raise SystemExit('ERRO: estrutura HTML inválida')
          if '<div class="ym-feedback-modal"' in s[:body_start]: raise SystemExit('ERRO: modal fora do body')
          if s.count('id="ym-feedback-modal"')!=1: raise SystemExit('ERRO: modal duplicado')
          if 'ym-feedback-modal-final' not in s: raise SystemExit('ERRO: CSS do modal ausente')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verificar index antes de publicar
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert '<body' in s and '</body>' in s and '</html>' in s
          assert s.count('id="ym-feedback-modal"') == 1
          assert '<div class="ym-feedback-modal"' not in s[:s.find('<body')]
          assert 'ym-feedback-modal-final' in s
          print('OK: index íntegro e modal de feedback corretamente dentro do body.')
          PY
      - name: Publicar correção
        run: |
          git config user.name 'YunaMyst Codes Bot'
          git config user.email 'actions@github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Corrigir definitivamente layout e modal de feedback'
            git push
          else
            echo 'Index já está corrigido.'
          fi
