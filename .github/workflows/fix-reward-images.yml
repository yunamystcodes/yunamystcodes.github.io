name: Corrigir imagens e detalhes do index

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir logo e layout dos botoes no index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          logo_css='''<style id="yunamyst-logo-fix-v3">\n.logo .myst-y{font-size:.58em!important;display:inline-block!important;line-height:1!important;vertical-align:baseline!important;position:relative!important;top:.08em!important;margin:0 -.015em!important}\n@media(max-width:850px){.logo .myst-y{font-size:.58em!important;top:.08em!important}}\n</style>'''
          s=re.sub(r'<style id="yunamyst-logo-fix-v3">.*?</style>','',s,flags=re.S)
          s=s.replace('</head>',logo_css+'\n</head>',1)

          # Remove all previous button-fix blocks so only this final, wrapper-aware layout remains.
          for ident in [
              'yunamyst-copy-buttons-final',
              'yunamyst-copy-buttons-real-final',
              'yunamyst-copy-buttons-fix',
              'yunamyst-button-fix-final',
              'yunamyst-button-layout-real-fix'
          ]:
              s=re.sub(r'<style id="'+re.escape(ident)+r'">.*?</style>\s*','',s,flags=re.S)

          button_css='''<style id="yunamyst-copy-buttons-real-final">\n@media(min-width:851px){\n.code{display:grid!important;grid-template-columns:52px minmax(120px,1fr) minmax(170px,1fr) 220px!important;gap:8px!important;align-items:center!important;min-width:0!important;overflow:hidden!important;box-sizing:border-box!important}\n.code-top{display:contents!important}\n.code-top>.gift{grid-column:1!important;min-width:0!important}\n.code-top>.cinfo{grid-column:2!important;min-width:0!important}\n.code>.rewards{grid-column:3!important;display:flex!important;align-items:center!important;justify-content:center!important;gap:8px!important;width:100%!important;min-width:0!important;overflow:hidden!important;padding:0!important}\n.code>.actions{grid-column:4!important;display:flex!important;gap:8px!important;width:100%!important;min-width:0!important}\n.code>.actions>.copy,.code>.actions>.link{position:static!important;transform:none!important;flex:1 1 0!important;width:50%!important;min-width:0!important;max-width:none!important;height:44px!important;padding:0 6px!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important;box-sizing:border-box!important}\n}\n@media(max-width:1050px) and (min-width:851px){.code{grid-template-columns:48px minmax(95px,1fr) minmax(125px,1fr) 190px!important;gap:6px!important}.code>.actions{gap:6px!important}}\n@media(max-width:850px){\n.code{display:flex!important;flex-direction:column!important;align-items:stretch!important;gap:9px!important;padding:12px 9px!important;width:100%!important;min-width:0!important;overflow:visible!important;box-sizing:border-box!important}\n.code-top{display:flex!important;align-items:center!important;gap:10px!important;width:100%!important;min-width:0!important}\n.code-top>.gift{width:44px!important;height:44px!important;flex:none!important}\n.code-top>.cinfo{flex:1!important;min-width:0!important}\n.code>.rewards{display:flex!important;flex-wrap:wrap!important;align-items:flex-start!important;justify-content:center!important;gap:7px!important;width:100%!important;min-width:0!important;overflow:visible!important;padding:3px 0!important}\n.code>.actions{display:flex!important;gap:8px!important;width:100%!important;min-width:0!important}\n.code>.actions>.copy,.code>.actions>.link{position:static!important;transform:none!important;flex:1 1 0!important;width:50%!important;min-width:0!important;max-width:none!important;height:46px!important;padding:0 6px!important;font-size:11px!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important;box-sizing:border-box!important}\n}\n</style>'''
          s=s.replace('</body>',button_css+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Publicar alteração no index
        run: |
          git config user.name 'YunaMyst Codes Bot'
          git config user.email 'actions@github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Corrigir logo e botoes COPIAR LINK iOS no PC e telemovel'
            git push
          else
            echo 'Index já está corrigido.'
          fi
