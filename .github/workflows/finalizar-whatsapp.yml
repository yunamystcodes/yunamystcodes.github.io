name: Finalizar correção do WhatsApp

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalizar:
    if: "!contains(github.event.head_commit.message, '[whatsapp-final]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir texto sem remover o ícone
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("wa:['💬 WHATSAPP','Enter the group directly']","wa:['WHATSAPP','Enter the group directly']",1)
          s=s.replace("wa.querySelector('#whatsappLabel').textContent=d.wa[0];wa.querySelector('.community-tab > span')?.replaceChildren(document.createTextNode(d.wa[1]));","wa.querySelector('strong').lastChild.nodeValue=' '+d.wa[0];wa.querySelector('.community-tab > span')?.replaceChildren(document.createTextNode(d.wa[1]));",1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commitar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Finalizar correção do WhatsApp [whatsapp-final]"
          git push
      - name: Remover workflow temporário
        run: |
          git rm .github/workflows/finalizar-whatsapp.yml
          git commit -m "Remover workflow temporário [whatsapp-final]"
          git push