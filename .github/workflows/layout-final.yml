name: Ajustar layout final YunaMyst

on:
  push:
    paths-ignore:
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  layout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aplicar layout responsivo
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove os contadores das abas.
          s = re.sub(r'\s*<span class="tab-count"[^>]*>[^<]*</span>', '', s)

          # Coloca o WhatsApp e a Parceria imediatamente abaixo do título SUMMONERS WAR.
          start = s.find('<!-- YUNA-TOP-COMUNIDADE-V1 -->')
          hero = s.find('<section class="hero', start if start >= 0 else 0)
          main = s.find('<main class="container layout">')
          if start >= 0 and hero >= 0 and main >= 0:
              community = '''<div class="community-links" id="comunidade">
                <a class="community-tab whatsapp" href="https://chat.whatsapp.com/KWg53GNpXDA3G5lDT8VwOg" target="_blank" rel="noopener noreferrer">
                  <strong>💬 WHATSAPP</strong><span>ENTRA NO GRUPO DO WHATSAPP!</span><i>›</i>
                </a>
                <button class="community-tab partnership" type="button" onclick="toggleParceria()">
                  <strong>🤝 PARCERIA</strong><span>Colabora com o YunaMyst Codes</span><i>›</i>
                </button>
                <div class="partnership-panel" id="parceriaPanel">
                  <strong>🤝 PARCERIA YUNAMYST</strong><br>
                  Queres fazer parceria com o YunaMyst? Este espaço fica reservado para futuras divulgações e colaborações.
                </div>
              </div>\n'''
              s = s[:start] + s[hero:main] + community + s[main:]

          css = '''
          <style id="yuna-final-community-responsive">
          .hero{padding-bottom:8px!important}
          .hero h1{margin-bottom:0!important}
          .community-links{width:min(760px,calc(100% - 28px));margin:0 auto 18px;display:grid;grid-template-columns:1fr 1fr;gap:10px;background:transparent!important;border:0!important;padding:0!important}
          .community-tab{min-height:58px;padding:10px 16px;border-radius:12px;background:linear-gradient(100deg,rgba(13,7,28,.96),rgba(8,5,18,.96));display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff;cursor:pointer;font-family:Arial,Helvetica,sans-serif;box-shadow:0 8px 20px rgba(0,0,0,.22)}
          .community-tab strong{font-size:14px;font-weight:900;white-space:nowrap}
          .community-tab span{margin-left:auto;color:#cfc6d8;font-size:11px;font-weight:700;text-align:right}
          .community-tab i{font-style:normal;font-size:20px;color:#d7c8e8;margin-left:3px}
          .community-tab.whatsapp{border:1px solid #20c968}
          .community-tab.whatsapp strong{color:#fff}
          .community-tab.whatsapp strong:first-letter{color:#20c968}
          .community-tab.partnership{border:1px solid #d8a52f}
          .community-tab.partnership strong{color:#fff}
          .partnership-panel{display:none;grid-column:1/-1;border:1px solid #d8a52f;border-radius:12px;padding:14px 16px;background:rgba(9,5,20,.96);color:#cfc6d8;font-size:12px;line-height:1.5}
          .partnership-panel.open{display:block}
          @media(max-width:850px){
            .hero{padding:18px 0 8px!important}
            .hero h1{font-size:43px!important;line-height:1.05!important}
            .community-links{width:calc(100% - 18px);margin:0 auto 12px;grid-template-columns:1fr;gap:7px}
            .community-tab{min-height:48px;padding:8px 12px;border-radius:10px}
            .community-tab strong{font-size:12px}
            .community-tab span{font-size:9px}
            .community-tab i{font-size:17px}
          }
          </style>
          '''
          s = s.replace('</head>', css + '\n</head>', 1)

          js = '''
          <script id="yuna-final-community-js">
          function toggleParceria(){
            const p=document.getElementById('parceriaPanel');
            if(p) p.classList.toggle('open');
          }
          </script>
          '''
          s = s.replace('</body>', js + '\n</body>', 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
          else
            git commit -m "Ajustar WhatsApp e parceria abaixo do titulo responsivo"
            git push
          fi
