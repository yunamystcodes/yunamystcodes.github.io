name: Verificar feedback centralizado

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-feedback:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar integração Supabase
        shell: bash
        run: |
          set -euo pipefail
          grep -qF 'https://uxwbbaeupemihonwyszu.supabase.co/functions/v1/feedbacks' index.html
          grep -qF 'id="ym-feedback-global-clean-js"' index.html
          grep -qF 'id="ym-feedback-modal"' index.html
          ! grep -qF 'yunamyst_feedbacks_v2' index.html
          echo 'OK: feedbacks usam Supabase e o script global atual.'
