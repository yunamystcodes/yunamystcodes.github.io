name: Remover feedback final

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  remove:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remover todo o feedback do index
        shell: python
        run: |
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          def remove_balanced_div(html, start):
              token=re.compile(r'<(/?)div\b[^>]*>', re.I)
              depth=0
              for m in token.finditer(html,start):
                  if m.group(1):
                      depth-=1
                      if depth==0:
                          return html[:start]+html[m.end():]
                  else:
                      depth+=1
              return html

          # Remove every feedback-section-new block, including duplicated copies.
          while True:
              m=re.search(r'<div\b[^>]*class=["\'][^"\']*\bfeedback-section-new\b[^"\']*["\'][^>]*>',s,re.I|re.S)
              if not m: break
              new=remove_balanced_div(s,m.start())
              if new==s: break
              s=new

          # Remove the old dynamically generated redesign if it is still in index.html.
          while True:
              m=re.search(r'<section\b[^>]*id=["\']ym-feedback-redesign["\'][^>]*>',s,re.I|re.S)
              if not m: break
              token=re.compile(r'<(/?)section\b[^>]*>',re.I)
              depth=0; end=None
              for x in token.finditer(s,m.start()):
                  if x.group(1):
                      depth-=1
                      if depth==0:
                          end=x.end(); break
                  else: depth+=1
              if end is None: break
              s=s[:m.start()]+s[end:]

          # Remove feedback-specific styles and scripts, including duplicates.
          s=re.sub(r'\s*<style\b[^>]*id=["\']yunamyst-feedback-position-fix["\'][^>]*>[\s\S]*?</style>\s*','\n',s,flags=re.I)
          s=re.sub(r'\s*<script\b[^>]*id=["\']yunamyst-feedback-position-js["\'][^>]*>[\s\S]*?</script>\s*','\n',s,flags=re.I)
          s=re.sub(r'\s*<style\b[^>]*id=["\']ym-feedback-redesign-css["\'][^>]*>[\s\S]*?</style>\s*','\n',s,flags=re.I)

          p.write_text(s,encoding='utf-8')

      - name: Publicar e apagar este workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/remove-feedback-final.yml
          git commit -m 'Remover feedback do site definitivamente [skip ci]'
          git push
