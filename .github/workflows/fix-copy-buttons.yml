name: Fix copy and iOS buttons FINAL

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-buttons:
    if: ${{ !contains(github.event.head_commit.message, '[skip copy-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add reliable language switch to index
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./language-fix.js?v=20260901"></script>'
          if 'language-fix.js' not in s:
              if '</body>' not in s: raise SystemExit('body not found')
              s=s.replace('</body>',tag+'\n</body>',1)
              p.write_text(s,encoding='utf-8')
      - name: Fix button layout in index
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='''
          <style id="yunamyst-copy-buttons-real-final">
          @media(min-width:851px){.code{display:grid!important;grid-template-columns:52px minmax(120px,1fr) minmax(170px,1fr) 220px!important;gap:8px!important;align-items:center!important;min-width:0!important;overflow:hidden!important;box-sizing:border-box!important}.code-top{display:contents!important}.code-top>.gift{grid-column:1!important}.code-top>.cinfo{grid-column:2!important}.code>.rewards{grid-column:3!important;display:flex!important;align-items:center!important;justify-content:center!important;gap:8px!important;width:100%!important;min-width:0!important;overflow:hidden!important}.code>.actions{grid-column:4!important;display:flex!important;gap:8px!important;width:100%!important;min-width:0!important}.code>.actions>.copy,.code>.actions>.link{position:static!important;transform:none!important;flex:1 1 0!important;width:50%!important;min-width:0!important;height:44px!important;padding:0 6px!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important;box-sizing:border-box!important}}
          @media(max-width:850px){.code{display:flex!important;flex-direction:column!important;align-items:stretch!important;gap:9px!important;padding:12px 9px!important;width:100%!important;min-width:0!important;overflow:visible!important;box-sizing:border-box!important}.code-top{display:flex!important;align-items:center!important;gap:10px!important;width:100%!important}.code-top>.gift{width:44px!important;height:44px!important;flex:none!important}.code-top>.cinfo{flex:1!important;min-width:0!important}.code>.rewards{display:flex!important;flex-wrap:wrap!important;align-items:flex-start!important;justify-content:center!important;gap:7px!important;width:100%!important;overflow:visible!important;padding:3px 0!important}.code>.actions{display:flex!important;gap:8px!important;width:100%!important}.code>.actions>.copy,.code>.actions>.link{position:static!important;transform:none!important;flex:1 1 0!important;width:50%!important;min-width:0!important;height:46px!important;padding:0 6px!important;font-size:11px!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important;box-sizing:border-box!important}}
          </style>'''
          s=re.sub(r'<style id="yunamyst-copy-buttons-real-final">.*?</style>\s*','',s,flags=re.S)
          if '</body>' not in s: raise SystemExit('index.html body not found')
          s=s.replace('</body>',css+'</body>',1)
          p.write_text(s,encoding='utf-8')
      - name: Publish safely
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Apply language and code card fixes [skip copy-fix]"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; git reset --hard origin/main; }
          done
          exit 1
