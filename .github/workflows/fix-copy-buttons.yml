name: Fix copy and iOS buttons

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-buttons:
    if: ${{ !contains(github.event.head_commit.message, '[skip copy-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix button layout in index
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='''
          <style id="yunamyst-copy-buttons-final">
          .code{grid-template-columns:52px minmax(110px,1fr) repeat(3,48px) 110px 110px!important;gap:7px!important;}
          .code>.copy{grid-column:6!important;grid-row:1!important;width:110px!important;min-width:110px!important;white-space:nowrap!important;}
          .code>.link{grid-column:7!important;grid-row:1!important;width:110px!important;min-width:110px!important;white-space:nowrap!important;}
          @media(max-width:1050px) and (min-width:851px){
            .code{grid-template-columns:48px minmax(90px,1fr) repeat(3,44px) 100px 100px!important;gap:6px!important;}
            .code>.copy{width:100px!important;min-width:100px!important}
            .code>.link{width:100px!important;min-width:100px!important}
          }
          @media(max-width:850px){
            .code{grid-template-columns:44px minmax(0,1fr) minmax(0,1fr) minmax(0,1fr)!important;grid-template-rows:56px 62px 44px!important;grid-template-areas:'gift info info info' 'gift r1 r2 r3' 'copy copy link link'!important;gap:7px!important;}
            .code>.copy{grid-area:copy!important;grid-column:auto!important;grid-row:auto!important;width:100%!important;min-width:0!important;}
            .code>.link{grid-area:link!important;grid-column:auto!important;grid-row:auto!important;width:100%!important;min-width:0!important;}
          }
          </style>'''
          s=re.sub(r'<style id="yunamyst-copy-buttons-final">.*?</style>\s*','',s,flags=re.S)
          s=re.sub(r'<style id="yunamyst-copy-buttons-fix">.*?</style>\s*','',s,flags=re.S)
          s=s.replace('</body>',css+'</body>',1)
          p.write_text(s,encoding='utf-8')
      - name: Publish
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix copy and iOS buttons [skip copy-fix]"
          git push
