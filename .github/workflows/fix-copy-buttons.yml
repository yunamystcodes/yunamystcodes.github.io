name: Fix copy and iOS buttons

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-buttons:
    if: ${{ !contains(github.event.head_commit.message, '[skip copy-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix button layout in index
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='''
          <style id="yunamyst-copy-buttons-final">
          .code{position:relative!important;padding-right:242px!important;}
          .code>.copy{position:absolute!important;right:128px!important;top:50%!important;transform:translateY(-50%)!important;width:110px!important;min-width:110px!important;height:44px!important;white-space:nowrap!important;}
          .code>.link{position:absolute!important;right:10px!important;top:50%!important;transform:translateY(-50%)!important;width:110px!important;min-width:110px!important;height:44px!important;white-space:nowrap!important;}
          @media(max-width:1050px) and (min-width:851px){
            .code{padding-right:216px!important;}
            .code>.copy{right:112px!important;width:100px!important;min-width:100px!important;}
            .code>.link{right:8px!important;width:100px!important;min-width:100px!important;}
          }
          @media(max-width:850px){
            .code{position:relative!important;padding-right:8px!important;grid-template-columns:44px minmax(0,1fr) minmax(0,1fr) minmax(0,1fr)!important;grid-template-rows:56px 62px 44px!important;grid-template-areas:'gift info info info' 'gift r1 r2 r3' 'copy copy link link'!important;gap:7px!important;}
            .code>.copy{position:static!important;grid-area:copy!important;transform:none!important;width:100%!important;min-width:0!important;height:44px!important;}
            .code>.link{position:static!important;grid-area:link!important;transform:none!important;width:100%!important;min-width:0!important;height:44px!important;}
          }
          </style>'''
          s=re.sub(r'<style id="yunamyst-copy-buttons-final">.*?</style>\s*','',s,flags=re.S)
          s=re.sub(r'<style id="yunamyst-copy-buttons-fix">.*?</style>\s*','',s,flags=re.S)
          s=s.replace('</body>',css+'</body>',1)
          p.write_text(s,encoding='utf-8')
      - name: Publish
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix copy and iOS buttons [skip copy-fix]"
          git push
