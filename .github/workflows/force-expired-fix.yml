name: Force expired toggle fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[expired-toggle-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject robust toggle
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='YUNA_EXPIRED_TOGGLE_ROBUST_2026_08_17'
          if marker in s:
              print('Already patched')
              raise SystemExit(0)
          patch=r'''<!-- YUNA_EXPIRED_TOGGLE_ROBUST_2026_08_17 -->
<style>.yuna-expired-hidden{display:none!important}</style>
<script>
(function(){
 function n(s){return(s||'').replace(/\s+/g,' ').trim().toUpperCase()}
 function find(){
  var els=document.querySelectorAll('h1,h2,h3,h4,h5,h6,button,summary,div,span,a');
  for(var i=0;i<els.length;i++)if(n(els[i].textContent).indexOf('CÓDIGOS EXPIRADOS')>=0)return els[i];
 }
 function cards(head){
  var p=head, best=null;
  for(var k=0;p&&p!==document.body&&k<10;k++,p=p.parentElement){
   var hits=[].filter.call(p.querySelectorAll('*'),function(x){return n(x.textContent).indexOf('CÓDIGO EXPIRADO')>=0&&x.children.length<6});
   if(hits.length>=2){best=p;break}
  }
  if(!best)return[];
  var out=[], all=best.querySelectorAll('*');
  for(var i=0;i<all.length;i++){
   var e=all[i]; if(e===head||head.contains(e))continue;
   if(n(e.textContent).indexOf('CÓDIGO EXPIRADO')<0)continue;
   var child=false; for(var j=0;j<e.children.length;j++)if(n(e.children[j].textContent).indexOf('CÓDIGO EXPIRADO')>=0){child=true;break}
   if(child)continue;
   var c=e;
   for(var z=0;z<8&&c.parentElement&&c.parentElement!==best;z++){var cl=n(c.className);if(/CODE|CARD|ITEM|ROW|EXPIRED|COUPON/.test(cl))break;c=c.parentElement}
   if(c!==best&&out.indexOf(c)<0)out.push(c)
  }
  return out
 }
 function setup(){
  var h=find(); if(!h)return false;
  var cs=cards(h); if(!cs.length)return false;
  if(h.dataset.yunaRobustToggle==='1')return true;
  h.dataset.yunaRobustToggle='1';h.style.cursor='pointer';h.setAttribute('role','button');h.setAttribute('aria-expanded','true');
  h.addEventListener('click',function(e){
   if(e.target.closest('a,button')&&e.target!==h)return;
   var closed=h.dataset.yunaClosed==='1';
   cards(h).forEach(function(c){c.classList.toggle('yuna-expired-hidden',!closed)});
   h.dataset.yunaClosed=closed?'0':'1';h.setAttribute('aria-expanded',closed?'true':'false');
  });
  return true
 }
 function start(){if(setup())return;var o=new MutationObserver(function(){if(setup())o.disconnect()});o.observe(document.documentElement,{childList:true,subtree:true});setTimeout(function(){try{o.disconnect()}catch(e){}setup()},20000)}
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start()
})();
</script>
'''
          s=s.replace('</body>',patch+'\n</body>') if '</body>' in s else s+'\n'+patch
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Apply expired codes toggle fix [expired-toggle-fix]'
          git push
