name: Fix partnership modal
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'Fix parceria modal'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove partnership ratings and contact block
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          rating='<div class="feedback-summary" id="feedbackSummaryNew">0.0 / 5 • 0 avaliações</div>\n  <div class="feedback-list" id="feedbackListNew"><div class="feedback-message" style="text-align:center">Ainda não há avaliações de players.</div></div>'
          s=s.replace(rating,'')
          contact='<div class="contact-mail"><a href="https://formspree.io/f/mdenpbql" aria-label="Entrar em contato por email"><span class="contact-icon">✉</span><span><strong id="contatoTitulo">Entrar em contato</strong><small id="contatoTexto">Envia-nos uma mensagem por email.</small></span></a></div>'
          s=s.replace(contact,'')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || (git commit -m 'Fix parceria modal' && git push)
          # trigger fix
