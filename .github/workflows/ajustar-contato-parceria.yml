name: Ajustar parceria e contato
on:
  push:
    paths:
      - '.github/workflows/ajustar-contato-parceria.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Atualizar index
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('content="2026-08-20-modal-parceria"', 'content="2026-08-20-contato-parceria"')
          s = s.replace('Queres fazer parceria com o YunaMyst?', 'Queres fazer parceria com a YunaMyst?')
          old = '<p>Queres fazer parceria com a YunaMyst? Este espaço fica reservado para futuras divulgações e colaborações.</p>'
          new = '''<p>Queres fazer parceria com a YunaMyst? Este espaço fica reservado para futuras divulgações e colaborações.</p><div class="contact-mail"><a href="mailto:solange.hannah90@gmail.com" aria-label="Entrar em contato por email"><span class="contact-icon">✉</span><span><strong>Entrar em contato</strong><small>Envia-nos uma mensagem por email.</small></span></a></div>'''
          if old in s and 'class="contact-mail"' not in s:
              s = s.replace(old, new, 1)
          css = '.contact-mail{margin-top:18px;padding-top:16px;border-top:1px solid rgba(255,255,255,.1)}.contact-mail a{display:flex;align-items:center;justify-content:center;gap:12px;color:#fff;text-decoration:none}.contact-icon{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#7d39c8,#1d0b35);border:1px solid #e1a0ff;color:#f0c45c;font-size:27px}.contact-mail strong{display:block;color:#f0c45c;font-size:15px}.contact-mail small{display:block;color:#c9c0d0;font-size:11px;margin-top:3px}.contact-mail a:hover .contact-icon{box-shadow:0 0 18px rgba(190,90,255,.35);transform:translateY(-1px)}'
          s = s.replace('</style>', css + '</style>', 1) if '.contact-mail{' not in s else s
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commitar alteração e remover workflow temporário
        run: |
          git config user.name 'yunamystcodes'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/ajustar-contato-parceria.yml
          git add index.html .github/workflows/ajustar-contato-parceria.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Atualizar parceria e adicionar contato por email'
          git push