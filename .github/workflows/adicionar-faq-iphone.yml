name: Corrigir FAQ e layout

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corrigir:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Corrigir FAQ no index
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          faq = '''<div class="panel faq"><h2>❔ FAQ</h2><div class="faq-item"><div class="faq-q">Onde coloco os códigos?<span>＋</span></div><div class="faq-a">Copia o código e usa o link de resgate.</div></div><div class="faq-item"><div class="faq-q">Os códigos expiram?<span>＋</span></div><div class="faq-a">Sim. Quando expiram, passam para a aba de códigos expirados.</div></div><div class="faq-item"><div class="faq-q">Posso usar no iPhone?<span>＋</span></div><div class="faq-a">Sim. O site funciona normalmente no telemóvel.</div></div></div>'''

          # Substitui o painel FAQ inteiro por uma única versão, eliminando duplicados.
          s, n = re.subn(r'<div class="panel faq">.*?</div></aside>', faq + '</aside>', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Painel FAQ não encontrado')

          css = '''\n<style id="yunamyst-faq-final-layout">\n/* FAQ FINAL — uma coluna, igual no PC e no telemóvel */\n.faq{width:100%!important;display:block!important;overflow:hidden!important}\n.faq h2{width:100%!important}\n.faq .faq-item{display:block!important;width:100%!important;grid-column:1/-1!important;float:none!important;margin:0!important;border:0!important}\n.faq .faq-q{display:flex!important;width:100%!important;align-items:center!important;justify-content:space-between!important;padding:15px!important;min-height:52px!important}\n.faq .faq-a{width:100%!important}\n@media(max-width:850px){.right .faq{width:100%!important}.faq .faq-item{width:100%!important}.faq .faq-q{font-size:13px!important;padding:15px 14px!important}}\n</style>\n'''
          if 'yunamyst-faq-final-layout' not in s:
              s = s.replace('</head>', css + '</head>', 1)

          s = s.replace('<meta name="build-version" content="reward-images-layout-fixed-20260830-v2">', '<meta name="build-version" content="faq-final-layout-20260902-v1">', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Corrigir FAQ duplicado no PC e telemóvel"
          git push
