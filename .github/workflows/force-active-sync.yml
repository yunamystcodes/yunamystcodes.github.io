name: Forcar sincronizacao dos codigos ativos

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yunamyst-codes-force-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sincronizar códigos com todas as fontes
        run: python3 scripts/update_codes_safe.py

      - name: Validar dados publicados
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('codes.json',encoding='utf-8'))
          codes=d.get('codes',[])
          if len(codes) != len(set(codes)):
              raise SystemExit('ERRO: existem códigos duplicados')
          if not codes:
              raise SystemExit('ERRO: lista vazia')
          print(f'OK: {len(codes)} códigos ativos.')
          PY

      - name: Guardar sincronização
        run: |
          git config user.name 'YunaMyst Codes Bot'
          git config user.email 'actions@github.com'
          git add codes.json codes-history.json
          if ! git diff --cached --quiet; then
            git commit -m 'Forcar sincronizacao dos codigos ativos'
            git push
          else
            echo 'Nenhuma alteração necessária.'
          fi
