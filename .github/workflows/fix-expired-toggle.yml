name: Fix expired codes toggle

on:
  push:
    paths:
      - '.github/workflows/fix-expired-toggle.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch index
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'YUNA_EXPIRED_TOGGLE_FINAL_2026_08_18'
          if marker in s:
              print('Final expired toggle already present')
              raise SystemExit(0)

          patch = r'''<!-- YUNA_EXPIRED_TOGGLE_FINAL_2026_08_18 -->
<style>
.yuna-expired-collapsed > *:not(.yuna-expired-header){display:none!important}
</style>
<script>
(function(){
  function norm(s){return (s||'').replace(/\s+/g,' ').trim();}
  function isExpiredHeading(el){
    if(!el || el===document.body) return false;
    return /^CÓDIGOS EXPIRADOS(?:\s*\(\d+\))?$/i.test(norm(el.textContent));
  }
  function headingFromTarget(target){
    var el=target;
    while(el && el!==document.body){
      if(isExpiredHeading(el)) return el;
      el=el.parentElement;
    }
    return null;
  }
  function install(){
    if(document.documentElement.dataset.yunaExpiredFinal==='1') return;
    document.documentElement.dataset.yunaExpiredFinal='1';
    document.addEventListener('click',function(ev){
      var heading=headingFromTarget(ev.target);
      if(!heading) return;
      ev.preventDefault();
      ev.stopPropagation();
      var box=heading.parentElement;
      if(!box) return;
      heading.classList.add('yuna-expired-header');
      var collapsed=box.classList.toggle('yuna-expired-collapsed');
      heading.setAttribute('role','button');
      heading.setAttribute('aria-expanded',collapsed?'false':'true');
    },true);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',install); else install();
})();
</script>
'''
          if '</body>' in s:
              s=s.replace('</body>', patch + '\n</body>')
          else:
              s += '\n' + patch
          p.write_text(s,encoding='utf-8')

      - name: Commit index fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No index changes needed'
            exit 0
          fi
          git commit -m 'Fix expired codes toggle on PC and mobile'
          git push
