name: Fix expired codes toggle

on:
  push:
    paths:
      - '.github/workflows/fix-expired-toggle.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch expired section toggle
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'YUNA_EXPIRED_TOGGLE_FIX_2026_08_17'
          if marker in s:
              print('Patch already present')
              raise SystemExit(0)

          patch = r'''\n<!-- YUNA_EXPIRED_TOGGLE_FIX_2026_08_17 -->\n<script>\n(function(){\n  function installExpiredToggle(){\n    var nodes=document.querySelectorAll('h1,h2,h3,h4,h5,h6,button,summary,div,span,a');\n    nodes.forEach(function(title){\n      if(title.dataset.yunaExpiredToggle==='1') return;\n      var text=(title.textContent||'').replace(/\\s+/g,' ').trim().toUpperCase();\n      if(text.indexOf('CÓDIGOS EXPIRADOS')===-1) return;\n\n      var panel=title.closest('.panel') || title.parentElement;\n      if(!panel) return;\n      var list=panel.querySelector('.codes');\n      if(!list) list=panel.querySelector('[class*="expired"], [id*="expired"]');\n      if(!list) return;\n\n      title.dataset.yunaExpiredToggle='1';\n      title.style.cursor='pointer';\n      title.setAttribute('role','button');\n      title.setAttribute('aria-expanded','true');\n\n      title.addEventListener('click',function(e){\n        if(e.target.closest('a,button') && e.target!==title) return;\n        var closed=list.dataset.yunaClosed==='1';\n        list.dataset.yunaClosed=closed?'0':'1';\n        list.style.setProperty('display',closed?'flex':'none','important');\n        title.setAttribute('aria-expanded',closed?'true':'false');\n        var arrow=title.querySelector('.yuna-expired-arrow');\n        if(arrow) arrow.textContent=closed?'⌃':'⌄';\n      });\n\n      var arrow=document.createElement('span');\n      arrow.className='yuna-expired-arrow';\n      arrow.textContent='⌃';\n      arrow.style.marginLeft='8px';\n      arrow.style.fontWeight='900';\n      title.appendChild(arrow);\n    });\n  }\n  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',installExpiredToggle);\n  else installExpiredToggle();\n  new MutationObserver(installExpiredToggle).observe(document.body,{childList:true,subtree:true});\n})();\n</script>\n'''

          s = s.replace('</body>', patch + '</body>') if '</body>' in s else s + patch
          p.write_text(s, encoding='utf-8')

      - name: Commit patched index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix expired codes collapse toggle'
          git push
