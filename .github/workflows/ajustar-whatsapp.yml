name: Ajustar ícone do WhatsApp

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  ajustar:
    if: "!contains(github.event.head_commit.message, '[whatsapp-icon]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Substituir símbolo do WhatsApp no index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<strong>💬 WHATSAPP</strong>'
          new = '''<strong><svg class="whatsapp-icon" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="#25D366"/><path fill="#fff" d="M23.2 8.7A10.1 10.1 0 0 0 7.7 20.9L6.4 25.6l4.8-1.3A10.1 10.1 0 1 0 23.2 8.7Zm-7.1 15.2a8.4 8.4 0 0 1-4.3-1.2l-.3-.2-2.8.8.8-2.7-.2-.3a8.4 8.4 0 1 1 6.8 3.6Zm4.6-6.3c-.3-.2-1.7-.8-2-.9-.3-.1-.5-.2-.7.2-.2.3-.7.9-.8 1.1-.2.2-.3.2-.6.1-1.6-.8-2.6-1.4-3.6-3.1-.3-.5.3-.5.8-1.6.1-.2.1-.4 0-.6-.1-.2-.7-1.6-.9-2.2-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.6.1-.9.4-.3.3-1.1 1.1-1.1 2.7s1.1 3.1 1.3 3.3c.2.2 2.1 3.3 5.1 4.6 1.9.8 2.7.9 3.6.8.6-.1 1.7-.7 2-1.4.2-.7.2-1.3.2-1.4-.1-.2-.3-.3-.6-.4Z"/></svg> WHATSAPP</strong>'''
          css = '.whatsapp-icon{width:18px;height:18px;display:inline-block;vertical-align:-4px;margin-right:4px;flex:none}'
          if old in s:
              s = s.replace(old, new, 1)
          if '.whatsapp-icon{' not in s:
              s = s.replace('</style>', css + '</style>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commitar alteração no index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Atualizar ícone do WhatsApp no index [whatsapp-icon]"
          git push

      - name: Remover workflow temporário
        run: |
          git rm .github/workflows/ajustar-whatsapp.yml
          git commit -m "Remover ajuste temporário do WhatsApp [whatsapp-icon]"
          git push
