name: Remover bloco de feedback do site
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  remove-feedback:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remover todo o feedback visivel
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          patterns = [
              r'\s*<div class="feedback-section" id="feedback">[\s\S]*?(?=\s*</aside>)',
              r'\s*<section class="feedback-section" id="feedback">[\s\S]*?</section>',
              r'\s*<button class="feedback-action"[\s\S]*?</button>\s*',
              r'\s*<div class="feedback-list" id="feedbackList">[\s\S]*?</div>\s*',
              r'\s*<div class="feedback-section-new" id="feedbackNew">[\s\S]*?</div>\s*',
              r'\s*<section id="ym-feedback-system"[\s\S]*?</section>\s*'
          ]
          removed = 0
          for pattern in patterns:
              s, n = re.subn(pattern, '', s, count=1, flags=re.S)
              removed += n
          print('Blocos removidos:', removed)
          p.write_text(s, encoding='utf-8')
      - name: Publicar alteracao
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Remover feedback visual abaixo dos codigos expirados [skip ci]'
          git push
