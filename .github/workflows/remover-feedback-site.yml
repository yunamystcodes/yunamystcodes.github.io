name: Remover feedback do site
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  remove-feedback:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remover exatamente o bloco grande de feedback
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'Dê o seu feedback'
          pos = s.find(marker)

          if pos == -1:
              print('Bloco de feedback não encontrado.')
          else:
              # O feedback é um bloco SECTION. Encontra a section que contém o título
              # e remove a section inteira, sem mexer nos códigos, FAQ ou rodapé.
              start = s.rfind('<section', 0, pos)
              end = s.find('</section>', pos)

              if start != -1 and end != -1:
                  end += len('</section>')
                  s = s[:start] + s[end:]
                  print('Bloco grande de feedback removido.')
              else:
                  # Fallback para versões em que o bloco foi criado como DIV.
                  start = s.rfind('<div', 0, pos)
                  if start != -1:
                      # Localiza a div balanceada que contém o marcador.
                      tag_re = re.compile(r'<(/?)div\b[^>]*>', re.I)
                      depth = 0
                      close_end = -1
                      for m in tag_re.finditer(s, start):
                          if m.start() > pos and depth == 0:
                              break
                          if m.group(1):
                              depth -= 1
                              if depth == 0 and m.end() > pos:
                                  close_end = m.end()
                                  break
                          else:
                              depth += 1
                      if close_end != -1:
                          s = s[:start] + s[close_end:]
                          print('Bloco grande de feedback (DIV) removido.')

          p.write_text(s, encoding='utf-8')
      - name: Publicar alteração
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Remover bloco grande de feedback [skip ci]'
          git push
