name: Remover feedback do site
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  remove-feedback:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remover blocos de feedback
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          def remove_balanced(html, pattern):
              m = re.search(pattern, html, re.I | re.S)
              if not m:
                  return html, False
              start = m.start()
              tag = m.group(1).lower()
              tag_re = re.compile(r'<(/?)' + tag + r'\b[^>]*>', re.I | re.S)
              depth = 0
              end = None
              for t in tag_re.finditer(html, start):
                  if t.group(1):
                      depth -= 1
                      if depth == 0:
                          end = t.end()
                          break
                  else:
                      depth += 1
              if end is None:
                  return html, False
              return html[:start] + html[end:], True

          # Remove the exact large feedback form shown in the screenshot.
          # It contains the player feedback controls and/or the feedback title.
          patterns = [
              r'<(section)\b[^>]*\bid=["\']feedback["\'][^>]*>',
              r'<(div)\b[^>]*\bclass=["\'][^"\']*feedback-section-new[^"\']*["\'][^>]*>',
              r'<(div)\b[^>]*\bid=["\']feedbackModalNew["\'][^>]*>',
              r'<(div)\b[^>]*\bclass=["\'][^"\']*feedback-modal-new[^"\']*["\'][^>]*>'
          ]

          total = 0
          changed = True
          while changed:
              changed = False
              for pattern in patterns:
                  s, removed = remove_balanced(s, pattern)
                  if removed:
                      total += 1
                      changed = True

          # Remove leftover feedback-position CSS so the deleted block cannot be recreated visually.
          s = re.sub(r'\s*<style id=["\']yunamyst-feedback-position-fix["\'][\s\S]*?</style>\s*', '\n', s, flags=re.I)

          p.write_text(s, encoding='utf-8')
          print('Blocos de feedback removidos:', total)
      - name: Publicar alteração
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Remover completamente o feedback do site [skip ci]'
          git push
