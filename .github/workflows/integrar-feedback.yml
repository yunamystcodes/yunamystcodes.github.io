name: Integrar feedback no index
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  integrar:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Adicionar botão de feedback ao index
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='class="feedback-open"'
          if marker not in s:
              button='<a class="feedback-open" href="feedback.html" target="_blank" rel="noopener noreferrer"><span>⭐</span><strong> Dê o seu feedback</strong><b>⌄</b></a>'
              css='''\n<style id="yunamyst-feedback-link">\n.feedback-open{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px;padding:14px 15px;border:1px solid rgba(190,102,255,.4);border-radius:14px;background:linear-gradient(180deg,rgba(12,7,29,.97),rgba(5,4,17,.97));color:#fff;text-decoration:none;font-size:13px;box-shadow:0 12px 30px rgba(0,0,0,.28)}\n.feedback-open span{font-size:20px}.feedback-open strong{flex:1}.feedback-open b{color:#d99cff;font-size:16px}\n.feedback-open:hover{border-color:#b65cff;box-shadow:0 0 15px rgba(156,76,255,.18)}\n@media(max-width:850px){.feedback-open{margin-top:10px;padding:13px 12px;font-size:13px;border-radius:13px}.feedback-open span{font-size:19px}}\n</style>\n'''
              needle='</div></aside></main><footer'
              if needle not in s:
                  raise SystemExit('Não encontrei o ponto de inserção do FAQ no index.html')
              s=s.replace(needle,'</div>'+button+'</aside></main><footer',1)
              s=s.replace('</head>',css+'</head>',1)
              p.write_text(s,encoding='utf-8')
      - name: Commit da alteração
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Adicionar botão de feedback ao index [skip ci]'
          git push
