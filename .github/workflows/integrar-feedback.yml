name: Integrar feedback no index
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  integrar:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Atualizar botão de feedback no index
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='class="feedback-open"'
          button='<button class="feedback-open" type="button" onclick="toggleFeedback()" aria-label="Abrir formulario de feedback"><span class="feedback-mail">✉</span><span class="feedback-star-icon">★</span><strong>Dê o seu feedback</strong><b>⌄</b></button>'
          css='''\n<style id="yunamyst-feedback-link">\n.feedback-open{display:flex;align-items:center;justify-content:flex-start;gap:10px;width:100%;margin-top:12px;padding:14px 15px;border:1px solid rgba(190,102,255,.4);border-radius:14px;background:linear-gradient(180deg,rgba(12,7,29,.97),rgba(5,4,17,.97));color:#fff;font-size:13px;font-weight:800;box-shadow:0 12px 30px rgba(0,0,0,.28);cursor:pointer;text-align:left}\n.feedback-open .feedback-mail{font-size:19px;line-height:1}.feedback-open .feedback-star-icon{font-size:20px;line-height:1;color:#ffd23f}.feedback-open strong{flex:1}.feedback-open b{color:#d99cff;font-size:16px;margin-left:auto}.feedback-open:hover{border-color:#b65cff;box-shadow:0 0 15px rgba(156,76,255,.18)}\n@media(max-width:850px){.feedback-open{margin-top:10px;padding:13px 12px;font-size:13px;border-radius:13px;gap:9px}.feedback-open .feedback-mail{font-size:18px}.feedback-open .feedback-star-icon{font-size:19px}}\n</style>\n'''
          if marker in s:
              s2=re.sub(r'<(?:a|button) class="feedback-open"[\\s\\S]*?</(?:a|button)>',button,s,count=1)
              if s2 == s:
                  raise SystemExit('Botão de feedback existente não foi encontrado para atualização.')
              s=s2
          else:
              needle='</div></aside></main><footer'
              if needle not in s:
                  raise SystemExit('Não encontrei o ponto de inserção do FAQ no index.html')
              s=s.replace(needle,'</div>'+button+'</aside></main><footer',1)
          if 'id="yunamyst-feedback-link"' not in s:
              s=s.replace('</head>',css+'</head>',1)
          p.write_text(s,encoding='utf-8')
      - name: Commit da alteração
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Ajustar icones do botao de feedback [skip ci]'
          git push
