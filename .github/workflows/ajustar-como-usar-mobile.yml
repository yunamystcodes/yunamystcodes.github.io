name: Ajustar Como Usar no telemóvel

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mostrar Como Usar e FAQ no telemóvel
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '.layout{display:block}.left,.right{display:none}.section-head'
          new = '.layout{display:block}.left{display:none}.right{display:block;margin-top:18px}.right .panel{width:100%}.section-head'
          if old not in s:
              raise SystemExit('CSS mobile esperado não encontrado no index.html')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Remover este workflow temporário
        run: rm -f .github/workflows/ajustar-como-usar-mobile.yml

      - name: Guardar alteração no index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/ajustar-como-usar-mobile.yml
          git diff --cached --quiet && exit 0
          git commit -m "Mostrar Como Usar e FAQ no mobile"
          git push
