name: Expired codes final fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final toggle
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='YUNA_EXPIRED_TOGGLE_FINAL_2026_08_18'
          if marker not in s:
              patch=r'''<!-- YUNA_EXPIRED_TOGGLE_FINAL_2026_08_18 -->
<style>.yuna-expired-collapsed > *:not(.yuna-expired-header){display:none!important}</style>
<script>
(function(){
function n(s){return (s||'').replace(/\s+/g,' ').trim()}
function h(t){var e=t;while(e&&e!==document.body){if(/^CÓDIGOS EXPIRADOS(?:\s*\(\d+\))?$/i.test(n(e.textContent)))return e;e=e.parentElement}return null}
function go(){if(document.documentElement.dataset.yunaFinalToggle)return;document.documentElement.dataset.yunaFinalToggle='1';document.addEventListener('click',function(e){var x=h(e.target);if(!x)return;e.preventDefault();e.stopImmediatePropagation();var p=x.parentElement;if(!p)return;x.classList.add('yuna-expired-header');var c=p.classList.toggle('yuna-expired-collapsed');x.setAttribute('role','button');x.setAttribute('aria-expanded',c?'false':'true')},true)}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',go);else go();
})();
</script>
'''
              s=s.replace('</body>',patch+'</body>')
              p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix expired codes collapse on PC and mobile'
          git push