name: Corrigir feedback dos players
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir index
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          for sid in ['yunamyst-feedback-styles','yunamyst-feedback-link','yuna-feedback-collapse-style','yunamyst-compact-feedback-list','yunamyst-feedback-script']:
            s=re.sub(r'<style id="'+sid+r'">[\s\S]*?</style>\s*','',s,1)
          for sid in ['yunamyst-feedback-modal-js','yuna-feedback-collapse-script']:
            s=re.sub(r'<script id="'+sid+r'">[\s\S]*?</script>\s*','',s,1)
          s=re.sub(r'<!-- YUNAMYST-FEEDBACK-SYSTEM-START -->[\s\S]*?<!-- YUNAMYST-FEEDBACK-SYSTEM-END -->\s*','',s,1)
          s=re.sub(r'<button class="feedback-open"[\s\S]*?</button>\s*','',s)
          s=re.sub(r'<section id="ym-feedback-system"[\s\S]*?</section>\s*','',s,1)
          s=re.sub(r'<section class="feedback-section"[\s\S]*?</section>\s*','',s,1)
          css='''<style id="yunamyst-feedback-final">.feedback-section{width:min(1100px,calc(100% - 28px));margin:24px auto 0;background:linear-gradient(180deg,rgba(12,7,29,.98),rgba(5,4,17,.98));border:1px solid rgba(190,102,255,.45);border-radius:18px;box-shadow:0 18px 45px rgba(0,0,0,.4);overflow:hidden}.feedback-head{padding:20px 22px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;justify-content:space-between;gap:12px}.feedback-head h2{font-size:22px}.feedback-summary{color:#d99cff;font-size:13px;font-weight:900}.feedback-action{width:calc(100% - 44px);height:46px;margin:18px 22px 10px;border:1px solid #edbd4e;border-radius:10px;background:linear-gradient(#f6cd70,#bd7d1d);color:#251400;font-weight:900;cursor:pointer}.feedback-list{display:flex;flex-direction:column;gap:10px;padding:10px 22px 22px}.feedback-empty{padding:18px;text-align:center;color:#a9a0b2;border:1px dashed rgba(190,102,255,.3);border-radius:12px}.feedback-review{padding:15px;border:1px solid rgba(180,80,255,.3);border-radius:12px;background:rgba(18,9,31,.7)}.feedback-review-top{display:flex;justify-content:space-between;gap:12px}.feedback-review-name{color:#d99cff;font-size:14px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.feedback-review-stars{color:#f4c83d;letter-spacing:1px;white-space:nowrap}.feedback-review-message{margin-top:8px;color:#ddd5e2;font-size:13px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}@media(max-width:850px){.feedback-section{width:calc(100% - 18px);margin-top:18px}.feedback-head{padding:16px 14px;display:block}.feedback-summary{display:block;margin-top:5px}.feedback-action{width:calc(100% - 28px);margin:14px}.feedback-list{padding:0 14px 16px}.feedback-review-message{font-size:12px}}</style>'''
          html='''<section class="feedback-section" id="feedback"><div class="feedback-head"><h2>⭐ Avaliações dos players</h2><div class="feedback-summary" id="feedbackSummary">0.0 / 5 • 0 avaliações</div></div><button class="feedback-action" type="button" onclick="toggleFeedback()">✉ DÊ O SEU FEEDBACK</button><div class="feedback-list" id="feedbackList"><div class="feedback-empty">Ainda não há avaliações de players.</div></div></section>'''
          s=s.replace('</main>', '</main>'+html, 1)
          js='''<script id="yunamyst-feedback-final-js">let feedbackEstrelas=0;function toggleFeedback(){document.getElementById('feedbackModal')?.classList.add('open')}function fecharFeedback(){document.getElementById('feedbackModal')?.classList.remove('open')}function fecharFeedbackFora(e){if(e.target.id==='feedbackModal')fecharFeedback()}function selecionarEstrela(n){feedbackEstrelas=n;document.querySelectorAll('.feedback-star-form').forEach((b,i)=>b.classList.toggle('selected',i<n));document.getElementById('feedbackStarsHelp').textContent=n+' de 5 estrelas'}function escFb(v){return String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}function carregarAvaliacoes(){const l=document.getElementById('feedbackList'),sum=document.getElementById('feedbackSummary');fetch('https://formspree.io/api/0/forms/mdenpbql/submissions?limit=100&order=desc').then(r=>r.ok?r.json():Promise.reject()).then(j=>{const rows=(j.submissions||[]).filter(x=>String(x._date||'')>='2026-08-24T00:00:00').filter(x=>!x._status||!x._status.spam);let total=0,n=0;l.innerHTML='';rows.forEach(x=>{const r=Number(x.rating||x.estrelas||x['rating (1-5)']||x['Estrelas']),name=(x.name||x.nome||x['Nome']||'Anónimo').trim(),msg=(x.message||x.mensagem||x['Feedback']||x['Message']||'').trim();if(!(r>=1&&r<=5)||!msg)return;total+=r;n++;const d=document.createElement('article');d.className='feedback-review';d.innerHTML='<div class="feedback-review-top"><span class="feedback-review-name">'+escFb(name)+'</span><span class="feedback-review-stars">'+('★'.repeat(r))+('☆'.repeat(5-r))+'</span></div><div class="feedback-review-message">'+escFb(msg)+'</div>';l.appendChild(d)});sum.textContent=(n?(total/n).toFixed(1):'0.0')+' / 5 • '+n+' '+(n===1?'avaliação':'avaliações');if(!n)l.innerHTML='<div class="feedback-empty">Ainda não há avaliações de players.</div>'}).catch(()=>{sum.textContent='0.0 / 5 • 0 avaliações';l.innerHTML='<div class="feedback-empty">Ainda não foi possível carregar as avaliações.</div>'})}function enviarFeedback(e){e.preventDefault();if(!feedbackEstrelas){alert('Escolhe de 1 a 5 estrelas antes de enviar.');return}const nome=(document.getElementById('feedbackNome').value||'Anónimo').trim(),msg=document.getElementById('feedbackMensagem').value.trim(),b=document.querySelector('#feedbackForm .feedback-send');if(b){b.disabled=true;b.textContent='A ENVIAR...'}fetch('https://formspree.io/f/mdenpbql',{method:'POST',headers:{Accept:'application/json','Content-Type':'application/json'},body:JSON.stringify({name:nome,rating:feedbackEstrelas,message:msg})}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(()=>{alert('Obrigado pelo teu feedback!');document.getElementById('feedbackForm').reset();feedbackEstrelas=0;document.querySelectorAll('.feedback-star-form').forEach(x=>x.classList.remove('selected'));fecharFeedback();carregarAvaliacoes()}).catch(()=>alert('Não foi possível enviar agora. Tenta novamente.')).finally(()=>{if(b){b.disabled=false;b.textContent='✉ ENVIAR FEEDBACK'}})}document.addEventListener('keydown',e=>{if(e.key==='Escape')fecharFeedback()});carregarAvaliacoes();</script>'''
          s=s.replace('</body>',js+'</body>',1)
          p.write_text(s,encoding='utf-8')
      - name: Publicar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Corrigir feedback e avaliações dos players [skip ci]'
          git push
