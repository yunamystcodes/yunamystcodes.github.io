name: Remover rodape duplicado uma vez
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remover somente o rodape duplicado
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          original=s
          # Remove somente a versao antiga identificada por id=rodape.
          s=re.sub(r'<footer\b[^>]*\bid=["\']rodape["\'][^>]*>.*?</footer>\s*','',s,flags=re.S|re.I)
          # Remove somente os estilos/scripts exclusivos da versao antiga.
          s=re.sub(r'<style\s+id=["\']yunamyst-footer-final["\'][^>]*>.*?</style>\s*','',s,flags=re.S|re.I)
          s=re.sub(r'<script\s+id=["\']yunamyst-footer-final-js["\'][^>]*>.*?</script>\s*','',s,flags=re.S|re.I)
          if s==original:
              raise SystemExit('Nenhuma duplicacao #rodape encontrada; nada foi alterado.')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Guardar somente a correcao do index e remover este workflow
        run: |
          git config user.name 'YunaMyst Site Bot'
          git config user.email 'actions@github.com'
          git rm .github/workflows/remove-duplicate-footer-once.yml
          git add index.html
          git commit -m 'Remover rodape duplicado do index [skip footer]'
          git push
