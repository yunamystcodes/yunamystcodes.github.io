name: Adicionar botão WhatsApp ao index

on:
  push:
    paths:
      - '.github/workflows/add-whatsapp-button.yml'

permissions:
  contents: write

jobs:
  add-button:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inserir botão WhatsApp
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          url = 'https://chat.whatsapp.com/KWg53GNpXDA3G5lDT8VwOg?s=cl&p=a&ilr=0'
          button = f'''<a class="community-tab whatsapp" href="{url}" target="_blank" rel="noopener" aria-label="WhatsApp"><span>WhatsApp</span><strong>💬 WHATSAPP</strong></a>'''
          if 'class="community-tab whatsapp"' in s:
              print('Botão WhatsApp já existe.')
          else:
              # Coloca o botão dentro da área de links da comunidade, antes da parceria.
              pattern = r'(<div class="community-links">)'
              if not re.search(pattern, s):
                  raise SystemExit('Área community-links não encontrada no index.html')
              s = re.sub(pattern, r'\1' + button, s, count=1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Publicar alteração e remover workflow temporário
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/add-whatsapp-button.yml
          git commit -m "Adicionar botão WhatsApp ao index"
          git push