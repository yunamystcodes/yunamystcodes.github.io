name: Corrigir aba de feedback

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-feedback:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Corrigir recolher/expandir do feedback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove as versões anteriores do código de recolher, inclusive as
          # que foram gravadas com barras invertidas literais.
          s = re.sub(r'<!-- YUNAMYST FEEDBACK COLLAPSE 20260822 -->.*?</style>\\?', '', s, flags=re.S)
          s = re.sub(r'<style id="yuna-feedback-collapse-style">.*?</style>\\?', '', s, flags=re.S)
          s = re.sub(r'<script id="yuna-feedback-collapse-script">.*?</script>\\?', '', s, flags=re.S)

          css = '''
<style id="yuna-feedback-collapse-fixed">
#ym-feedback-system{transition:max-height .3s ease,opacity .25s ease;overflow:hidden}
#ym-feedback-system.ym-collapsed{max-height:0!important;opacity:0!important;margin-top:0!important;border-width:0!important}
.feedback-open{cursor:pointer}
.feedback-open .feedback-arrow{display:inline-block;transition:transform .25s ease}
.feedback-open.is-collapsed .feedback-arrow{transform:rotate(-90deg)}
</style>
'''

          js = '''
<script id="yuna-feedback-collapse-fixed-js">
(function(){
  function setup(){
    const button=document.querySelector('.feedback-open');
    const panel=document.getElementById('ym-feedback-system');
    if(!button || !panel || button.dataset.collapseFixed) return;
    button.dataset.collapseFixed='1';

    // O botão passa a controlar apenas a área de avaliações/feedbacks.
    // O formulário continua disponível pelo próprio conteúdo do feedback.
    const oldOnclick=button.getAttribute('onclick');
    if(oldOnclick) button.removeAttribute('onclick');

    const arrow=button.querySelector('b');
    if(arrow){
      arrow.classList.add('feedback-arrow');
      arrow.textContent='⌄';
    }

    button.addEventListener('click',function(){
      const collapsed=panel.classList.toggle('ym-collapsed');
      button.classList.toggle('is-collapsed',collapsed);
      button.setAttribute('aria-expanded',String(!collapsed));
    });

    button.setAttribute('aria-expanded','true');
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',setup);
  else setup();
})();
</script>
'''

          if '</head>' in s:
              s=s.replace('</head>',css+'</head>',1)
          if '</body>' in s:
              s=s.replace('</body>',js+'</body>',1)
          else:
              s += js

          p.write_text(s,encoding='utf-8')
          PY

      - name: Publicar no index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git add index.html
          git commit -m "Corrigir recolher e expandir feedback"
          git push
