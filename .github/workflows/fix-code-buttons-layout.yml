name: Fix code buttons layout

on:
  push:
    paths:
      - '.github/workflows/fix-code-buttons-layout.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final button layout override
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<style id="yunamyst-button-layout-real-fix">'
          if marker in s:
              raise SystemExit('Fix already present')
          css = '''\n<style id="yunamyst-button-layout-real-fix">\n/* Real final layout: wrappers are positioned as one desktop row; mobile returns to stacked layout. */\n@media(min-width:851px){\n  .code{display:grid!important;grid-template-columns:52px minmax(120px,1fr) minmax(170px,1fr) 220px!important;gap:8px!important;align-items:center!important;min-width:0!important;overflow:hidden!important;}\n  .code-top{display:contents!important;}\n  .code-top>.gift{grid-column:1!important;min-width:0!important;}\n  .code-top>.cinfo{grid-column:2!important;min-width:0!important;}\n  .code>.rewards{grid-column:3!important;min-width:0!important;width:100%!important;display:flex!important;align-items:center!important;justify-content:center!important;gap:8px!important;overflow:hidden!important;}\n  .code>.actions{grid-column:4!important;display:flex!important;gap:8px!important;width:100%!important;min-width:0!important;}\n  .code>.actions>.copy,.code>.actions>.link{flex:1 1 0!important;width:50%!important;min-width:0!important;max-width:none!important;height:44px!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important;}\n}\n@media(max-width:1050px) and (min-width:851px){\n  .code{grid-template-columns:48px minmax(95px,1fr) minmax(125px,1fr) 190px!important;gap:6px!important;}\n  .code>.actions{gap:6px!important;}\n}\n@media(max-width:850px){\n  .code{display:flex!important;flex-direction:column!important;align-items:stretch!important;gap:9px!important;padding:12px 9px!important;width:100%!important;min-width:0!important;overflow:visible!important;}\n  .code-top{display:flex!important;align-items:center!important;gap:10px!important;width:100%!important;min-width:0!important;}\n  .code-top>.gift{width:44px!important;height:44px!important;flex:none!important;}\n  .code-top>.cinfo{flex:1!important;min-width:0!important;}\n  .code>.rewards{display:flex!important;flex-wrap:wrap!important;align-items:flex-start!important;justify-content:center!important;gap:7px!important;width:100%!important;min-width:0!important;overflow:visible!important;}\n  .code>.actions{display:flex!important;gap:8px!important;width:100%!important;min-width:0!important;}\n  .code>.actions>.copy,.code>.actions>.link{flex:1 1 0!important;width:50%!important;min-width:0!important;max-width:none!important;height:46px!important;font-size:11px!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important;}\n}\n</style>\n'''
          s = s.replace('</head>', css + '</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix code card copy and iOS buttons layout'
          git push
