name: Fix expired codes toggle

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch index.html
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'YUNA_EXPIRED_TOGGLE_FINAL_2026_08_17'
          if marker not in s:
              script = r'''\n<!-- YUNA_EXPIRED_TOGGLE_FINAL_2026_08_17 -->\n<style>\n.yuna-expired-collapsed{display:none!important}\n</style>\n<script>\n(function(){\n  function headerFor(node){\n    var el=node.closest('h1,h2,h3,h4,h5,h6,button,summary,div,span,a');\n    while(el && el!==document.body){\n      var t=(el.textContent||'').replace(/\\s+/g,' ').trim();\n      if(t.length<=120 && /CÓDIGOS EXPIRADOS(?:\\s*\\(\\d+\\))?/i.test(t)) return el;\n      el=el.parentElement;\n    }\n    return null;\n  }\n  function findList(header){\n    var parent=header.parentElement;\n    if(!parent) return null;\n    var children=[].slice.call(parent.children).filter(function(x){return x!==header;});\n    var list=children.find(function(x){\n      return x.matches && (x.matches('.codes,.yuna-expired-list,[class*="expired"],[id*="expired"]') || x.querySelector('.yuna-expired-list,.code,[class*="expired"]'));\n    });\n    if(list) return list;\n    var next=header.nextElementSibling;\n    if(next && (next.querySelector('.code,.yuna-expired-item,[class*="expired"]') || next.className && String(next.className).toLowerCase().indexOf('expired')>=0)) return next;\n    return null;\n  }\n  function setup(){\n    document.querySelectorAll('h1,h2,h3,h4,h5,h6,button,summary,div,span,a').forEach(function(el){\n      var t=(el.textContent||'').replace(/\\s+/g,' ').trim();\n      if(t.length>120 || !/CÓDIGOS EXPIRADOS(?:\\s*\\(\\d+\\))?/i.test(t) || el.dataset.yunaFinalToggle==='1') return;\n      var list=findList(el);\n      if(!list) return;\n      el.dataset.yunaFinalToggle='1';\n      el.style.cursor='pointer';\n      el.setAttribute('role','button');\n      el.setAttribute('aria-expanded','true');\n      el.addEventListener('click',function(e){\n        if(e.target.closest('a,button') && e.target!==el) return;\n        var closed=list.classList.toggle('yuna-expired-collapsed');\n        list.style.setProperty('display',closed?'none':'','important');\n        el.setAttribute('aria-expanded',closed?'false':'true');\n      });\n    });\n  }\n  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',setup); else setup();\n  new MutationObserver(setup).observe(document.body,{childList:true,subtree:true});\n})();\n</script>\n'''
              s = s.replace('</body>', script + '</body>')
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "YunaMyst Fix"
          git config user.email "actions@users.noreply.github.com"
          rm -f .github/workflows/yuna-expired-toggle-fix.yml
          git add index.html .github/workflows/yuna-expired-toggle-fix.yml
          git diff --cached --quiet && exit 0
          git commit -m "Fix expired codes collapse behavior"
          git push