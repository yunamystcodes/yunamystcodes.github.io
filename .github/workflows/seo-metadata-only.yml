name: SEO metadata only

on:
  push:
    paths:
      - '.github/workflows/seo-metadata-only.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update only SEO metadata
        shell: python
        run: |
          from pathlib import Path
          from datetime import datetime
          import re
          import json

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          year = datetime.utcnow().year

          title = f'Summoners War — Códigos Ativos {year} | YunaCodes'
          description = f'Códigos de Summoners War ativos em {year}, recompensas grátis e últimos códigos disponíveis. Lista atualizada regularmente no YunaCodes.'

          html, title_count = re.subn(
              r'<title>.*?</title>',
              f'<title>{title}</title>',
              html,
              count=1,
              flags=re.DOTALL,
          )
          if title_count != 1:
              raise SystemExit('Não foi possível localizar exatamente um <title>.')

          html, desc_count = re.subn(
              r'<meta\s+name=["\']description["\']\s+content=["\'][^"\']*["\']\s*/?>',
              f'<meta name="description" content="{description}">',
              html,
              count=1,
              flags=re.IGNORECASE,
          )
          if desc_count != 1:
              raise SystemExit('Não foi possível localizar exatamente uma meta description.')

          canonical = '<link rel="canonical" href="https://yunacodes.com/">'
          if 'rel="canonical"' not in html.lower():
              html = html.replace('</head>', f'{canonical}\n</head>', 1)

          if 'application/ld+json' not in html:
              schema = {
                  '@context': 'https://schema.org',
                  '@type': 'WebSite',
                  'name': 'YunaCodes',
                  'alternateName': 'YunaMyst Codes',
                  'url': 'https://yunacodes.com/',
                  'description': description,
                  'inLanguage': ['pt-BR', 'en']
              }
              jsonld = '<script type="application/ld+json">\n' + json.dumps(schema, ensure_ascii=False, indent=2) + '\n</script>'
              html = html.replace('</head>', jsonld + '\n</head>', 1)

          path.write_text(html, encoding='utf-8')

      - name: Commit SEO-only change
        shell: bash
        run: |
          git config user.name "YunaMyst Codes Bot"
          git config user.email "actions@github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Nenhuma alteração SEO necessária."
            exit 0
          fi
          git commit -m "Melhorar SEO da página inicial"
          git push
