<!doctype html>
<html lang="pt-PT">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description"
content="YunaMyst - Códigos de Summoners War: Sky Arena. Códigos novos e ativos para resgatar recompensas.">

<meta name="theme-color" content="#070313">

<title>YunaMyst • Códigos Summoners War</title>

<style>

/* =========================================================
   YUNAMYST
   VERSÃO PC + VERSÃO TELEMÓVEL
   ========================================================= */

:root{
    --bg:#070313;
    --panel:rgba(12,5,28,.94);
    --panel2:rgba(25,7,48,.82);
    --purple:#c77cff;
    --purple2:#8e35e9;
    --gold:#f4c13d;
    --green:#35f27c;
    --line:#7b2bd1;
    --text:#ffffff;
    --muted:#b9aecb;
}

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    min-height:100%;
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--text);
}

body{
    overflow-x:hidden;
    background:
        radial-gradient(
            circle at 50% 20%,
            rgba(73,39,150,.50),
            transparent 42%
        ),
        linear-gradient(
            180deg,
            #090316,
            #120525 48%,
            #05020d
        );
}

a{
    color:inherit;
}

button{
    font-family:inherit;
}


/* =========================================================
   ELEMENTOS COMUNS
   ========================================================= */

.brand{
    font-family:Georgia,serif;
    font-weight:800;
    color:#fff;
    text-shadow:0 2px 0 #bda4ff;
    line-height:.9;
}

.brand small{
    display:block;
    color:#f0bf45;
    font-family:Arial,sans-serif;
    font-weight:700;
    letter-spacing:5px;
}

.lang{
    border:1px solid #a66be5;
    border-radius:18px;
    background:rgba(12,5,29,.72);
    font-weight:700;
}

.whatsapp{
    display:flex;
    align-items:center;
    text-decoration:none;
    border:2px solid #8e35e9;
    background:rgba(22,5,42,.88);
    color:#fff;
}

.wa-icon{
    flex:0 0 auto;
    border-radius:50%;
    display:grid;
    place-items:center;
    background:#16dc6b;
    color:#03120a;
}

.whatsapp strong{
    display:block;
    color:#43f287;
}

.whatsapp p{
    margin:0;
    color:#e6dff0;
}

.arrow{
    margin-left:auto;
}

.panel{
    background:rgba(8,3,20,.94);
    border:1px solid #7a2bd0;
    overflow:hidden;
}

.panel-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    border-bottom:1px solid rgba(160,84,230,.25);
    font-weight:800;
}

.updated{
    color:#d596ff;
}

.code-card{
    border:1px solid #8a37e0;
    background:rgba(25,7,48,.74);
    position:relative;
}

.new{
    position:absolute;
    background:#ff315f;
    font-weight:800;
    transform:rotate(-45deg);
}

.gift{
    border-radius:50%;
    display:grid;
    place-items:center;
    border:1px solid #9e49ee;
    background:radial-gradient(
        circle,
        #6a22a6,
        #241044
    );
}

.code{
    font-weight:800;
}

.date{
    color:var(--muted);
}

.actions{
    display:flex;
    align-items:center;
}

button,
.iphone{
    border:0;
    cursor:pointer;
    text-decoration:none;
    text-align:center;
    font-weight:800;
    white-space:nowrap;
}

.copy{
    background:linear-gradient(
        #ffd35d,
        #e9aa20
    );
    color:#120900;
}

.copy.copied{
    background:#35f27c;
    color:#07130b;
}

.iphone{
    background:#f4f4f7;
    color:#111;
}

.all{
    text-align:center;
    color:var(--gold);
    font-weight:800;
}

footer{
    text-align:center;
    color:#9f94b1;
}


/* =========================================================
   PC / NOTEBOOK
   A partir de 901px
   ========================================================= */

.mobile-version{
    display:none;
}

.desktop-version{
    display:block;
}


/* HEADER PC */

.desktop-top{
    height:76px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 5.5%;
    background:
        linear-gradient(
            90deg,
            #080212,
            #100523,
            #080212
        );
    border-bottom:1px solid rgba(180,100,255,.18);
}

.desktop-brand{
    font-size:31px;
}

.desktop-brand small{
    font-size:9px;
    margin-left:5px;
    margin-top:6px;
    letter-spacing:4px;
}

.desktop-nav{
    display:flex;
    align-items:center;
    gap:30px;
    margin-left:auto;
    margin-right:30px;
}

.desktop-nav a{
    text-decoration:none;
    font-weight:800;
    font-size:14px;
    color:#fff;
    transition:.2s;
}

.desktop-nav a:hover{
    color:var(--purple);
}

.desktop-lang{
    padding:11px 15px;
    border-radius:14px;
    font-size:16px;
}


/* ÁREA PRINCIPAL PC */

.desktop-main{
    min-height:calc(100vh - 76px);
    padding:26px 6%;
    background:
        radial-gradient(
            ellipse at center top,
            rgba(55,35,140,.38),
            transparent 55%
        ),
        linear-gradient(
            180deg,
            #171344 0%,
            #100827 55%,
            #06020e 100%
        );
}


/* HERO COMPACTO PC */

.desktop-whatsapp{
    width:min(650px,100%);
    margin:0 auto 26px;
    padding:14px 20px;
    border-radius:22px;
    gap:16px;
}

.desktop-whatsapp .wa-icon{
    width:48px;
    height:48px;
    font-size:25px;
}

.desktop-whatsapp strong{
    font-size:17px;
    margin-bottom:3px;
}

.desktop-whatsapp p{
    font-size:13px;
}

.desktop-whatsapp .arrow{
    font-size:28px;
}
